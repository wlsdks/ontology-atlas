[package]
name = "source-scan"
version = "0.1.0"
description = "Files under a source root: staleness of cited paths, imports read from syntax trees, and the architecture check over them"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
answer-format = { path = "../answer-format" }
confined-files = { path = "../confined-files" }
hardened-git = { path = "../hardened-git" }
# An architecture profile is a document of the vault: its frontmatter is read by the vault's reader.
vault-document = { path = "../vault-document" }
# Typed answers: the field order of a struct is the key order the agent reads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A focus page names each edge by a hash of its identity, stable while the evidence is.
sha2 = { version = "0.11.1", default-features = false }
# A repository's configuration files keep their keys in the order written: the first listed
# entry point of a package is tried first.
indexmap = { version = "2", features = ["serde"] }
# Imports and declarations are read from a syntax tree, never from lines of text. Every grammar is
# MIT on crates.io; `cargo bloat` figures per grammar are in README.md.
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
