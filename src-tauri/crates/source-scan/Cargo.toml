[package]
name = "source-scan"
version = "0.1.0"
description = "Staleness of cited paths and files under a source root; imports, outlines and search join as their tools are ported"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
confined-files = { path = "../confined-files" }
hardened-git = { path = "../hardened-git" }
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"

[lints]
workspace = true
