[package]
name = "confined-files"
version = "0.1.0"
description = "The one type that opens, reads and writes files under a vault or source root"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# One walk of a vault, in an order that does not depend on the file system. MIT or Unlicense;
# the app already links it.
walkdir = "2.5"
# A Windows path without the `\\?\` prefix `canonicalize` adds, so a real path prints and compares
# as Node's `realpath` does. A no-op elsewhere. CC0-1.0 or MIT or Apache-2.0; already linked.
dunce = "1.0"
# `\p{Cc}` and `\p{Cf}`, the invisible characters a write tool never names in a slug.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl", "unicode-gencat"] }
# NFC for slugs and NFKC for the instruction-file names; the app already links this exact version.
icu_normalizer = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
# The immutable source snapshot the app hands the program, and a file's hash in the read boundary.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
# A modification time in the text JavaScript gives a number, so a conflict message reads the same.
ryu-js = "1"

[target.'cfg(unix)'.dependencies]
# `access(2)` for the writability pre-check and `fcntl` for the snapshot descriptor; the app
# already links this version.
libc = "=0.2.186"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"

[lints]
workspace = true
