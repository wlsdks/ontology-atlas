[package]
name = "vault-index"
version = "0.1.0"
description = "Rebuildable full-text index of a vault's Markdown files, kept in the OS cache directory"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
# SQLite is compiled from the bundled amalgamation (public domain) so FTS5 and WAL do not depend on
# the operating system's SQLite build.
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "cache"] }
sha2 = "=0.10.9"
# Row values are DEFLATE-compressed: the JSON a build derives is as large as the vault's text. The
# app already links this exact version (png, through tray-icon and the updater), so it adds no crate.
miniz_oxide = "=0.8.9"

[target.'cfg(unix)'.dependencies]
# `statfs`, which names the file system a vault sits on; the app already links this version.
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
# NTFS change time (`FILE_BASIC_INFO.ChangeTime`), which moves when a tool puts back a file's
# modified time; the app already links this version.
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true

[features]
# Lets a release build (the benchmark) read OATLAS_INDEX_DIR; the app never enables it.
index-dir-override = []

[[bin]]
name = "vault-index-bench"
path = "src/bin/vault-index-bench.rs"
test = false

[dev-dependencies]
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "cache"] }
