[package]
name = "project-source"
version = "0.1.0"
description = "The code folder a project node describes: one probe and fingerprint of it, the receipt that records what was measured, and the sidecar file that keeps the binding"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
answer-format = { path = "../answer-format" }
confined-files = { path = "../confined-files" }
hardened-git = { path = "../hardened-git" }
# A node's frontmatter, as the vault parses it.
vault-document = { path = "../vault-document" }
# Paths are compared composed (NFC), the one spelling a Windows, macOS and Linux checkout share.
icu_normalizer = { version = "=2.2.0", default-features = false, features = ["compiled_data"] }
# A stored binding keeps its keys in the order they were written, so a write that touches one
# project's binding never reorders another's.
indexmap = { version = "2", features = ["serde"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
