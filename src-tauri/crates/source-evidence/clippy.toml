# The clippy.toml of every family crate (vault-document, ontology-graph, source-evidence). A family
# crate reaches the disk through `confined-files` and runs `git` through `hardened-git`, so the
# standard library's own entry points are disallowed there. Clippy resolves each path to the item,
# so an alias (`use std as s`), a macro expansion, a `#[path]` module and a raw string cannot hide
# a use. `tests/family_boundary.rs` holds every family crate's copy equal to this file and runs
# clippy over a planted crate to prove each line below can fail.
#
# The first three lines are the workspace's own `clippy.toml`, repeated because Clippy reads
# the nearest file only.
allow-unwrap-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true

disallowed-types = [
  { path = "std::fs::File", reason = "open files through confined-files" },
  { path = "std::fs::OpenOptions", reason = "open files through confined-files" },
  { path = "std::fs::DirEntry", reason = "list folders through confined-files" },
  { path = "std::fs::ReadDir", reason = "list folders through confined-files" },
  { path = "std::fs::Metadata", reason = "ask about files through confined-files" },
  { path = "std::process::Command", reason = "run programs through hardened-git" },
  { path = "std::process::Child", reason = "run programs through hardened-git" },
]

disallowed-methods = [
  { path = "std::fs::read", reason = "read files through confined-files" },
  { path = "std::fs::read_to_string", reason = "read files through confined-files" },
  { path = "std::fs::read_dir", reason = "list folders through confined-files" },
  { path = "std::fs::read_link", reason = "resolve links through confined-files" },
  { path = "std::fs::write", reason = "write files through confined-files" },
  { path = "std::fs::copy", reason = "write files through confined-files" },
  { path = "std::fs::rename", reason = "write files through confined-files" },
  { path = "std::fs::hard_link", reason = "write files through confined-files" },
  { path = "std::fs::soft_link", reason = "write files through confined-files" },
  { path = "std::fs::create_dir", reason = "write files through confined-files" },
  { path = "std::fs::create_dir_all", reason = "write files through confined-files" },
  { path = "std::fs::remove_file", reason = "write files through confined-files" },
  { path = "std::fs::remove_dir", reason = "write files through confined-files" },
  { path = "std::fs::remove_dir_all", reason = "write files through confined-files" },
  { path = "std::fs::set_permissions", reason = "write files through confined-files" },
  { path = "std::fs::canonicalize", reason = "resolve links through confined-files" },
  { path = "std::fs::metadata", reason = "ask about files through confined-files" },
  { path = "std::fs::symlink_metadata", reason = "ask about files through confined-files" },
  { path = "std::fs::exists", reason = "ask about files through confined-files" },
  { path = "std::fs::File::open", reason = "open files through confined-files" },
  { path = "std::fs::File::create", reason = "open files through confined-files" },
  { path = "std::fs::File::create_new", reason = "open files through confined-files" },
  { path = "std::fs::File::options", reason = "open files through confined-files" },
  { path = "std::fs::OpenOptions::open", reason = "open files through confined-files" },
  { path = "std::path::Path::exists", reason = "ask about files through confined-files" },
  { path = "std::path::Path::try_exists", reason = "ask about files through confined-files" },
  { path = "std::path::Path::is_file", reason = "ask about files through confined-files" },
  { path = "std::path::Path::is_dir", reason = "ask about files through confined-files" },
  { path = "std::path::Path::is_symlink", reason = "ask about files through confined-files" },
  { path = "std::path::Path::metadata", reason = "ask about files through confined-files" },
  { path = "std::path::Path::symlink_metadata", reason = "ask about files through confined-files" },
  { path = "std::path::Path::canonicalize", reason = "resolve links through confined-files" },
  { path = "std::path::Path::read_dir", reason = "list folders through confined-files" },
  { path = "std::path::Path::read_link", reason = "resolve links through confined-files" },
  { path = "std::process::Command::new", reason = "run programs through hardened-git" },
  { path = "std::process::Command::spawn", reason = "run programs through hardened-git" },
  { path = "std::process::Command::output", reason = "run programs through hardened-git" },
  { path = "std::process::Command::status", reason = "run programs through hardened-git" },
  # Only one platform has each of these, so a path that is missing on the other is not an error.
  { path = "std::os::unix::fs::symlink", reason = "write files through confined-files", allow-invalid = true },
  { path = "std::os::unix::fs::chown", reason = "write files through confined-files", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "write files through confined-files", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "write files through confined-files", allow-invalid = true },
]
