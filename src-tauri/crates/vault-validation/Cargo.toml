[package]
name = "vault-validation"
version = "0.1.0"
description = "What validate_vault reports: the findings of a whole vault, whether its summaries and cited code are current, and the page an agent reads"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
answer-format = { path = "../answer-format" }
confined-files = { path = "../confined-files" }
hardened-git = { path = "../hardened-git" }
meaning-findings = { path = "../meaning-findings" }
source-scan = { path = "../source-scan" }
vault-document = { path = "../vault-document" }
# Typed answers: the field order of a struct is the key order the agent reads.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A revision's body is compared by its SHA-256; the workspace links this exact version already.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
sha2 = { version = "0.11.1", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
