[package]
name = "mcp-server"
version = "0.1.0"
description = "The ontology-atlas-mcp program: stdio protocol loop, tool registry, answer envelope and tool handlers"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "mcp_server"
path = "src/lib.rs"

# Named apart from the shipped program until cut-over: the app's build script writes the sidecar
# `ontology-atlas-mcp` into `target/<profile>/`, and a Cargo binary of that name would overwrite it,
# so the dev app would serve this unfinished server. The cut-over renames it back.
[[bin]]
name = "ontology-atlas-mcp-rust"
path = "src/main.rs"

[dependencies]
analysis-archive-format = { path = "../analysis-archive-format" }
answer-format = { path = "../answer-format" }
confined-files = { path = "../confined-files" }
hardened-git = { path = "../hardened-git" }
vault-document = { path = "../vault-document" }
ontology-graph = { path = "../ontology-graph" }
source-scan = { path = "../source-scan" }
# The breadth map `analyze_repo_structure` answers with.
repository-survey = { path = "../repository-survey" }
vault-validation = { path = "../vault-validation" }
meaning-findings = { path = "../meaning-findings" }
raw-source-text = { path = "../raw-source-text" }
# Answers are typed structs written as JSON. `raw_value` sends the tool list as the text the
# generator wrote and keeps what an agent nests in its arguments unread until a handler wants it.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Arguments and parameters keep the order the agent sent them in. `serde` only: `serde_json`'s
# `preserve_order`, which Cargo would switch on for the app's maps too, stays off.
indexmap = { version = "2", features = ["serde"] }
# The errors a request or a call fails with, each with its message.
thiserror = "2"
# The hash of the tool list `connection_info` reports; already built for the document crate.
sha2 = { version = "0.11.1", default-features = false }
# Edit distance for "did you mean"; MIT, already in the lockfile through the app's dependencies.
strsim = "0.11"
# Hidden characters in a question shown to a person are spelled out, by Unicode category.
# Random ids for an agent session and a map analysis; the app already links it (v4 only).
uuid = { version = "1", default-features = false, features = ["v4"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat"] }

[features]
# Pause points and answers only a test build has: tools not yet ported reply `not_ported`, and
# `__test_*` tools exercise cancellation, panics and a call that waits off the queue. The release
# build never enables it; the crate's own tests do, through the dev-dependency below.
test-hooks = []

[dev-dependencies]
mcp-server = { path = ".", features = ["test-hooks"] }
tempfile = "3"

[lints]
workspace = true
