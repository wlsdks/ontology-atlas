[package]
name = "ontology-atlas"
version = "1.0.0-rc.9"
description = "Local-first codebase ontology workbench"
authors = ["ontology-atlas contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ontology_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
# serde_json · sha2 · chrono are transitive deps already pulled by tauri — declaring
# direct dependencies adds zero new supply-chain surface (same rationale as objc2). One line
# of audit log used only for serialization, payload hash anchor, and ISO-8601 timestamps.
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
notify-debouncer-full = "0.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"

# libc is also a transitive dep already pulled by tauri (0.2, single version in Cargo.lock) —
# declaring it directly adds zero new supply-chain surface (same rationale as objc2).
#
# It is used in one place: terminating the ACP harness **by process group**. The adapter spawns
# its own children (real CLI · MCP server), so `Child::kill()` alone leaves grandchildren
# orphaned. The standard library provides no way to send signals to a process group.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# objc2 is a transitive dep already pulled by tauri — zero new supply-chain surface.
# Used only for WKWebView's 60fps rAF release (ProMotion 120Hz).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
