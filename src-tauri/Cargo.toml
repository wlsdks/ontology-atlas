[package]
name = "ontology-atlas"
version = "0.1.0"
description = "Local-first codebase ontology workbench"
authors = ["ontology-atlas contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "ontology_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
# serde_json · sha2 · chrono 는 tauri 가 이미 끌어오는 transitive dep — 직접
# 의존을 선언해도 신규 공급망 표면 0 (objc2 와 같은 근거). 감사 로그 한 줄
# 직렬화 · 페이로드 해시 앵커 · ISO-8601 시각에만 쓴다.
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
notify-debouncer-full = "0.3"
keyring = { version = "3", features = ["apple-native"] }

# objc2 는 tauri 가 이미 끌어오는 transitive dep — 신규 공급망 표면 0.
# WKWebView 의 60fps rAF 캡 해제 (ProMotion 120Hz)에만 사용.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
