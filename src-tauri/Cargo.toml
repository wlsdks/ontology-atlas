[package]
name = "ontology-atlas"
version = "2.7.11"
description = "Local-first codebase ontology workbench"
authors = ["ontology-atlas contributors"]
edition = "2021"
license = "MIT"

[workspace]
members = ["crates/vault-index"]

# A panic in a sync Tauri command runs on the main thread and takes the app down, so non-test code
# reports an error instead. `clippy.toml` lets tests keep using these.
[workspace.lints.clippy]
unwrap_used = "warn"
indexing_slicing = "warn"
panic = "warn"

[lints]
workspace = true

[lib]
name = "ontology_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }
# Writes the tiny synthetic `pytorch_model.bin` the conversion tests read; candle already uses it.
zip = { version = "9", default-features = false }

[dependencies]
# 2.11.6 is the floor: earlier 2.x let another webview read queued channel payloads
# (GHSA-w28w-mhc8-qvjv).
tauri = { version = "2.11.6", features = ["tray-icon"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# serde_json is a transitive dep already pulled by tauri — declaring it adds zero new
# supply-chain surface (same rationale as objc2). chrono is ours alone and RustSec marks it
# unmaintained (RUSTSEC-2026-0543); `time` is already in the graph through tauri if it moves.
# Used for serialization, payload hash anchors, and RFC 3339 timestamps.
serde_json = "1"
# sha2 0.11 picks the ARMv8 SHA-256 instructions at run time (0.10 did only with `asm`): 6.5x
# measured on Apple Silicon. Its five new crates are RustCrypto's, MIT OR Apache-2.0; the unused
# `oid` and `alloc` defaults stay off. Tauri's build-time codegen still uses 0.10.
sha2 = { version = "0.11.1", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
notify-debouncer-full = "0.3"
# Already in the graph (1.13.2, through tokenizers and tauri-utils): no new crate. Work status cuts a
# session's name at 60 user-perceived characters, as the page counts them, never inside one.
unicode-segmentation = "1"
futures-util = "0.3"
tokio = { version = "1.53.3", features = ["io-util", "process", "rt", "sync", "time"] }
tauri-plugin-updater = { version = "2.10.1", default-features = false, features = ["rustls-tls"] }
# The updater already depends on semver 1 and hands the comparator its `Version`; naming the crate
# lets `update_offer.rs` read precedence and build metadata. No new crate enters the graph.
semver = "1"
tauri-plugin-process = "2.3.1"
# A packaged `.app` has nowhere to print. Every `println!` in this crate is inside `#[cfg(test)]`,
# so an installed build previously explained nothing after the fact — an owner reporting "the agent
# stopped" left no evidence behind at all. This writes a rotating file into the OS log directory,
# outside the vault, and mirrors to stderr under `tauri dev`. Vault content and secrets are never
# logged; the LLM transfer ledger stays in `llm_audit.rs`, which this does not replace.
tauri-plugin-log = "2.9.0"
# Restores the window the owner left, which a workbench owes them. The plugin restores size in
# *physical* pixels with no monitor check of its own, so `sanitize_window_geometry` clamps every
# launch — restored or not — and the plugin is not registered at all under the verification harness,
# which must not inherit or write the owner's geometry.
tauri-plugin-window-state = "2.4.1"
# log is a transitive dep already pulled by tauri (0.4, single version in Cargo.lock) — declaring it
# directly adds zero new supply-chain surface (same rationale as objc2).
log = "0.4"
vault-index = { path = "crates/vault-index" }
# The built-in bge-m3 model: candle reads `pytorch_model.bin` without executing it; tokenizers and
# safetensors are the copies candle already resolves (`fancy-regex` keeps them pure Rust); url is
# already in the graph through tauri and parses the download's redirect targets.
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
safetensors = "=0.8.0"
url = "2"
# The model worker finds the model where the app keeps it, by the rule Tauri's
# `app_data_dir` uses; the same dirs 6 tauri already resolves.
dirs = "6"

# Unix process-group termination also clears descendants of failed ACP probes.
# libc is already in the resolved dependency graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Two instances of this app pointed at one vault means two file watchers, two ACP harnesses, two MCP
# sidecars and two writers against the same Markdown. Vault files are the source of truth here, so
# concurrent writers are the one failure this product cannot absorb — and the updater's restart makes
# a second launch a routine event, not an exotic one. Desktop-only by construction: the plugin does
# not exist for mobile targets.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
# Registers `ontology-atlas://` with the OS so a vendor page's "Add to Atlas" button can reach the
# installed app. Official Tauri plugin, MIT OR Apache-2.0, same workspace and release train as the
# updater, process, log, window-state and single-instance plugins already here — no new publisher.
# `src-tauri/src/app_shell/deep_link.rs` answers exactly one grammar and drops everything else; the payload is
# read by the same strict parser the web `?install=` address already feeds.
tauri-plugin-deep-link = "2.4.10"

# objc2 is a transitive dep already pulled by tauri — zero new supply-chain surface.
# Used only for WKWebView's 60fps rAF release (ProMotion 120Hz).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSDictionary", "NSArray"] }
keyring = { version = "3", features = ["apple-native"] }
# The built-in model's GPU (Metal) and CPU (Accelerate) paths; Windows and Linux run candle on the CPU.
candle-core = { version = "=0.11.1", features = ["metal", "accelerate"] }
candle-nn = { version = "=0.11.1", features = ["metal", "accelerate"] }
candle-transformers = { version = "=0.11.1", features = ["metal", "accelerate"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Already in the resolved graph (0.61.2, through tokio, tauri and others): no new crate. The audit
# log needs `LockFileEx`, `GetFinalPathNameByHandleW` and `GetFileInformationByHandle`, which std
# does not expose, to hold the same before-send guarantee on Windows as `openat` does on Unix.
# Work status reads one locked pid's creation time with `OpenProcess` and `GetProcessTimes`.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

# "Show in Explorer" and its Linux equivalent: the official opener plugin's Rust function
# `reveal_item_in_dir`, called only from commands that have already resolved the path inside
# a granted vault. The plugin is not registered, so the WebView gets none of its commands and
# no capability names it. macOS keeps `open -R` / `open -a Finder` and does not link it.
# Pinned below 2.6, which requires tauri 2.12; a tauri upgrade can lift the pin.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-opener = "~2.5.5"

# Cargo's release defaults leave 16 codegen units, no cross-crate inlining, and full debug symbols.
# Measured on this app: these three take the Rust half of the binary from 13.4 MB to 8.3 MB under fat
# LTO, with no change to what the code means. Thin LTO adds 0.75 MB (1.7% of the binary), times the
# same on the hashing and walking paths, and shortens the release build.
#
# Tauri's size guidance names two more that are deliberately absent.
# `opt-level = "s"` saves a further 1.5 MB by optimising for size over speed; the Rust half of this
# app hashes and walks vault files, and 1.5 MB of an 89 MB bundle does not justify trading throughput
# nobody has measured.
# `panic = "abort"` saves 1.7 MB and changes what a bug costs: today a panic inside one command fails
# that command and leaves the window standing, and with abort it takes the whole app down. For a
# workbench holding an owner's unsaved judgement that is the wrong trade at any size.
#
# Keep line tables in a packed dSYM for crash symbolication, and strip the shipping binary.
# CI retains the matching dSYM UUID; without it, stripped crash addresses cannot resolve to
# source files and lines.
[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "packed"
strip = true

# The index's tests build and kill a 10,000-file index twenty times; unoptimised SQLite makes that
# minutes instead of seconds.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.vault-index]
opt-level = 3

# macOS rejects some stripped proc-macro dylibs (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
