[mcp_servers.ontology-atlas]
command = "node"
args = ["./mcp/src/index.js"]

[mcp_servers.ontology-atlas.env]
OATLAS_VAULT = "./docs/ontology"
OATLAS_REPO_ROOT = "."

# Declared because eight design seats and the craft PO seat grant
# `mcp__chrome-devtools__*` in their `tools:` frontmatter, and the two agent-brief
# trees are byte identical, so what `.mcp.json` declares for Claude Code has to be
# declared here for Codex as well. Pinned, and run with the flags the trust
# charter asks for: nothing collected, network headers redacted.
[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@1.7.0",
  "--isolated",
  "--no-usage-statistics",
  "--redact-network-headers",
]
