<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>기록 — Ontology Atlas (작업대 시안)</title>
<style>
  :root{
    --canvas:#08090a; --panel:#0f1011; --elevated:#16171a;
    --ov1:rgba(255,255,255,.03); --ov2:rgba(255,255,255,.06); --ov3:rgba(255,255,255,.09);
    --t1:#f7f8f8; --t2:#b4bcd0; --t3:#8a8f98; --t4:#787c84;
    --indigo:#7170ff; --indigo-hover:#828fff; --indigo-brand:#5e6ad2;
    --indigo-a16:rgba(113,112,255,.16); --indigo-a46:rgba(113,112,255,.46);
    --divider:rgba(255,255,255,.08); --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.16);
    --amber:#d4b478; --emerald:#4ea88a;
    /* 지도 노드 규격 — app/globals.css 의 --topology-v2-* 그대로.
       채움 4단 · 깊이 잉크 사다리 · sheen · 엣지 2종. */
    --n-fill-project:#1c1c22; --n-fill-domain:#191920;
    --n-fill-capability:#17171d; --n-fill-element:#15151a;
    --ink-top:#6e6e79; --ink-mid:#646471; --ink-leaf:#60606d;
    --n-stroke-project:#797984;
    --n-sheen:#232329;
    --e-contains:#646471; --e-depends:#666685;
    --sel-ring:rgba(94,106,210,.45);
    /* 크기는 자기 행간을 싣는다 — 앱 globals.css 의 짝 그대로. 실측에서
       11px 하나가 행간 넷(17·18·22·16)을 쓰고 있었다. */
    --caption:9.5px;  --lead-caption:14px;
    --label:11px;     --lead-label:16px;
    --body:12.5px;    --lead-body:20px;
    --body-lg:14px;   --lead-lg:22px;
    --title:16px;     --lead-title:24px;
    --lead-code:18px;   /* 짝: label 11px 의 등폭 변형 — 코드는 본문보다 조밀하게 */
    --r-chip:6px; --r-card:9px; --r-panel:12px;
    --fast:.12s; --base:.18s; --ease:cubic-bezier(.25,.1,.25,1);
    --rail:82px; --list-w:clamp(400px,38vw,560px);
  }
  *{box-sizing:border-box;} html,body{height:100%;}
  body{margin:0;background:var(--canvas);color:var(--t1);
    font:400 var(--body)/1.5 -apple-system,"Pretendard Variable",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--indigo-a46);border-radius:5px;}
  .app{display:flex;height:100vh;}

  /* 레일 */
  .rail{width:var(--rail);flex:none;border-right:1px solid var(--divider);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:2px;}
  .rail .brand{width:30px;height:30px;border:1.5px solid var(--indigo);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
  .rail .bn{font-size:var(--caption);line-height:var(--lead-caption);color:var(--t3);margin:4px 0 16px;}
  .rail .item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 7px;width:56px;border-radius:9px;color:var(--t3);}
  .rail .item span{font-size:var(--caption);line-height:var(--lead-caption);}
  .rail .item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .rail .item.on{background:var(--indigo-a16);color:var(--indigo);}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}

  /* ── 상단: 이 폴더가 원격과 어떤 사이인가 + 동작 ── */
  .top{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--divider);flex:none;}
  /* 페이지 이름은 크롬이지 내용이 아니다 — 16/600 이 상세 제목(16/400)을 이겨
     주목 승자가 정적 라벨이었다(실측). 크롬은 한 단 내리고, 승자는 내용이 진다. */
  .ttl{display:flex;align-items:center;gap:8px;font-size:var(--body-lg);line-height:var(--lead-lg);
       font-weight:600;letter-spacing:-.01em;margin-right:4px;color:var(--t2);}
  .ttl svg{width:17px;height:17px;stroke:var(--indigo);fill:none;stroke-width:1.7;}
  .where{display:flex;align-items:center;gap:8px;font-size:var(--label);line-height:var(--lead-label);color:var(--t3);}
  .where code{font-family:ui-monospace,monospace;color:var(--t2);}
  .arrows{display:inline-flex;align-items:center;gap:9px;padding:3px 9px;border:1px solid var(--border);border-radius:var(--r-chip);font-variant-numeric:tabular-nums;}
  .arrows b{font-weight:600;color:var(--t1);}
  .arrows .ahead{color:var(--emerald);} .arrows .behind{color:var(--amber);}
  .grow{flex:1;}
  .act{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border:1px solid var(--border);border-radius:var(--r-chip);font-size:var(--body);line-height:var(--lead-body);color:var(--t2);}
  .act:hover{border-color:var(--border-strong);color:var(--t1);}
  .act[disabled]{opacity:.4;cursor:default;}
  .act svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .act.primary{background:var(--indigo-brand);border-color:transparent;color:#fff;font-weight:500;}
  .act.primary:hover{filter:brightness(1.08);}

  /* 갈라짐 막대 — 갈라졌을 때만 나온다 */
  .diverge{display:none;align-items:center;gap:12px;padding:9px 22px;border-bottom:1px solid var(--divider);background:var(--ov1);font-size:var(--label);line-height:var(--lead-label);color:var(--t3);flex:none;}
  .diverge.on{display:flex;}
  .dgraph{display:flex;align-items:center;gap:0;height:16px;}
  .dgraph .dot{width:7px;height:7px;border-radius:50%;background:var(--t4);}
  .dgraph .dot.mine{background:var(--emerald);}
  .dgraph .dot.theirs{background:var(--amber);}
  .dgraph .seg{width:16px;height:1px;background:var(--border-strong);}
  .dgraph .fork{width:16px;height:16px;border-left:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);border-bottom-left-radius:6px;margin-bottom:8px;}

  /* ── 본문: 목록 | 상세 ── */
  .body{flex:1;display:flex;min-height:0;}
  .list{width:var(--list-w);flex:none;border-right:1px solid var(--divider);display:flex;flex-direction:column;min-height:0;}
  .lhead{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--divider);flex:none;}
  .lhead b{font-size:var(--label);line-height:var(--lead-label);color:var(--t3);font-weight:600;}
  .seg{display:flex;gap:3px;margin-left:auto;}
  .seg button{height:24px;min-width:46px;border:1px solid var(--border);border-radius:var(--r-chip);font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .seg button.on{background:var(--indigo-a16);border-color:var(--indigo-a46);color:var(--indigo-hover);}
  .rows{overflow:auto;flex:1;}

  .row{width:100%;text-align:left;display:grid;/*
     * 이름 칸에 고정 상한(23em)을 주면 창이 좁아질 때 그 칸이 먼저 다 먹고
     * 원문이 38px 로 짜부라진다(1180px 실측). 둘이 비율로 나누고, 이름 칸의
     * 상한은 칸이 아니라 내용에 건다.
     */
    grid-template-columns:64px minmax(0,1.7fr) minmax(0,1fr);gap:12px;
       align-items:center;min-height:36px;padding:0 16px;border-bottom:1px solid var(--divider);
       border-left:2px solid transparent;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease);}
  .row:hover{background:var(--ov1);}
  .row.sel{background:var(--ov2);border-left-color:var(--indigo);}
  .row .when{font-size:var(--label);line-height:var(--lead-label);color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row .names{display:flex;gap:10px;align-items:center;min-width:0;max-width:23em;overflow:hidden;font-size:var(--body-lg);line-height:var(--lead-lg);font-weight:600;line-height:var(--lead-lg);}
  .row .why{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .row:hover .why,.row.sel .why{color:var(--t3);}
  .row .n{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none;}
  .row .names>.n:last-of-type{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;display:inline-block;}
  .row .names>.n:last-of-type .g{vertical-align:-1px;margin-right:5px;}
  .row .nocon{font-size:var(--label);line-height:var(--lead-label);color:var(--t4);opacity:.55;}
  .row .more{font-size:var(--label);line-height:var(--lead-label);color:var(--t4);font-weight:400;white-space:nowrap;flex:none;}
  /* 아직 안 남긴 변화 = 0번째 행 */
  .row.pending{border-left-color:var(--indigo);border-left-style:dashed;background:var(--indigo-a16);}
  .row.pending .names{color:var(--t1);}
  .daysep{padding:7px 16px 5px;font-size:var(--label);line-height:var(--lead-label);color:var(--t4);background:var(--canvas);position:sticky;top:0;border-bottom:1px solid var(--divider);}

  /* kind 글리프 — 지도와 같은 실루엣, 채색 0 */
  .g{width:11px;height:11px;flex:none;display:inline-block;}
  .g i{display:block;width:100%;height:100%;border:1px solid currentColor;opacity:.85;}
  .g.project i{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border-radius:2px;}
  .g.domain i{border-radius:3px;}
  .g.capability i{border-radius:50%;}
  .g.element i,.g.document i{border-radius:2px;}
  .g.element i::after,.g.document i::after{content:"";display:block;margin:2px;height:3px;background:currentColor;}

  /* 상세 */
  .detail{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;}
  .dhead{padding:16px 22px 12px;border-bottom:1px solid var(--divider);}
  /* 이 화면의 주목 승자 — 지금 읽고 있는 걸음. 페이지 이름(크롬)보다 세야 한다. */
  .dsubj{font-size:var(--title);line-height:var(--lead-title);font-weight:600;letter-spacing:-.01em;color:var(--t1);}
  .dmeta{margin-top:7px;font-family:ui-monospace,monospace;font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .dsec{padding:16px 22px;border-bottom:1px solid var(--divider);}
  .dsec:last-child{border-bottom:0;}
  .dlabel{font-size:var(--label);line-height:var(--lead-label);color:var(--t3);font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:8px;}
  .dlabel i{font-style:normal;color:var(--t4);font-weight:400;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:2px 9px;border:1px solid var(--border);
        border-radius:var(--r-chip);background:var(--ov1);font-size:var(--label);line-height:var(--lead-label);color:var(--t2);}
  .chip:hover{border-color:var(--indigo-a46);color:var(--t1);}
  .files{display:flex;flex-direction:column;gap:2px;font-family:ui-monospace,monospace;font-size:var(--label);line-height:var(--lead-label);}
  .file{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px;align-items:center;color:var(--t3);padding:2px 0;}
  .file .m{font-weight:600;}
  .file .m.a{color:var(--emerald);} .file .m.mm{color:var(--amber);} .file .m.d{color:#c96}
  .diff{font-family:ui-monospace,monospace;font-size:var(--label);line-height:var(--lead-label);line-height:1.65;border:1px solid var(--divider);border-radius:var(--r-chip);max-height:min(46vh,420px);overflow:auto;}
  .dl{padding:0 12px;white-space:pre;color:var(--t3);min-width:max-content;line-height:var(--lead-code);}
  .dl.add{background:rgba(78,168,138,.10);color:#9fd9c4;}
  .dl.del{background:rgba(201,102,102,.10);color:#e0a8a8;}
  .dl.hunk{background:var(--ov1);color:var(--t4);}

  /* ── ego: 고른 개념의 성질 + 1-depth 이웃. 지도로 안 가고 여기서 끝난다 ── */
  .ego{border:1px solid var(--border);border-radius:var(--r-panel);overflow:hidden;}
  .ego-body{display:grid;grid-template-columns:minmax(200px,264px) minmax(0,1fr);}
    .ego-body>.props{grid-template-columns:1fr;border-right:1px solid var(--divider);border-bottom:0;}
  .ego-body>.props .prop{border-right:0;border-bottom:1px solid var(--divider);}
  .ego-body>.props .prop:last-child{border-bottom:0;}
  .ego-id{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--ov1);border-bottom:1px solid var(--divider);}
  .ego-id .g{width:15px;height:15px;}
  .ego-id b{font-size:var(--body-lg);line-height:var(--lead-lg);font-weight:600;letter-spacing:-.01em;}
  .ego-id .kd{font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  /* 성질 — 타입 있는 사실만. 없는 칸은 자리를 지킨다(치수 규칙성) */
  .props{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--divider);align-content:start;}
  .prop{padding:11px 14px;border-right:1px solid var(--divider);min-width:0;}
  .prop:last-child{border-right:0;}
  .prop dt{font-size:var(--caption);line-height:var(--lead-caption);color:var(--t4);letter-spacing:.02em;margin-bottom:3px;}
  .prop dd{margin:0;font-size:var(--label);line-height:var(--lead-label);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prop dd.none{color:var(--t4);}
  .prop.rel{padding-bottom:12px;}
  .relrow{display:flex;align-items:center;gap:8px;font-size:var(--label);line-height:var(--lead-label);
          color:var(--t2);padding:3px 0;}
  .relrow{border-radius:var(--r-chip);margin:0 -6px;padding-left:6px;padding-right:6px;cursor:default;}
  .relrow:hover{background:var(--ov2);}
  /* 표에 올린 관계만 그림에 남는다 — 표와 그림이 같은 사실을 가리키는 걸 보인다 */
  .egograph[data-hi] .eg-g:not([data-hi-on]),
  .egograph[data-hi] .eg-edge:not([data-hi-on]){opacity:.18;}
  .relrow b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--t3);font-weight:600;}
  /* 선 견본 — 그림의 실선/점선과 같은 값이라 범례가 따로 필요 없다 */
  .rl{width:14px;height:0;border-top:1px solid var(--e-contains);flex:none;}
  .rl.dep{border-top-style:dashed;border-top-color:var(--e-depends);}
  .prop dd code{font-family:ui-monospace,monospace;}
  /* ── ego 그림: 가운데가 이 개념, 둘레가 바로 옆 이웃 ── */
  .egograph{position:relative;background:var(--canvas);}
  .egograph svg{display:block;width:100%;height:clamp(268px,34vh,352px);}
  .eg-edge{stroke:var(--e-contains);stroke-width:1;fill:none;}
  .eg-edge.dep{stroke:var(--e-depends);stroke-dasharray:3.5 3.5;}
  .eg-edge.dep{stroke-dasharray:3 3;}
  .eg-hit{fill:transparent;cursor:pointer;}
  .eg-hit:focus-visible,.eg-morehit:focus-visible{outline:2px solid var(--indigo-a46);outline-offset:1px;border-radius:50%;}
  .eg-node{stroke-width:1.15;transition:stroke var(--fast) var(--ease),filter var(--fast) var(--ease);}
  .eg-node.self{stroke:var(--indigo) !important;stroke-width:1.6;}
  .eg-selring{fill:none;stroke:var(--sel-ring);stroke-width:1;}
  .eg-g:hover .eg-node{stroke:var(--t2) !important;}
  .eg-g{cursor:pointer;}
  .eg-label{fill:var(--t3);font-size:var(--label);font-family:inherit;pointer-events:none;transition:fill var(--fast) var(--ease);}
  .eg-g:hover .eg-label{fill:var(--t1);}
  .eg-label.self{fill:var(--t1);font-size:var(--body-lg);font-weight:600;}
  .eg-role{fill:var(--t4);font-size:var(--caption);font-family:inherit;letter-spacing:.02em;pointer-events:none;}
  .eg-more{fill:var(--t3);font-size:var(--caption);font-family:inherit;pointer-events:none;}
  .eg-morebox{fill:var(--ov2);stroke:var(--border);stroke-width:1;}
  .eg-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .chip.on{border-color:var(--indigo-a46);background:var(--indigo-a16);color:var(--t1);}
  .dempty{padding:40px 22px;color:var(--t4);font-size:var(--body);line-height:var(--lead-body);}

  /* ── git 미설치 ── */
  .top.muted{opacity:.42;pointer-events:none;}
  .nogit{flex:1;display:grid;place-items:start center;padding:56px 24px;overflow:auto;}
  .nogit-card{width:min(620px,100%);border:1px solid var(--border);border-radius:var(--r-panel);
    background:var(--panel);overflow:hidden;}
  .nogit-head{display:flex;gap:14px;padding:20px 22px;border-bottom:1px solid var(--divider);}
  .nogit-mark{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:var(--r-chip);
    border:1px solid var(--border-strong);color:var(--t3);font-size:var(--body-lg);}
  .nogit-head h2{margin:0 0 5px;font-size:var(--title);line-height:var(--lead-title);font-weight:600;letter-spacing:-.01em;}
  .nogit-head p{margin:0;font-size:var(--body);line-height:var(--lead-body);color:var(--t3);}
  .nogit-head p b{color:var(--t2);font-weight:600;}
  .nogit-ways{display:flex;flex-direction:column;}
  .way{display:flex;gap:12px;padding:13px 22px;border-bottom:1px solid var(--divider);align-items:flex-start;}
  .way-n{width:19px;height:19px;flex:none;margin-top:1px;display:grid;place-items:center;border-radius:50%;
    border:1px solid var(--border);font-size:var(--caption);line-height:1;color:var(--t4);}
  .way b{display:inline;font-size:var(--body);line-height:var(--lead-body);font-weight:600;}
  .way i{font-style:normal;margin-left:7px;font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .way code,.way a{display:block;margin-top:6px;font-family:ui-monospace,monospace;
    font-size:var(--label);line-height:var(--lead-label);color:var(--t2);
    background:var(--ov1);border:1px solid var(--divider);border-radius:var(--r-chip);padding:5px 9px;width:fit-content;}
  .way a{color:var(--indigo);text-decoration:none;background:none;border-color:transparent;padding-left:0;}
  .nogit-foot{display:flex;align-items:center;gap:14px;padding:16px 22px;flex-wrap:wrap;}
  .nogit-foot span{font-size:var(--label);line-height:var(--lead-label);color:var(--t4);}
  .nogit-foot span b{color:var(--t3);font-weight:600;}
  .switch{position:fixed;right:16px;bottom:16px;display:flex;align-items:center;gap:4px;
    background:var(--elevated);border:1px dashed var(--border-strong);border-radius:9px;padding:4px 4px 4px 10px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);z-index:9;}
  .switch-tag{font-size:var(--caption);line-height:var(--lead-caption);color:var(--t4);margin-right:6px;white-space:nowrap;}
  .switch button{min-width:96px;height:26px;border-radius:var(--r-chip);font-size:var(--label);line-height:var(--lead-label);color:var(--t3);}
  .switch button.on{background:var(--indigo-a16);color:var(--indigo);}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="brand"></div><div class="bn">Atlas</div>
    <div class="item"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>지도</span></div>

const STEPS = [{"hash": "068e87f1a", "msg": "fix: 에이전트 연결의 복도를 지우고, 상태를 안 나르는 잉크를 강등한다 (#835)", "ago": "4 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"]], "diff": [" docs/DECISIONS.md | 90 +++++++++++++++++++++++++++++++++++++++++++++++++++++++", " 1 file changed, 90 insertions(+)", "@@ -44,2 +44,92 @@", " ", "+## 2026-08-02 (2) — 「AI 가 디자인한 것 같다」를 지문 여섯으로 번역하고, 복도 하나를 지운다", "+", "+**소집 근거**: 소유자 직접 — *\"이것도 파란색 배경에 뭔가 너무 ai가 디자인한것같이 생겼거든? 아예 리디자인 가능할까?\"*", "+— **소집한 자리**: 디자인 5석(위계 · 체계 · 상호작용 · 작업대 · 핸드오프) · **이유**: 한 시트의 위계·값 규칙·선택 문법·설치 앱 계약·에이전트 핸드오프가 동시에 닿았다. **모션 · 반응형 · 도해는 부르지 않았다** — 이 화면에 전이·브레이크포인트·데이터 마크가 없다. 비용 통제는 chief 소유다.", "+**선행 결정 관계**: 2026-08-02 (1) 기록의 **OUT 항목이던 A-3(복도 판 제거 + LNB 승격)를 이번에 이행**한다. 새 결정이 아니라 미뤄둔 것의 집행이다.", "+", "+| 자리 | 판정 | 소유 행/처방 |", "+|---|---|---|", "+| 위계 | **반려**(현행) · 재설계 승인 | 「이 화면의 일」 = *내가 쓰는 도구 하나를 골라 이 폴더에 붙이고, 붙었는지 확인한다* · **단계는 셋이 아니라 하나**(컨트롤 있는 단계 1개) · 강등 6건 |", "+| 체계 | 조건부 | 보더 4단 실측 · quarantine 앰버 48건/9파일(이 파일이 15건 최대 소비처) · `--color-indigo-a24` 24건/19파일, `Button` 프리미티브 경유 **0건** |", "+| 상호작용 | 조건부 | **전폭 블록 넷이 맞다**(세그먼트 반려) · `primary` 하드코딩이 결함 · focus-visible 링 토큰 부재 · 안심 문단이 선택 뒤에 있다 |", "+| 작업대 | 조건부 | 14인치 창 계약 **안전**(여유 289px) · 클라이언트 감지 **가능**(이미 절반 존재, 결함은 배선 누락) · home 스코프는 헌장 밖 |", "+| 핸드오프 | 조건부 | 계약 **실재**(`mcp-verify` 라이브 32도구) · ②재시작은 **참** · **③이 거짓 약속** |", "+", "+**루브릭 합계**: 19/24 (통과선 18 · 치명적 0: 없음)", "+", "+**갈린 지점 둘 — chief 가 규칙으로 풀었다**", "+", "+1. **버튼 넷의 형태.** 위계석 「넷을 한 고르개(세그먼트)로」 vs 상호작용석 「전폭 블록 넷이 맞다, 세그먼트는 틀리다」.", "+   **적용 규칙: 최소 슬라이스 → 상호작용석 채택.** 근거: 네 버튼은 **서로 다른 파일에 쓴다**(`.mcp.json` / `.codex/config.toml` / `.cursor/mcp.json` / `.agents/mcp_config.json`). 한 사람이 Claude Code **와** Codex 를 둘 다 붙이는 것이 정상 시나리오이고, 배타적 단일선택 위젯은 **그 기능을 숨긴다**. 위계석의 목표(넷이 동등하게 읽힌다)는 **채움 해제만으로 달성**되므로 세그먼트는 목표에 불필요하다. 기능 은폐는 되돌릴 수 없는 손실이라 형태 논거가 이를 이기지 못한다.", "+", "+2. **감지 신호를 지금 배선할 것인가.** 작업대석 「이미 있는 파일 존재 신호로 이번에」 vs 상호작용석 「지금 배선하면 안 된다」.", "+   **적용 규칙: 최소 슬라이스 → 상호작용석 채택.** 상호작용석 원문: *\"신뢰도가 확정되기 전에 없는 신호를 있는 척 배선하면 「명시적 거짓」(#828 이 이미 잡은 부류)을 새로 만드는 꼴이다. 지금 할 수 있는 최소 조치는 하드코딩을 없애 넷을 동등하게 만드는 것뿐.\"* 작업대석 자신도 같은 위험을 반대 논점으로 적었다 — 파일 존재는 「지금 쓰는 도구」가 아니라 **「예전에 한 번 쓴 도구」**를 가리킬 수 있다.", "+", "+3. **카드 크롬을 이번에 걷을 것인가.** 위계석 「미루자」 vs 체계석 「동반 필수」 — **충돌이 아니었다.** 재보니 서로 다른 크기를 말하고 있었다: 위계석이 미룬 것은 **카피 통합**(두 표면 × 두 로케일), 체계석이 하자는 것은 **컴포넌트 교체**(`StepCard` → `StepRow`, 소비처 3곳, 카피 불변). 그 선에서 갈랐다 — 합집합이 아니라 분할이다.", "+", "+---", "+", "+### chief 가 틀렸던 것 — 셋", "+", "+첫 브리프에서 「AI 같다」를 지문 여섯으로 번역해 넘겼다. **그중 둘이 틀렸고 자리들이 정정했다.**", "+", "+1. **지문 1 「선택지가 아니라 목록인데 버튼이 크다」 — 기각됨.** 위 갈림 1 참조. 전폭 블록 넷이 옳다.", "+2. **지문 5 「앰버 배지가 헤더와 다툰다」 — 정정됨.** 위계석 실측: 배지(y=195, 9.5px)는 시트 헤더(y=130, 14px)와 다투지 않는다. 패널 제목(y=196, 11px)과 같은 눈높이이고 그보다 **작다**. 진짜 결함은 「다툼」이 아니라 **같은 사실의 3회 중복**이었다(「누락」 → 「0/3개 준비됨」 → 526px 아래 「0/3 준비됨」).", "+3. **「오른쪽 여백 188px」 — 재현 안 됨.** 위계석 실측: 팝오버는 880 폭 중앙 정렬(좌 316 / 우 316)이고 드릴인 여백은 좌 49 / 우 27(22px 어긋남). **더 강한 사실이 대체했다** — 드릴인하면 LNB 180px 가 통째로 사라지고 878px 을 802px 한 칼럼이 쓴다. 그 자리는 이미 비어 있었다.", "+", "+**교훈**: 소유자의 감각어(\"AI 같다\")를 지문으로 번역하는 것은 chief 의 일이 맞다. 다만 그 번역은 **가설이지 판정이 아니다** — 자리가 실측으로 기각할 수 있게 \"틀리면 정정하라\"를 명시적으로 붙여야 한다. 이번엔 붙였고 둘이 기각됐다. 안 붙였으면 chief 의 오독이 처방이 됐다.", "+", "+---", "+", "+### 기록된 반대 (반증 조건 포함)", "+", "+**1. 위계석 — 채움 해제가 틀릴 수 있다.**", "+> *\"Claude Code 를 채운 건 위계 오류가 아니라 옳은 베팅이다. 사용자 대다수가 Claude Code 라면 70% 를 맞히는 기본값이 모두에게 읽기를 시키는 동등한 넷보다 낫다.\"*", "+**반증 조건**: 5초 노출 3인 테스트 또는 실사용에서 **Claude Code 사용자 비율 ≥70%** 가 관측되면 채움이 자기 값을 한다. **그때의 처방은 「넷 다 평평」으로 되돌리는 것이 아니라 「기본이라고 말하기」다** — 채워진 것에 「대부분 여기서 시작해요」를 붙여 **탈락 셋이 아니라 기본 하나**로 읽히게 한다. 색만 다르면 사용자는 「추천」이 아니라 「탈락」으로 오독한다.", "+**오늘의 정직한 위치**: 사용자 0명 · 근거 0 → **기본 없음**.", "+", "+**2. 위계석 — 번호를 없애면 진도감이 사라진다.**", "+**반증 조건**: 재설계 후 처음 보는 사람이 버튼을 누르고 **「된 건가? 이제 뭐 하지?」**를 물으면 번호는 장식이 아니라 하중을 받고 있었던 것이다. 복구는 번호 원이 아니라 **눌린 버튼의 done 상태가 다음 문장을 말하게** 하는 것.", "+", "+**3. 작업대석 — 파일 존재는 「지금 쓰는 도구」가 아니다.**", "+**반증 조건**: 볼트 10개 이상 표본에서 「가장 최근 exists 파일」과 「가장 최근 `heartbeat.agent`」가 **30% 이상 불일치**하면 exists 단독 배선은 기각이고, heartbeat 를 우선 신호·exists 를 보조로 바꾼다.", "+", "+**4. 체계석 — 이번 교체가 26건 반려 때와 같은 것 아닌가.**", "+**반증 조건**: `StepCard` → `StepRow` 교체가 소비처 3곳 + import 1곳을 넘어 **다른 컴포넌트로 번지면**(예: `settings-primitives.tsx` 의 다른 카드류까지 손대야 컴파일되면) 이 반대가 옳았던 것이고 범위를 좁혀야 한다.", "+"]}, {"hash": "4426e5917", "msg": "chore: 볼트 생성물 드리프트를 CI 가 아니라 커밋에서 잡는다 (#834)", "ago": "4 hours ago", "concepts": [], "files": [["M", "docs/DEVELOPMENT-CHECKS.md"]], "diff": [" docs/DEVELOPMENT-CHECKS.md | 22 ++++++++++++++++++++++", " 1 file changed, 22 insertions(+)", "@@ -19,2 +19,24 @@ For user-facing UI changes, add the relevant Playwright route check.", " ", "+## Pre-commit hook — generated vault freshness", "+", "+`pnpm install` points `core.hooksPath` at `.githooks/` (the `prepare` script;", "+nothing to run by hand). One hook lives there: **`pre-commit` refuses a commit", "+whose staged set touches the vault's markdown or its generated outputs while", "+`node scripts/build-docs-vault.mjs --check` reports drift.**", "+", "+It exists because the same failure landed three times in two days (#826 · #828 ·", "+#831): docs edited, `pnpm docs-vault:build` skipped, CI red eight minutes later.", "+The tool was never the problem — `pnpm checks:changed` named", "+`pnpm docs-vault:check` on every one of them. Moving the verdict from CI to the", "+commit is the only part that changes anything, so the hook does exactly that and", "+nothing else: **it blocks and prints the fix, it never edits your staged files.**", "+A hook that silently rewrites a commit puts bytes nobody wrote under a person's", "+name.", "+", "+```bash", "+pnpm docs-vault:build && git add src/entities/docs-vault/data public/docs-vault", "+```", "+", "+`--no-verify` is not the escape hatch — `.claude/rules/git.md` forbids it.", "+", " ## Quick Matrix"]}, {"hash": "b0efec3e9", "msg": "fix: AI 연결에서 고를 수 없던 것 셋 — 잘린 목록 · 0ms 퇴장 · 아무 정보도 안 나르는 188px (#833)", "ago": "4 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/DESIGN-SYSTEM.md"]], "diff": [" docs/DECISIONS.md     | 81 +++++++++++++++++++++++++++++++++++++++++++++++++++", " docs/DESIGN-SYSTEM.md | 76 +++++++++++++++++++++++++++++++++++++++++++++--", " 2 files changed, 154 insertions(+), 3 deletions(-)", "@@ -44,2 +44,83 @@", " ", "+## 2026-08-02 — AI 연결·에이전트 턴: 화면이 사실과 다른 것을 말한 자리 넷을 끊는다 (반복 지적 2건 포함)", "+", "+**소집 근거**: 소유자 직접 지시 3회 — *\"저 설정창 디자인 변경해달라고 했는데 왜 안했지.. 다시 해봐줘 UI/UX 디자인 모션 전문가 모셔서 지금당장\"* · *\"에이전트 뭔가 너무 별로인것같아보이지 않아? 선택지 이런것도 없고.. 자동으로 해주는것도 없는것같고?\"* · *\"이거 ai연결 팝업창이 너무 가로가 길다니까?\"*(「니까」 = 반복 지적 표시)", "+— **소집한 자리**: 디자인 6석(위계 · 체계 · 상호작용 · 모션 · 작업대 · 핸드오프) + PO 1석(지킴이 단발) · **이유**: 세 표면(설정 AI 연결 · 에이전트 입력 칸 · 에이전트 턴)이 닿았고, 자동 발견은 신뢰 헌장 판정이 필요했다. PO 5인 전원은 소집하지 않았다 — 지킴이가 「제안→적용은 새 표면 신설이 아니라 기존 표면 결함」으로 판정해 트리거가 서지 않았다.", "+", "+| 자리 | 판정 | 소유 행/처방 |", "+|---|---|---|", "+| 위계 | C 반려 · A/B 조건부 | 「이 화면의 일」 3문장 · 주목 승자 3개 전부 실물에서 지고 있음 · 스케일 대비 1.14×(위계 없음) · 복도 판 제거 |", "+| 체계 | 조건부 | `Select` 는 일회성 버그 아닌 **프리미티브 결함** · 테두리 문법 통일은 전수 26건이라 **반려**(한 PR 로 못 치움) · 문자수 렌더 제거 |", "+| 상호작용 | 조건부 | 잘린 글자는 렌더링이 아니라 **스크롤 위치 계산 버그** · 경고를 두 갈래로 · 선택지 셋 중 「후속 질문」 하나만 |", "+| 모션 | B 반려 · A 조건부 · **C 판정 무효** | 입력 칸 전이 **부재**(420프레임 1상태) · 스크롤 9px 순간이동(줄높이 20px 비배수) · 드롭다운 닫힘 98%가 1프레임 |", "+| 작업대 | 조건부 | 설치 앱 실측 · 자동 발견 **가능**(새 IPC 불필요) · **웹 CORS 안 막힘**(실측이 예상을 뒤집음) · `agent-loop.ts:225` 조기 종료 무통보 |", "+| 핸드오프 | 조건부 | 쓰기 배관 건강(계약 33/33) · 결함은 **번역 누락** · 「무엇을 읽었나」는 계기가 아니라 **근거** |", "+| 지킴이(PO) | Build and verify | 자동 발견 **헌장 안** · 선은 「찾기 클릭 시에만」 · Agent value **0/4 명시 선언** |", "+", "+**루브릭 합계**: 20/24 (통과선 18 · 치명적 0: 없음)", "+", "+**갈린 지점**: **화면이 사실과 다른 것을 말할 때, 고칠 쪽이 문구인가 판정 로직인가.** 「읽은 근거 없이 답했어요」는 문구가 정직했고 판정이 틀렸다(`citation.ts:53` 이 인용 표기 `[[slug]]` 개수만 셈 — 도구 4회·1,336자를 읽은 턴에 강등). 「웹에서는 안 됩니다」는 조건절이 참인데 인상이 거짓이었다(Ollama 기본값이 이미 CORS 를 허용 — 실측 `/v1/models` 200, `/v1/chat/completions` 200). **둘 다 문구가 아니라 그 아래를 고쳤다.**", "+", "+**적용한 규칙**:", "+- **합집합 금지** ×2 — ① 문자수 처방이 체계석(렌더 제거) vs 핸드오프석(`title` 강등)으로 갈렸다. 둘 다 「데이터는 지우지 않는다」에 합의했고 남은 차이에서 **더 작은 쪽**을 골랐다. ② chief 브리프가 상호작용석 칩 + 작업대석 notice 를 **둘 다** 실어 한 화면에 경고가 셋이 됐다 — **브리프가 합집합이었다.** 두 줄로 접었고 타입 코드는 데이터 층에 남겼다.", "+- **최소 슬라이스** — 드롭다운 우선순위 갈림(위계석 S6 vs 상호작용석·작업대석 심각)에서 후자 채택. 근거는 미관이 아니라 **기능 도달 불가 + 접근성 위반**(7개 중 1개만 클릭 가능, 스크린리더는 7개를 다 안내 → 키보드 사용자와 마우스 사용자가 다른 세상을 본다).", "+- **제거 요구** — 각 자리가 제거·강등 대상을 최소 1개씩 냈다. 순증 0.", "+", "+**권고 (chief)**: 두 PR 로 나눠 이행. **#832**(입력 칸 + 턴 신호) · **#833**(문구 + 폭 + 목록 + 퇴장).", "+**서명 (accountable: 소유자)**: 대기", "+", "+---", "+", "+### chief 가 틀렸던 것 — 기록에 남긴다", "+", "+첫 브리핑에서 rc.6 백로그의 「AI 시트 폭 846 → 520px」을 **원장에서 못 찾았다는 이유로 인용 불가 처리**했고, 구현 지시에 *\"시트 폭 880×640 은 손대지 마라\"* 라고 썼다. **그것이 이번 반복 지적(3번째 트리거)의 직접 원인이다.**", "+", "+846 은 지어낸 수가 아니었다 — 위계석 실측: `도크 880 − 보더 2 − 패딩 32 = 산문 칼럼 846px`. 백로그는 **도크 폭이 아니라 산문 칼럼 폭**을 재고 있었다. 원장에 없다는 사실과 관측이 틀렸다는 것은 다른 명제인데 후자로 취급했다.", "+", "+**교훈**: 기록되지 않은 평결은 *인용*할 수 없을 뿐 *관측*까지 무효는 아니다. 다음 소집은 「원장에 없음」을 **재측정 지시**로 바꿔야지 기각으로 쓰면 안 된다.", "+", "+---", "+", "+### 기록된 반대 (자리별 · 전부 반증 조건 포함)", "+", "+**1. 모션석 — 자기 처방을 자기가 공격했다.**", "+> *\"자람 전이 자체가 사족이다. 입력 칸은 최고빈도 표면이고 내 헌장이 그 예산을 `0~--motion-fast` 로 못박는다. `--motion-base`(180ms)는 내가 내 규칙을 어긴 것이다.\"*", "+**반증 조건**: 자람을 켠 뒤 **「타자가 무겁다」는 보고**가 나오면 반대가 옳았다. 그때 답은 임의로 깎는 것이 아니라 `--motion-fast`(120ms)로 **한 단 내리는 것**이고, 그래도 무거우면 전이를 제거한다. **소유자가 호소한 잘린 글자를 실제로 없애는 것은 자람이 아니라 스크롤 배수 정렬**이므로 이 반대가 이겨도 증상은 안 돌아온다.", "+", "+**2. 상호작용석 — 드롭다운을 뒤로 미루면.**", "+> *\"지금 안 고치면 사용자는 `gemma4:12b` 하나로 영원히 갇힌다.\"*", "+**반증 조건**: 채택됐으므로 이 반대는 이겼다. 반대 방향의 반증 — 포털 전환 후 다른 표면에서 팝오버 위치 회귀가 관측되면 프리미티브 전환이 성급했던 것이다.", "+", "+**3. 작업대석 — 웹 CORS 관측의 수명.**", "+> *\"「웹에서 Ollama 가 CORS 를 막지 않는다」는 이 기계의 이 순간의 기본값일 뿐이다. Ollama 가 `OLLAMA_ORIGINS` 기본값을 강화하면(보안 커뮤니티가 이미 요구해 온 방향) 이 관측은 뒤집힌다.\"*", "+**반증 조건**: Ollama 릴리스가 기본 오리진 정책을 좁히면 관측이 뒤집힌다. **그래서 문구를 「CORS 때문에 안 된다」가 아니라 「이 러너의 CORS 설정과 무관하게, 이 앱이 웹에는 전송 경로를 두지 않기로 선택했다」로 썼다** — 기본값이 바뀌어도 참인 문장이다. 웹 게이트를 여는 조건은 **po-steward 판정 대기**(질문 3, 미도착 — 도착 시 후속 기록).", "+", "+**4. 지킴이 — 코드 존재가 동작 증명은 아니다.**", "+> *\"쓰기 파이프라인이 코드상 있다고 해서 사용자 경험상 작동하는 건 아니다. 코드 존재만으로 「신설 아님」을 단정하는 건 이르다.\"*"]}, {"hash": "e80c3cc1f", "msg": "fix: 첫 실행 카드에서 가장 센 잉크가 남의 샘플 크기였다 (#831)", "ago": "5 hours ago", "concepts": [{"slug": "capabilities/first-run-starter", "kind": "capability"}], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/ontology/capabilities/first-run-starter.md"]], "diff": [" docs/DECISIONS.md                               | 81 +++++++++++++++++++++++++", " docs/ontology/capabilities/first-run-starter.md | 40 +++++++++++-", " 2 files changed, 120 insertions(+), 1 deletion(-)", "@@ -44,2 +44,83 @@", " ", "+## 2026-08-02 — 첫 실행 카드: 「지금은 샘플」을 네 번 말하는 화면에서 가장 센 잉크가 샘플의 크기였다 — 계기를 캡션으로 강등하고 리드를 주목 승자로", "+", "+**소집 근거**: PO 카운슬 필수 목록 2건 동시 — ① *낯선 사람이 처음 읽는 문구* ② *북극성 경로(링크 → 앱 → 5분 안에 에이전트가 내 볼트 노드를 인용)의 첫 관문*. 소유자 요청 원문은 *\"이 부분도 개선좀 해볼까? 디자인?\"* 이었고, 「디자인」이라는 말이 소집을 면제하지 않는다.", "+**소집한 자리**: PO 5석 전원 · **이유**: 이 표면은 여섯 루브릭 행 전부에 닿는다(첫인상=근거/결, 볼트·에이전트 접점=지킴이, 포지셔닝 첫 접점=해자, 561줄 컴포넌트의 결합=지렛대).", "+**디자인 벤치는 소집하지 않았다** — 「결」이 이미 실물에서 주목 스택·치수·대비를 실측해 위계석이 할 판정을 수치로 내놨고, 체계석이 지킬 것(새 토큰 0 · 램프 안)은 슬라이스 경계로 못박혔다. 여기서 8석을 여는 것은 조정이 아니라 관료층이다. 디자인 게이트는 `design-guardian` 이 단독으로 졌다.", "+", "+**선행 결정 점검** — 이 카드 전용 기록은 **없었다**(이 기록이 처음이다). 인접 기록 둘을 인용하고 **둘 다 유효한 채로 둔다**:", "+- 2026-07-30 「`/` 는 웹 방문자에게 관문」(`isGatewaySurface()`) — 유효. 이 카드는 `/topology` 의 **두 번째 화면**이라는 사실이 이번 소집의 전제가 됐다(근거).", "+- 2026-07-26 `design.md` 「정의의 진실원은 투어 1단계와 「?」 시트 **둘**」 — 유효하며 **위반 아님으로 판정**. 소집 브리프의 「용어사전이 세 번째 자리가 됐다」는 의심을 「결」이 실측으로 기각했다: 카드의 3행은 `searchWidgets.shortcuts.glossary` **동일 키 재렌더**이고 `GLOSSARY_TERMS` 가 `ontology` 키를 의도적으로 제외하고 있어 새 카피가 0이다. 드리프트가 구조적으로 불가능하다.", "+- 2026-08-01 「CI 는 볼트 노드 수를 세지 않는다」 — 유효. 계기를 강등하면서도 숫자의 출처를 `topologyCanonicalCensus` 파생으로 유지한 이유가 이것이다.", "+", "+| 자리 | 판정 | 소유 행/처방 |", "+|---|---|---|", "+| 근거 | Investigate first → (2R) 행동 주장은 유예, 산출물 내재 결함은 지금 | Problem insight **1** · User moment **2**. 첫 프레임은 카드가 아니라 400ms 자동 시트(선택지 3) · 동시 노출은 4→2 ④ 굵은 리드는 **이해 우선으로 유지**하고 회색 뒤에 에이전트 1문장 ⑤ 하단 참조 블록 `mt-auto` ⑥ 탭 자멸 수정(이미 선택된 탭은 접지 않음, semantics 를 선택 컨트롤로) ⑦ 문자열 4건 ⑧ CLI 접기는 **라벨의 거짓만 제거**(명령은 손대지 않음) ⑨ dogfood 노드 갱신.", "+", "+**서명 (accountable: 소유자 → 조정자에게 위임, 2026-08-02)**: **승인.** 확인 항목 둘 다 답이 왔고 **둘 다 기본값이 유지됐다** — 즉 이 PR 의 내용은 바뀌지 않는다. 아래는 원래 열려 있던 두 항목과 그 답이다.", "+1. **「디자인?」이 보임새인가 읽힘새인가.** 기본값: 둘 다이되 보임새 먼저. → **답: 보임새(앞쪽)가 맞다. 기본값 유지.** 근거 셋이 제시됐다: ① 소유자가 **문장을 인용하지 않았다** — 문구가 문제일 때는 늘 그 문장을 짚었는데(「곧」 배지 · 「연결할 수 없어요」 · 「전체 문서」) 이번엔 **패널 전체**를 가리켰고, 그것이 \"무엇이 잘못됐는지 이름 붙일 수 없다\"는 뜻이며 위계 결함의 지문이다. ② 실측이 그 인상을 설명한다(19px 샘플 수치가 주목 1위 · 하단 25% 빈 꼬리). ③ 굵은 리드 교체는 **포지셔닝**이지 이 슬라이스의 일이 아니고, 소집이 스스로 「1일 · 어포던스 증감 0」으로 묶었다.", "+   **그러므로 이번 범위는 회색 뒤 1문장까지다.** 굵은 리드 교체의 **후속 조건**: 신규 5인 모더레이티드 세션(반대 ② 참조)이 관측 채널로 예정돼 있으므로, 그 세션에서 해자의 반증 형태가 관측되면 그때 굵은 리드를 에이전트 훅으로 교체한다. 세션 전에는 바꾸지 않는다.", "+2. **「개발자라면 —」 접기의 약속이 「내 리포」인가 「atlas 체크아웃 구경」인가.** 기본값: 이번엔 문구를 명령이 실제로 하는 일에 맞춘다(거짓 제거). → **답: 의도는 「내 리포」다. 다만 이번 PR 에서 고치지 않는다 — 라벨을 명령에 맞춘 처리가 지금은 옳다(거짓말을 먼저 없애는 것이 순서다).**", "+   근거: **Atlas 가 자기를 bootstrap 하는 것은 사용자에게 아무 값이 없다** — 옆 탭의 dogfood 샘플이 이미 그것을 공짜로 준다. 쐐기는 *\"내 코드베이스에서 내 지도가 자란다\"* 뿐이고 해자 자리가 그것을 정확히 짚었다(Differentiation 1/4 의 실질). 지킴이는 같은 다리가 북극성이 요구하는 `agent-setup` 한 링크 앞에서 끊긴다는 것도 실측했다.", "+", "+**후속 1건 등재 — CLI 다리의 과녁을 바꾼다** (이 기록의 결정이 **아니라** 다음 결정의 예약이다):", "+- **내용**: 「개발자라면 —」 접기의 명령이 상대경로로 atlas 체크아웃 자신을 bootstrap 한다. 라벨은 이번에 명령 쪽으로 좁혔으나 **의도는 반대이며, 명령을 고치는 것이 옳은 방향이다.**", "+- **선례는 CLI 안에 이미 있다**: `cli/src/index.mjs:500` 이 `bootstrap . --vault <cwdVaultArg>` 형태를 힌트로 출력한다(같은 파일 496행의 `analyze`, 570행의 `runBootstrap` 도 같은 꼴). 즉 「내 리포」 문법은 발명이 아니라 **이미 있는 것을 카드가 잃어버린 것**이다.", "+- **후속 작업 조건**(반증 조건이 아니다 — 이건 틀렸는지를 묻는 항목이 아니라 언제 하느냐의 항목이다): CLI 공개 계약 변경이므로 ① 별도 PO 패스 또는 소집이 선행하고 ② `pnpm decisions:check` 가 강제하는 자리라 같은 PR 에 원장 기록이 붙어야 한다. 이번 슬라이스에 섞지 않는다.", "+", "+**기록된 반대 ①** (지킴이): *\"집계 3개보다 실제 엣지 1개(`주문 —depends→ 배송`)가 「관계」가 무엇인지 더 가르친다. 카드는 관계를 세기만 하고 하나도 보여주지 않는다.\"* — 2라운드에서 지킴이는 계기 강등을 골라 이 제안을 **철회**했고, 이번 슬라이스는 **정적 예시 카피**로만 부분 수용했다(배선 no-go). 즉 살아있는 사실 1개는 여전히 없다.", "+**반증 조건 ①**: 소유자 또는 신규 방문자가 강등된 캡션을 읽고도 「관계가 뭔지」를 여전히 못 말하거나, 정적 예시를 **질의된 사실로 오해**하는 장면이 나오면 지킴이가 옳았다 — 그때 고칠 것은 캡션의 크기가 아니라 **살아있는 엣지 하나를 배선하는 것**이다.", "+**재검토**: 1.0 안정판 컷 직전, 또는 첫 외부 사용자 5인 관찰 시.", "+", "+**기록된 반대 ②** (근거): *\"「선택지가 결정을 미루게 한다」는 이 저장소에서 관측된 적이 없다. 신뢰 헌장상 텔레메트리가 0이라 관측 채널 자체가 없고, 이 표면의 실방문자 수는 미상이며 0에 가까울 수 있다. 이 카드는 7개 라운드의 퇴적층이고 요소마다 관측 영수증이 있는데 합산 상태를 재판정한 기록만 없다.\"* — 채택하지 않은 부분: 구조 변경을 5인 모더레이티드 세션 이후로 미루자는 조항. 산출물 내재 결함(주목 스택 역전·탭 자멸·문자열 4건)은 사용자 관측 없이 판정 가능하다고 보고 지금 고쳤다.", "+**반증 조건 ②**: 신규 5인 세션에서 **2인 이상**이 바뀐 카드 앞에서 60초+ 무클릭이거나 \"뭘 하면 되죠?\"를 소리 내어 묻거나, 폴더를 열려던 사람이 「시작 안내 다시 열기」(11px 3차 텍스트)를 못 찾으면 근거가 옳았다 — 그때는 잉크 재배분이 아니라 **구조**를 손대야 하고, 그 전에 세션을 먼저 돌린다.", "+**재검토**: 소유자가 5인 세션을 잡는 시점. 안 잡히면 1.0 이후 첫 외부 피드백 3건이 모인 때.", "+", "+**기록된 반대 ③** (해자): *\"굵은 리드를 유지하는 한 이 카드는 Obsidian 첫 실행의 재배치다. 회색 뒤 1문장은 타협이지 해결이 아니다.\"*", "+**반증 조건 ③**: 카피 교체 없이 잉크만 재배분한 뒤에도 「개발자라면 —」 펼침율이나 MCP 연결 도달이 움직이지 않으면 해자가 옳았다(해자 본인이 제시한 반증 형태다). 그때는 굵은 리드를 에이전트 훅으로 교체한다.", "+**재검토**: 소유자 확인 항목 1의 답이 오는 즉시.", "+", "+**슬라이스**: IN — `src/features/first-run-starter/**`(className·순서·간격) · `messages/ko.json`+`en.json` 의 `firstRunStarter`(같은 커밋) · `tests/e2e/web-surface-smoke.spec.ts` 의 census 마커 이전 · `docs/ontology/capabilities/first-run-starter.md` · OUT — `app/globals.css`·새 토큰 · `HomePage.tsx` · 어포던스 증감 · 400ms 자동 시트 · dismiss/reopen 의미론 · e2e testid 15종 · 컴포넌트 분리 리팩터링 · appetite 1일."]}, {"hash": "4a16224a2", "msg": "fix: 지도에서 잡힌 둘 — 막대가 말을 안 했고, 「걸어온 길」에 길이 없었다 (#830)", "ago": "5 hours ago", "concepts": [], "files": [["M", "docs/CHANGELOG.md"], ["M", "docs/DECISIONS.md"]], "diff": [" docs/CHANGELOG.md |  21 ++++++++++", " docs/DECISIONS.md | 113 ++++++++++++++++++++++++++++++++++++++++++++++++++++++", " 2 files changed, 134 insertions(+)", "@@ -9,2 +9,23 @@", " ", "+## 2026-08-02 — 머리 위 막대가 말을 하고, 「걸어온 길」에 길이 보인다", "+", "+**막대에 동사가 들어갔다.** 고른 노드 바로 위의 판이 `+17` 대신", "+「모두 펼치기」·「N개 펼치기」·「접기」라고 말한다(영어는 `Expand all` ·", "+`Expand {count}` · `Collapse`). 종전 화면은 노드 몸에 각인된 `17` 바로 위에", "+`+17` 이 서서 **같은 수를 두 번 말하고 동사는 한 번도 하지 않았다** — 그래서", "+어깨 배지와 구별되지 않았다. 이제 수는 그 수가 정보일 때만 나온다: 한 번에 다", "+열리면 「모두 펼치기」, 나뉘면 이번에 열릴 개수(각인과 다른 수)를 말한다.", "+", "+**「한 번에 여는 개수」를 낮춰 두면 나머지를 열 수 있다.** 배치 공개의", "+`+N 더보기` 칩과 ego 의 「이웃 +N」 칩이 기본 어포던스에서 **그려지지도 눌리지도", "+않고** 있었다. 노드에 못 붙는 컨트롤은 사라지는 대신 알약으로 남는다.", "+", "+**「걸어온 길」을 켜면 길이 보인다.** 방문한 노드와 연달아 밟은 관계선이 발자국과", "+같은 잉크로 올라온다(설정에서 고른 노랑/인디고 2택 그대로). 렌즈를 닫으면 램프로", "+소멸하고, 고른 노드는 선택 링을 유지한다 — 「지금 여기」와 「지나온 곳」은 계속", "+다른 색이다. 렌즈가 켜져 있는 동안에는 확장 컨트롤도 함께 물러나 판이 궤적을", "+가로막지 않는다.", "+", "+---", "+", " ## 2026-08-01 — `v1.0.0-rc.5`: 공개 Windows x64 미서명 베타와 네이티브 검증", "@@ -3502 +3502,114 @@ LNB 를 접을지가 별도 슬라이스다. LNB 세로 빈 칸도 57% → 49% ", " **상태**: 유효 (미해결 2건 — 420px 가로 넘침 · LNB 세로 빈 칸)", "+", "+---", "+", "+## 2026-08-02 — 막대를 막대로 만드는 것은 「글자 버튼」이고, 「걸어온 길」은 노드와 선까지 물들인다", "+", "+**맥락**: 소유자가 설치된 화면에서 둘을 잡았다.", "+", "+> *\"머리위막대가 조금 다른듯한데 머리위 배지랑 다른게없는데?\"*", "+> *\"걸어온길 클릭했을때 화면인데 노드 선택되어서 빛나게 해줘야지? 노란색으로 선까지 다?\"*", "+", "+둘 다 «취향» 이 아니라 **약속된 것이 출하되지 않은 것**이다. 바로 위 원장", "+(2026-08-02, 확장 구조)이 첫째를 이미 「시안으로 되돌리라고 판정했으나 미적용", "+(rc.6 백로그)」으로 등재해 뒀고, 그 유예 사유(*\"캔버스 렌더러에 번역이 없다\"*)는", "+같은 항목이 스스로 **거짓이라고 적어 둔** 것이었다. 백로그가 아니라 결함이다.", "+", "+**결정**:", "+", "+1. **머리 위 막대는 동사가 든 글자 버튼이다.** 시안이 셋을 가르는 축은 자리만이", "+   아니다 — 뜬 알약은 «떨어진 빈 자리 + 점선», 어깨 배지는 «작은 원 + 호버로", "+   말함», 머리 위 막대는 «바로 위 + **글자** + 몇 개가 열릴지 숫자». 구현은 자리와", "+   선택 게이팅만 옮기고 그리는 것은 `+N` 뿐이라, 남은 것이 «노드 근처의 작은 마크»", "+   였다. 소유자의 판독이 정확하다.", "+   문구는 ko/en 둘 다: 「모두 펼치기」/「N개 펼치기」/「접기」 ·", "+   `Expand all`/`Expand {count}`/`Collapse`. 캔버스는 문자열을 만들지 않는다 —", "+   결계 캡션(`wardingRing.caption`)이 이미 쓰는 경로로 지도 화면이 번역해 내려보낸다.", "+", "+2. **수는 그 수가 정보일 때만 말한다.** 노드 각인은 «여기 몇 개가 있나»(전체)이고", "+   막대는 «누르면 무슨 일이 나나»(이번에 열릴 개수)다. 서로 다른 사실이지만 한", "+   번에 다 열리는 흔한 경우엔 두 수가 같아진다 — 소유자가 본 화면이 정확히 그것", "+   (각인 `17` 위에 `+17`)이었다. 그래서 남은 것을 전부 열면 「모두 펼치기」(수", "+   없음), 나뉘면 「N개 펼치기」로 **각인과 다른 수**를 말한다(설정 「한 번에 여는"]}, {"hash": "a8b348eca", "msg": "fix: 설정 시트가 한 방언으로 말하게 — 확장 절만 램프 한 단 아래였다 (#829)", "ago": "6 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"]], "diff": [" docs/DECISIONS.md | 97 +++++++++++++++++++++++++++++++++++++++++++++++++++++++", " 1 file changed, 97 insertions(+)", "@@ -3405 +3405,98 @@ B 에서 안 보인다\" 를 단언하는 **시험 파일을 지목**한다.", " **상태**: 유효", "+", "+---", "+", "+## 2026-08-02 — 설정 시트는 「스케일 고정 계약」 밖이다. 그리고 안이 두 방언이었다", "+", "+**맥락**: 소유자 지적 3건. ① *\"뭔가 답답해 설정내부\"* ② *\"이는 버튼도 너무 작고?", "+뭔가 설정 자체가좀 작아\"* (「확장」 절의 선택 버튼) ③ *\"이 LNB버튼도 작고.. 전반적으로", "+크기개선좀 해야할듯?\"*", "+", "+**먼저 답한 질문 — 이 표면이 계약의 사정거리 안인가.** `design.md` 의 스케일 고정", "+계약(크롬 필/타일 36px · 크롬 라벨 11px · 레일 아이콘 20px)은 스스로 사정거리를", "+**워크벤치 크롬**으로 한정한다 — *\"지도 위에 떠서 화면을 최대한 양보해야 하는 도구", "+막대\"*. 2026-07-28 에 같은 논리로 관문 크롬(`GatewayNav`)을 뺐다(*\"세로 길이가 너무", "+좁고\"*).", "+", "+설정 시트는 도구 막대가 아니다. 딤으로 뒤를 차단하는 **모달 목적지**이고(2026-07-30", "+결정), 곁눈질하는 표면이 아니라 결정하러 들어와 읽는 화면이다. 양보의 경제가 반대다.", "+**판정: 계약 밖(①).** 다만 그 선언은 오늘 화면을 바꾸지 않는다 — 실측해 보니 이", "+시트는 애초에 계약의 값을 하나도 안 쓰고 있었다(LNB 32px·아이콘 14px·본문 12.5px).", "+**계약이 틀린 게 아니라 이 표면에 규격이 없었다.**", "+", "+**그래서 진짜 원인은 크기가 아니라 방언이었다** (절별 폰트 센서스, 1512×806):", "+", "+| 절 | 12.5px | 11px | 9.5px |", "+|---|---|---|---|", "+| 화면 · 작업 공간 · AI 에이전트 | 10 / 5 / 4 | 5 / 1 / 3 | **0** |", "+| **확장** | **0** | 4 | **10** |", "+| 발자국 | 0 | 4 | 1 |", "+| 지도 배경 | 3 | 2 | 4 |", "+", "+같은 시트, 같은 종류의 내용이 절에 따라 **램프 한 단이 통째로 밀려** 있었다. 아무도", "+정하지 않았다: `Slider`/`Choice` 는 `FootprintSettings` 의 **접힌 세부** 안에서 태어나", "+그 자리의 치수를 갖고 있었고, 공용 프리미티브로 승격되며 `ExpandSettings` 의 **주", "+결정 컨트롤**이 될 때 그 치수를 데려왔다. 결과가 **위계 역전** — 라디오 칩(9.5px/24px)", "+이 자기 라벨(11px)보다 작아 **누르는 것이 화면에서 가장 작은 글자**였고, 24px 은", "+WCAG 2.5.8(AA) 최소 타깃 24×24 에 여유 0으로 걸쳐 있었다(「고리」·「기둥」 폭 38.4px).", "+", "+**결정**", "+", "+1. **시트의 방언은 하나다** — 누르는 글자·행 라벨 `text-body`(12.5px), 설명·수치", "+   `text-label`(11px), `text-caption`(9.5px)은 **루트 시트에서 쓰지 않는다**. 근거는", "+   취향이 아니라 램프의 정의(\"마이크로 라벨·범례·타임스탬프\"). 라디오 칩은", "+   32px/12.5px 로 — 이 시트의 다른 «값 하나 고르기» 인 `SegmentSwitch` 와 `AgentActivitySettings`", "+   의 알림 칩이 **이미 쓰던 값**이다(옳은 값은 이미 시트 안에 있었고 `Choice` 만 밖에 있었다).", "+2. **LNB 는 크롬에서 치수를 빌리지 않는다** — 32px/14px 아이콘(= 나브레일 타일 값)에서", "+   오른쪽 칸 `SettingsRow` 와 **같은 패딩**(`px-3 py-2` → 38px) + `text-body-lg`(14px)", "+   + 아이콘 16px 로. 시트가 열렸을 때 먼저 고르게 하는 자리라 오른쪽 행 라벨보다 한 단 위다.", "+3. **패널 높이 640 → 672.** 파생값이다: 최소 창 720 − 오버레이 거터(`p-3`) 2벌 = 672.", "+   그보다 크면 최소 창에서 자기가 선언한 거터를 먹는다. 폭 880 은 유지 — 넓히면 라벨과", "+   컨트롤 사이 빈 구간(실측 최대 541px)만 벌어진다.", "+", "+**새 토큰 0개.** 관문 예외가 남긴 규율을 그대로 따랐다 — *\"소비처가 하나뿐인데 변수를", "+만들면 참조 대상이 둘로 늘어 어디가 규격인지 흐려진다.\"* 값은 전부 기존 램프 스텝과", "+이 시트가 이미 쓰던 인셋에서 끌어왔다.", "+", "+**실측 (전 → 후, 1512×806 · 다크)**"]}, {"hash": "145fb7f85", "msg": "feat: 시안의 확장 계측을 설정으로 — 기본 어포던스를 「머리 위 막대」로 바꾼다 (#826)", "ago": "7 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/DESIGN-SYSTEM.md"], ["M", "docs/FEATURES.md"]], "diff": [" docs/DECISIONS.md     | 161 ++++++++++++++++++++++++++++++++++++++++++++++++++", " docs/DESIGN-SYSTEM.md |  50 ++++++++++++++++", " docs/FEATURES.md      |   1 +", " 3 files changed, 212 insertions(+)", "@@ -3242,2 +3242,163 @@ B 에서 안 보인다\" 를 단언하는 **시험 파일을 지목**한다.", " ", "+---", "+", "+## 2026-08-01 — 시안의 확장 계측을 설정으로 이식하고, 오늘의 칩 어포던스를 「머리 위 막대」로 **교체**한다", "+", "+**맥락**: `.qa-scratch/proto-expand.html` 은 접힌 묶음을 펼치는 방식을 **고르려고**", "+만든 계측 도구다. 어포던스 3안(뜬 알약 · 머리 위 막대 · 어깨 배지) · 확장 구조", "+3안(부챗살 · 고리 · 기둥) · 숫자 3개(한 번에 여는 개수 · 이름을 시도할 개수 ·", "+동시에 펼쳐 둘 부모)를 나란히 놓고 27조합을 실측했다. 소유자 지시: *\"복원한거", "+기반으로 우리 소스코드에 적용하자! 좌측에 설정하는건 설정 팝업안에 LNB로 하나", "+추가되어야하고 말야\"*.", "+", "+**결정**:", "+", "+1. **설정 LNB 에 「확장」 절을 신설한다** — `look` 묶음의 「지도 배경」과", "+   「발자국」 **사이**(소유자: *\"발자국 위에 하나 넣어주면 될듯\"*). 앞의 둘은", "+   지도가 무엇으로 그려지는가고, 확장은 그 위에서 무엇이 열리는가고, 발자국은", "+   다 그린 뒤 남는 흔적이다.", "+2. **기본 어포던스를 「머리 위 막대」로 한다** (소유자: *\"기본값은 '머리 위 막대'", "+   어때?\"*). **이것은 오늘 화면을 의도적으로 바꾸는 유일한 값이다.**", "+   - **사라지는 것**: 접힌 부모마다 상시로 떠 있던 `+N` 알약과 그 점선 목줄.", "+   - **대신 오는 것**: **고른 노드 바로 위**에 도킹된 `+N` 막대. 안 고르면", "+     아무것도 없다. 접힌 개수 자체는 노드 몸통의 각인 숫자가 계속 말한다.", "+   - **왜**: 알약은 셋 중 유일하게 **자리를 «찾아야»** 하는 컨트롤이다. 실측", "+     캡처(2026-08-01, 샘플 볼트 8도메인)에서 「마케팅」의 `+17` 은 자기 노드에서", "+     150px 아래로, 「상품」의 `+16` 은 화면 최상단으로 밀려나 있었다 — 화면이", "+     **누구의 버튼인지**를 더 이상 말하지 않는다. 막대는 탐색을 없앤다: 매번", "+     같은 자리에 있으면 눈이 찾지 않는다.", "+3. **나머지 넷의 기본값은 오늘 그대로다** — 확장 구조 `disc`(나선 원반) ·", "+   한 번에 여는 개수 24 · 이름을 시도할 개수 8 · 동시에 펼쳐 둘 부모 3.", "+   세 숫자는 **새 값이 아니라 이미 코드에 있던 상수**(`EGO_NEIGHBOR_LIMIT` ·", "+   `DISC_LABEL_TOP_K` · `MAX_EXPANDED_PARENTS`)이고, 이제 그 상수들이 설정의", "+   기본값을 **가져다 쓴다**(값이 두 곳에 적히지 않게 — Carbon).", "+4. **셋을 다 설정으로 내보낸다.** 「고르라고 만든 것」을 그대로 내보내면 *\"우리가", "+   안 골랐다\"* 가 제품에 남는데, 그 함정은 **기본값을 고르는 것**으로 피한다 —", "+   위 2번이 그 선택이다. 나머지 둘을 남기는 이유는 셋의 우열이 **밀도와 화면", "+   크기에 따라 실제로 갈리기** 때문이다(알약은 성긴 볼트에서 가장 잘 보이고,", "+   배지는 노드를 따라다녀 밀집에 강하고, 막대는 예측 가능하되 선택을 요구한다).", "+   관측이 쌓이면 선택지를 줄인다 — **늘리는 방향으로는 다시 열지 않는다.**", "+", "+**시안과 다르게 한 것**:", "+", "+- **「볼트 규모」(작음/실제/큼)는 옮기지 않았다.** 시안이 자기를 재려고 만든", "+  **시험 부하**지 제품 설정이 아니다 — 옮기면 사용자가 자기 데이터의 크기를", "+  «고르는» 컨트롤을 보게 된다. 게이트: `expand-settings.contract.test.ts`.", "+- **확장 구조에 네 번째 값 `disc`(나선 원반)를 더했다.** 시안의 셋 중 **어느", "+  것도 오늘 그려지는 것이 아니다**(오늘은 황금각 phyllotaxis 나선). `disc` 가", "+  없으면 이 설정에는 「오늘」을 고르는 자리가 없고, 그러면 절을 여는 것만으로", "+  화면이 바뀐다. **기본값이 화면을 바꾸는 것은 어포던스 한 항목까지다.**", "+- **막대에 글자가 없다.** 시안의 막대는 「N개 펼치기」·「접기」·진행 캡션을", "+  한국어로 그렸는데, 캔버스 렌더러에는 번역이 없어 그대로 옮기면 영어 사용자가", "+  한국어를 본다. 그래서 알약과 **같은 기호 어휘**(`+N` / `− N`)를 쓰고, 말은", "+  이미 있는 호버 툴팁(`onHoverCluster`)이 사용자의 언어로 한다. 시안이 재려던", "+  성질(«자리를 찾지 않는다» · «안 고르면 없다»)은 그대로다.", "+- **부챗살·고리·기둥은 기하만 옮겼다.** 시안은 자리를 **이름 폭까지 포함해서**"]}, {"hash": "13a460caf", "msg": "fix: 볼트를 바꿔도 살아남는 상태 셋 — 유령 노드 · 명시적 거짓 · 전역 키 (#828)", "ago": "15 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"]], "diff": [" docs/DECISIONS.md | 75 +++++++++++++++++++++++++++++++++++++++++++++++++++++++", " 1 file changed, 75 insertions(+)", "@@ -3169 +3169,76 @@ tarball `files` 도달성. ③ 실행 가능성 — help/`--check` 가 정말 ", " **상태**: 유효", "+", "+## 2026-08-01 — 「범위를 넘긴 상태」를 부류로 잠근다: 선언된 범위 등록부, 그리고 `vaultScopeKey` 는 범위가 아니라는 명문화", "+", "+**소집**: 단독 판정 (소유자 지시 · 앞선 사냥의 재현 기록) · **트리거**: 소유자가", "+앱에서 잡은 배너 하나(*\"문서함에 이건 왜나오지?\"*)가 증상이 아니라 **부류**였다.", "+같은 문법의 결함이 다섯 자리에서 재현됐다.", "+", "+**부류의 이름**: **범위를 넘긴 상태** — 어떤 상태가 범위 X(볼트)에서만 뜻이", "+있는데, X 가 바뀌어도 살아남아 **거짓 판정의 입력**이 된다. 조용한 실패가 아니라", "+**화면이 사실이 아닌 것을 말하는** 실패다:", "+", "+- 지도 `?p=` — 없는 노드를 선택으로 판정해 지도가 통째로 흐려지고(ego 포커스가", "+  실재를 안 본다), 「찾을 수 없다」 토스트는 슬러그당 한 번이라 A→B→A 는 완전히", "+  침묵했으며, 그 유령이 첫 방문 힌트를 localStorage 에 **영구** 소멸시켰다.", "+- `?pathFrom`/`?pathTo` — 이 볼트에 없는 노드 둘을 놓고 **「경로 없음」이라고", "+  단언**했다. 진실은 \"둘 다 여기 없다\" 인데 화면은 \"둘 다 있고 안 이어져 있다\"", "+  고 말했고, **「경로 패킷 복사」** 가 그 거짓을 에이전트에게 넘길 수 있었다.", "+- 변경 baseline · 알림 읽음 시각 — 볼트별 내용인데 전역 키 하나.", "+", "+**결정**: ① 다섯을 고친다(주소는 볼트 정체성이 바뀌는 순간 걷어내고, 밖에서 온", "+링크는 정직하게 말한다 — 두 갈래를 가른다). ② **선언된 범위 등록부**를 게이트로", "+세운다(`tests/contract/scope-registry.contract.test.ts`): 모든 지도 쿼리 키와", "+모든 영속 저장 키를 한 줄씩 `global`/`vault-scoped` 로 태그하고, 미등록 키·죽은", "+줄·미보호 `vault-scoped` 를 실패로 만든다.", "+", "+**왜 lint 가 아닌가**: 결함이 **키와 다른 파일에 사는 범위 사이의 관계**이고,", "+실패 상태가 리터럴을 남기지 않는다 — *없는* 정리 effect 는 AST 셀렉터에 보이지", "+않는다. `no-restricted-syntax` 는 한 파일의 AST 매칭이라 이 규격을 표현할 수", "+없다(`design.md` 「lint 가 못 보는 층은 계약 테스트가 맡는다」).", "+", "+**⚠️ 명문화: `vaultScopeKey()` 만으로는 범위가 아니다.** 그 함수는 저장", "+namespace 용이라 샘플 둘(도그푸드 · 예시 쇼핑몰)을 `'server'` 하나로 뭉뚱그린다.", "+그것을 \"볼트가 바뀌었나\" 판정에 쓰면 **샘플↔샘플 전환이 변화로 안 잡혀서**,", "+게이트가 자기가 막으려던 결함을 **인증**한다. 그렇다고 `vaultScopeKey` 를 넓히지도", "+않는다 — 그건 핀·최근·열린 탭의 **저장 자리를 옮기는 일**이라 사용자의 기존", "+목록을 고아로 만든다. 그래서 동일성 판정 전용으로 `vaultIdentityScope`", "+(`local:<폴더>` | `sample:<샘플>`)를 따로 두고, 거친 범위는 **이미 배포된 네", "+자리에만** 얼려 둔다.", "+", "+**켜기 전 전수 측정** (이 저장소 실측, origin/main 기준): 지도 쿼리 키 18개 중", "+볼트 종속 **9개**(`p`·`c`·`hub`·`pathFrom`·`pathTo`·`from`·`to`·`open`·`realm`", "+— 사냥의 7개에 옛 별칭 `from`/`to` 를 더한 값), 비테스트 키 리터럴 **59개**(저장", "+45 · 이벤트 11 · 옛 키 3), 그중 볼트 내용은 **10개**. 4개는 이미 거친 범위로", "+namespace 됨(얼어 있는 네 자리), 2개를 이 변경이 정확한 범위로 고쳤고, **4개는", "+알면서 남긴다**(`KNOWN_UNPROTECTED`, 각 줄에 이유 · 상한 래칫). 등록부는 URL 18줄", "++ 저장 59줄 = **77줄**이다 — 사냥이 어림한 67줄보다 큰 이유는 ① 옛 별칭 두 개와", "+② 같은 namespace 를 쓰는 이벤트 이름 11개를 함께 등재했기 때문이다(스캐너가", "+리터럴만 보고는 저장과 이벤트를 못 가르므로, 빼면 사각지대가 생긴다).", "+", "+**탐지기를 되돌려 확인했다.** 통과만으로는 살아 있다는 증거가 아니라서, 수리마다", "+되돌려 빨개지는지 쟀다 — 그 과정에서 **내 시험 하나가 가짜였다**: `mode=path` 와", "+끝점 둘을 같이 넣은 픽스처는 파서가 이미 `p` 를 null 로 내려서, 정리를 통째로", "+지워도 초록이었다. 픽스처를 선택 축과 경로 축으로 갈랐다. 같은 이유로 **소스에", "+범위 함수 *이름이 있는지* 보는 검사도 폐기**했다 — 훅 안에서 범위를 떼어냈는데", "+파일이 여전히 그 이름을 언급해 통과했다. 이제 각 키는 \"볼트 A 에 쓴 값이 볼트", "+B 에서 안 보인다\" 를 단언하는 **시험 파일을 지목**한다."]}, {"hash": "11e01ebe4", "msg": "fix: 범위를 넘긴 상태 둘 — 남의 볼트 초안이 내 편집기로 새고, 낡은 슬러그가 주소에 눌어붙었다 (#827)", "ago": "15 hours ago", "concepts": [], "files": [["M", "AGENTS.md"], ["M", "CLAUDE.md"]], "diff": []}, {"hash": "4c48f9ddc", "msg": "docs: 가이드 확장 2차 — 공방·정비 보드 두 장 신설 + CLI 를 판단표로 (11장 → 13장) (#825)", "ago": "16 hours ago", "concepts": [], "files": [["M", "docs/guide/cli.md"], ["A", "docs/guide/insights.md"], ["M", "docs/guide/relations.md"], ["A", "docs/guide/studio.md"]], "diff": [" docs/guide/cli.md       | 131 +++++++++++++++++++++++++++++------", " docs/guide/insights.md  | 179 ++++++++++++++++++++++++++++++++++++++++++++++++", " docs/guide/relations.md |   2 +-", " docs/guide/studio.md    | 160 +++++++++++++++++++++++++++++++++++++++++++", " 4 files changed, 450 insertions(+), 22 deletions(-)", "@@ -12,35 +12,124 @@ node cli/src/index.mjs --help", " ", "-## 자주 쓰는 것", "+## 세 진입로가 같은 볼트를 본다", " ", "-| 하고 싶은 일 | 명령 |", "+명령을 외우기 전에 이걸 먼저 알아 두면 나머지가 쉬워집니다.", "+", "+| 진입로 | 쓰는 사람 |", " |---|---|", "-| 빈 저장소에 볼트 만들기 | `init` |", "-| 내 `.md` 를 볼트로 들이기 | `import <path...>` |", "-| frontmatter 무결성 검사 | `validate` |", "-| 그래프로 컴파일 | `compile` |", "-| 이름 바꾸기(백링크 포함) | `rename <old> <new>` |", "-| 누가 이걸 쓰나 | `backlinks <slug>` |", "+| CLI | 사람 — 터미널에서 |", "+| MCP | AI 에이전트 — Cl +++++++++++++++++", " 2 files changed, 84 insertions(+)", "@@ -9,2 +9,30 @@", " ", "+## 2026-08-01 — 웹에서도 그 자리에서 에이전트를 붙인다 · 볼트 지문 한 번에 · 화면이 하던 거짓말 셋", "+", "+**「이 화면에서는 연결할 수 없어요」가 거짓이었다.** MCP 는 Atlas 가 아니라", "+**폴더**에 붙는다 — 에이전트가 자기 세션에서 서버를 띄우고 그 서버가 디스크의", "+볼트를 읽고 쓴다. 웹 사용자도 처음부터 연결할 수 있었고, 브라우저가 못 하는", "+것은 **설정 파일을 대신 저장해 주는 것** 하나였다. 그래서 강등 문장이 능력을", "+실제보다 좁게 말하고 있었고, 연결할 수 있었던 사람이 포기하고 있었다.", "+", "+이제 웹에서도 시트 안에서 설정이 만들어진다. 브라우저가 모르는 절대 경로만", "+사람에게 묻고, 나머지는 화면이 조립해 복사할 수 있는 형태로 준다 — **전송 0 ·", "+저장 0**. 「곧 됩니다」가 거짓말인 것과 같은 이유로, **되는 것을 안 된다고 쓰는", "+것도 거짓말**이라는 규율을 표면 계약에 새로 적었다.", "+", "+**볼트 지문이 한 번의 호출로 온다.** 종전에는 파일마다 왕복하며 **본문 전체**를", "+가져와 `lastModified` 숫자 하나만 쓰고 버렸다. 이 저장소 자신을 볼트로 열면", "+`docs/` 가 261 파일 · 17.7MB 인데, 그 전부가 직렬화돼 다리를 건너고 남는 것은", "+숫자 261개였다 — 그리고 이 일은 **창에 포커스가 돌아올 때마다** 돌았다. Rust 가", "+훑어 경로와 mtime 만 돌려주고, 절단·가지치기가 있었으면 그것도 함께 말한다.", "+", "+**화면이 하던 거짓말 셋을 고쳤다.** ① 문서함의 개수 줄이 어떤 탭을 골라도 \"전체", "+문서\" 라고 적어, 세 탭이 다 같은 것을 보여준다는 뜻으로 읽혔다 — 활성 컬렉션의", "+이름과 개수를 말한다. ② [AI 연결] 시트의 각주가 \"볼트에 질문하는 기능은 준비", "+중\" 이라고 적었는데 그 기능은 이미 나와 있었고, 더 나쁘게는 에이전트 패널의", "+CTA 가 보낸 사람이 도착해서 자기를 보낸 CTA 를 부정당하고 있었다. ③ 대화를 못", "+하는 모델이 러너 목록 1번에 오르지 않는다.", "+", "+---", "+", " ## 2026-08-01 — 볼트만 넘겨받은 에이전트가 못 읽던 것들: 본문 전체 읽기 · 두 검사의 말 맞추기 · 증거 없는 능력 표시", "@@ -44,2 +44,52 @@", " ", "+## 2026-08-01 (소유자 서명) — 시연은 주소로 갈리지 않는다: `/` 와 `/download` 가 같은 것을 보여준다", "+", "+**소집**: 단독 패스 · **트리거**: 소유자 직접 지시 — *\"근데 다운로드 페이지 들어가니까", "+왜 사용 영상이 없지?\"* → *\"/는 영상이 나오고 download는 안나오고 이러면 안됨! 그냥", "+통일해.. 헷갈리게하지말고 둘 다 영상 나오게 download는 결국 홍보 페이지랑 같잖아\"*.", "+**선행 결정 관계**: 2026-07-29 (밤) 「시연 영상은 첫 페이지로 간다」를 **명시적으로", "+뒤집는다** — 배치 절반만. 그 기록이 카운슬에서 지켜 낸 **촬영 원칙 둘**(공유 표면을", "+찍지 않는다 · 웹이 원리적으로 못 하는 것을 보여준다)은 그대로 유효하다.", "+", "+**관측**", "+", "+배치를 주소로 가른 것은 코드 한 줄(`showDemo = pathname === '/'`)이었고, 그 갈림을", "+아는 시험이 **하나도 없었다**. 실측(rc.5 빌드, 1512×982):", "+", "+| 주소 | `demo-stage` | `<video>` | 탭 |", "+|---|---|---|---|", "+| `/ko/` | 있음 | 2 | 2 |", "+| `/ko/download/` | **없음** | t belong in a vault.", "@@ -9,2 +9,27 @@", " ", "+## 2026-08-01 — `v1.0.0-rc.5`: 공개 Windows x64 미서명 베타와 네이티브 검증", "+", "+**Windows x64 설치 파일을 공개 베타 채널에 넣었다.** Tauri NSIS 산출물을", "+`ontology-atlas_<version>_windows_x64-setup.exe`라는 결정적 이름으로 스테이징하고,", "+같은 이름의 `.sha256`을 함께 게시한다. Windows 번들도 macOS와 마찬가지로 앱 안에", "+컴파일된 MCP 서버를 싣는다; Windows에서는 `ontology-atlas-mcp.exe`와 네이티브", "+credential store를 사용한다.", "+", "+**미서명 상태를 숨기지 않는다.** 다운로드 CTA 앞에 코드 서명 부재,", "+Microsoft Defender SmartScreen의 알 수 없는 게시자 경고, 관리되는 회사 PC의 실행", "+차단 가능성을 적었다. macOS와 Windows를 별도 동급 카드로 만들지 않고 한 다운로드", "+plate 안의 두 플랫폼 절로 구분했으며, Windows CTA는 outline으로 남겨 인디고 주목", "+승자를 둘로 만들지 않았다. 웹 경로는 Windows 절 안에서 빼고 판 바닥의 출구", "+행으로 정리했다. 그 행은 큰 `GitHub로 이동하기`를 왼쪽, 같은 높이의", "+`웹버전으로 보기`를 오른쪽에 두어 설치 선택과 페이지 이동을 섞지 않는다. `/`의", "+시연 영상과 `/download`의 영상 비노출 계약은 바꾸지 않았다.", "+", "+**Windows 실기기 부재는 CI 증거와 한계로 나눴다.** PR과 태그 모두 네이티브", "+Windows Server 2022에서 의존성 감사, Defender 검사, NSIS 무인 설치, 설치 앱 실행,", "+번들 MCP 초기화·도구 목록·도그푸드 볼트 읽기를 통과해야 한다. 반면 Windows 11의", "+실제 SmartScreen 화면은 검증했다고 주장하지 않는다. 공개 릴리스 사실은 GitHub", "+Release의 EXE·체크섬 쌍에서 생성되어 사이트에 반영된다.", "+", "+---", "+", " ## 2026-08-01 — 볼트만 넘겨받은 에이전트가 못 읽던 것들: 본문 전체 읽기 · 두 검사의 말 맞추기 · 증거 없는 능력 표시", "@@ -262,4 +262,2 @@", " ", "----", "-", " ## 2026-08-01 — CI 는 볼트 노드 수를 세지 않는다 — 손으로 맞춰야 유지되는 수 게이트를 전부 걷고, 런타임에 계산되는 단언만 남긴다", "@@ -306,2 +304,73 @@", " ", "+## 2026-08-01 — Windows x64는 공개 미서명 베타로 내되, 경고와 네이티브 증명을 다운로드의 일부로 만든다", "+", "+**현상**: Windows 11 실기기가 없는 상태에서도 x64 설치 파일을 공개할 수 있는지,", "+그리고 긴 SmartScreen 경고를 다운로드 화면 어디에 둘지가 문제로 올라왔다. 기존", "+결정은 Windows가 서명된 설치 파일과 설치 검증이라는 macOS와 같은 문턱을 넘을 때까지", "+`준비 중`으로 두는 것이었다. 소유자는 베타 단계의 수요를 먼저 관측하기 위해", "+**미서명이라는 비용을 명시적으로 안고 공개**하기로 했다.", "+", "+**결정**:", "+"]}, {"hash": "bc9bc8aa0", "msg": "docs: CodeGraph 에이전트 가이드 신설 — 실측 기반, 없는 클라이언트는 조용히 무시 (#820)", "ago": "24 hours ago", "concepts": [], "files": [["M", "AGENTS.md"], ["M", "CLAUDE.md"]], "diff": []}, {"hash": "1040780fa", "msg": "feat: 웹에서도 그 자리에서 에이전트를 붙인다 — 「연결 불가」는 거짓이었다 (#817)", "ago": "24 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"]], "diff": [" docs/DECISIONS.md | 23 +++++++++++++++++++++++", " 1 file changed, 23 insertions(+)", "@@ -150,2 +150,25 @@", " `.claude/skills/ontology-field-trial/BASELINE.md`.", "+## 2026-08-01 — 웹의 「연결 불가」는 거짓이었다: 브라우저가 모르는 값을 **아는 사람에게 묻는다**", "+", "+**소집**: 단독 패스 · **트리거**: 소유자 실측 — 배포된 웹에서 「AI 에이전트 연결」을 눌렀더니 「이 화면에서는 연결할 수 없어요」가 뜨고, 유일한 대안 링크가 사람을 `/docs/?slug=AGENT-GRAPH-WORKFLOW` 한가운데로 떨궜다(*\"지금은 좀 불편하다\"*).", "+**선행 결정 관계**: `.claude/rules/surfaces.md` 「웹 동등물은 짓지 않는다」의 두 항목을 **둘 다 유효로 인용한다.** 웹 BYOK 는 그대로 영구 기각(이 변경은 MCP 에이전트 연결이지 LLM 호출이 아니다). 「웹에서 `.mcp.json` 등 에이전트 설정 **쓰기**」도 그대로 안 한다 — 브라우저는 여전히 파일을 쓰지 않는다. 뒤집는 것 없음. **읽는 법만 좁힌다.**", "+", "+**관측 (현상과 문제를 가른다)**", "+", "+- **현상**: 웹 방문자가 연결 시트에서 막힌다.", "+- **문제**: 카드가 **능력의 범위를 실제보다 좁게** 말했다. MCP 는 Atlas 에 붙는 게 아니라 **폴더에 붙는다** — 에이전트(Claude Code/Codex/Cursor)가 자기 세션에서 서버를 띄우고 그 서버가 디스크의 볼트를 읽고 쓴다. Atlas 는 같은 폴더를 보는 또 하나의 독자일 뿐이라, **웹 사용자도 연결된다**(소유자가 같은 날 앱 없이 터미널로 세 번 붙였고 볼트가 61·89·50 노드까지 자랐다). 못 하는 것은 **Atlas 가 설정 파일을 대신 써 주는 것** 하나다.", "+- 이 저장소 규율이 정확히 이 형태를 금지한다: 강등 카드는 왜 안 되는지 + 어디서 되는지를 말해야 하고, **사실이 아닌 축소**는 「곧 됩니다」와 같은 부류다.", "+", "+**결정**: 강등 카드를 **자동 저장 불가**로 정정하고, 그 아래에 **그 자리에서 끝나는 길**을 붙인다. 브라우저가 구조적으로 모르는 값(볼트 절대 경로 · Atlas 체크아웃 절대 경로)을 **사람에게 묻고**, 그 값으로 도구별 설정과 `agent-setup` 한 줄을 화면에서 만들어 준다. 전송 0 · 저장 0 — 순수 함수와 로컬 상태뿐이고 경로는 화면 밖으로 나가지 않는다.", "+", "+**적용 규칙**: 최소 슬라이스 (새 라우트 0 · 새 표면 0 · 기존 강등 카드 자리 안) · 헌장 우선 (웹 BYOK 부활 없음, 백엔드 없음) · 제거 요구 (문서 링크를 **주 경로에서 내린다**)", "+", "+**서명**: stark (소유자 지시)", "+", "+**기록된 반대** (가장 강한 패배 논점): *\"경로 두 개를 손으로 붙여넣게 하는 것은 앱의 원클릭 대비 초라하고, 체크아웃까지 요구하면 진입 장벽이 오히려 커 보인다 — 차라리 앱으로 몰아야 전환이 는다.\"*", "+→ 기각 근거: 웹의 1번 일은 **관문**이고(surfaces.md), 앱을 못 까는 인구(Windows·리눅스 Chromium)에게 유일한 길을 막다른 카드로 두는 것은 관문의 품질을 2류로 내린다. 앱이 더 쉽다는 안내는 **남긴다**(버튼 한 번) — 웹이 막혔다고 말하지 않을 뿐이다.", "+", "+**반증 조건**: 이 반대가 옳았다면 — ① 웹 시트에서 경로 칸이 채워지는 일이 사실상 없고(복사 버튼이 잠긴 채로 끝나고) ② `/download/` 전환은 종전과 같거나 오히려 줄어든다. 그러면 「그 자리에서 끝난다」는 전제가 틀린 것이고, 답은 카드를 되돌리는 것이 아니라 **체크아웃 요구 자체**(배포 채널 둘)를 다시 여는 것이다.", "+", "+**재검토**: 웹에서 연결한 사용자 제보가 한 건이라도 나오면(성공이든 실패든) 그 경로 실패 유형으로 다시 본다. 또는 Windows 앱이 로드맵에 오르는 시점.", " "]}, {"hash": "f192b7987", "msg": "fix: 인수인계 시험이 찾아낸 셋 — 본문 도달 · 두 검사의 말 맞추기 · 증거 없는 능력 (#815)", "ago": "25 hours ago", "concepts": [{"slug": "capabilities/mcp-server", "kind": "capability"}], "files": [["M", "CLAUDE.md"], ["M", "docs/CHANGELOG.md"], ["M", "docs/DECISIONS.md"], ["M", "docs/ontology/capabilities/mcp-server.md"]], "diff": [" docs/.generated/mcp-surface.json         |  2 ++", " docs/CHANGELOG.md                        | 37 +++++++++++++++++++++++", " docs/DECISIONS.md                        | 52 ++++++++++++++++++++++++++++++++", " docs/ontology/capabilities/mcp-server.md |  4 +--", " 4 files changed, 93 insertions(+), 2 deletions(-)", "@@ -180,2 +180,3 @@", "         \"arguments\": [", "+          \"body\",", "           \"slug\"", "@@ -190,2 +191,3 @@", "         \"arguments\": [", "+          \"body\",", "           \"slugs\"", "@@ -9,2 +9,39 @@", " ", "+## 2026-08-01 — 볼트만 넘겨받은 에이전트가 못 읽던 것들: 본문 전체 읽기 · 두 검사의 말 맞추기 · 증거 없는 능력 표시", "+", "+**낯선 저장소로 실전 시험을 했다.** 아무도 모르는 오픈소스 저장소에 빈 볼트를", "+붙여 실제 MCP 에이전트가 15분 30초 만에 50노드·126관계를 지었고, 인용한 경로", "+13개는 13개 전부 실재했다. 그 다음 **소스를 감추고 볼트만 넘겨받은 두 번째", "+에이전트**에게 물었더니, 답을 잘하면서 **우리 결함 셋을 직접 지적했다.**", "+", "+**① 본문을 전부 읽을 수 있다.** `get_concept({ body: 'full' })` 이 생겼다.", "+기본은 그대로 첫 단락 발췌이고, 전체 본문은 요청하면 온다. 더 중요한 건", "+**모든 응답이 `bodyInfo` 로 원본 길이·돌려준 길이·잘림 여부를 말한다**는 것 —", "+종전에는 조용히 잘려서, 그 에이전트가 *\"본문에 더 있을 수 있는데 확인 못", "+했다\"* 로 답을 끝냈다. 구축 규격이 근거·확신도·포함/제외를 **본문에 적으라고", "+시켜 놓고** 읽기 도구가 그것을 안 돌려주고 있었다. 같은 병이 있던", "+`get_concepts`(같은 파라미터, full 은 20행 상한) · `find_evidence` ·", "+`list_concepts({summary})` 도 잘림을 말한다.", "+", "+**② `validate` 와 `health` 가 같은 볼트에 다른 말을 하지 않는다.** 한쪽은", "+\"vault clean ✓\", 다른 쪽은 \"needs_attention warn:13\" 이었다. 원인은 CLI 가", "+`OATLAS_REPO_ROOT` 미지정 시 **자기 작업 디렉터리**를 저장소 루트로 실어서,", "+남의 볼트의 코드 경로를 *우리* 저장소에 대고 재고 있었던 것. 추측을 걷었고,", "+근거가 없으면 **재는 대신 \"안 봤다\"고 말한다.** 두 명령의 문구도 이제 각자", "+무엇을 봤는지 말한다 — `validate` 는 frontmatter·그래프 참조, `health` 는", "+거기에 코드 경로 대조까지.", "+", "+**③ 코드에 닿지 않는 능력이 보인다.** 시험 볼트의 능력 16개 중 8개가", "+`elements:` 가 비어 있어 인수인계 에이전트가 \"코드 진입점이 없습니다\" 라고", "+답할 수밖에 없었다. `maintenance_plan` 에 `capability_without_evidence` 가", "+생겼고, 만들 때 한 번 더 말한다. **거부하지는 않는다** — 「행동을 먼저 이름", "+짓고 파일을 나중에 붙인다」가 정직한 순서이고, 규격 5번(절차는 쓰기를 막지", "+않는다)이 그대로 유효하다.", "+", "+**그리고 이 시험 자체를 남겼다.** `/ontology-field-trial` 스킬 + 오늘의 실측", "+기준선(`BASELINE.md`). 다음에 규격을 고쳤을 때 나아졌는지는 **답 못한 질문", "+목록이 줄었는가**로 가른다 — 노드 수로 가르지 않는다.", "+", "+---", "+", " ## 2026-08-01 — 예시 쇼핑몰 볼트를 규격대로 다시 짓고, `/project/storefront/` 404 를 고쳤다", "@@ -100,2 +100,54 @@", " **상태**: 유효.", "+## 2026-08-01 — 인수인계 시험이 찾아낸 셋: 본문은 opt-in 으로 전부 주고, 안 준 것은 말하고, 증거 없는 능력은 막지 말고 보이게 한다", "+", "+**소집**: 단독 패스 · **트리거**: 낯선 오픈소스 저장소에 빈 볼트를 붙여 실제 MCP", "+에이전트로 구축한 뒤(15분 30초 / 50노드 / 126관계 / 인용 경로 13-13), **소스를", "+감추고 볼트만 넘겨받은 두 번째 에이전트**에게 질문한 실측. 공개 계약(MCP 도구"]}, {"hash": "1ec38d513", "msg": "test: 설치 앱에서 「주소로 연결」과 「작업 중/알림함」을 실측한다 — 지도 밖 첫 상호작용 검증기 (#816)", "ago": "25 hours ago", "concepts": [], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/DEVELOPMENT-CHECKS.md"]], "diff": [" docs/DECISIONS.md          | 59 ++++++++++++++++++++++++++++++++++++++++++++++", " docs/DEVELOPMENT-CHECKS.md | 14 +++++++++++", " 2 files changed, 73 insertions(+)", "@@ -44,2 +44,61 @@", " ", "+## 2026-08-01 — 「작업이 끝났다」는 조용해짐으로 판정한다: 임계값 5분, 알림은 **작업 단위로만**", "+", "+**소집**: 단독 패스 · **트리거**: 소유자 직접 지시 (*\"화면은 에이전트나 mcp가 작업중이라는걸 어떻게든 표현 가능해야하고 … 벨을 만들지만 그 표현할 내용을 손보면\"*).", "+**선행 결정 관계**: 2026-08-01 「도구 호출 로그는 그리지 않는다」를 **인용하며 유효**로 둔다 — 알림 목록에서 도구 호출을 뺀 근거가 그 판정이다.", "+", "+**관측 (임계값을 감이 아니라 분포에서 골랐다)**", "+", "+실측 활동 로그 두 벌(98줄 · 쓰기 간격 96개)의 분포:", "+`p50 1.9s · p90 23.2s · p95 48.5s · p98 133.9s · p99 329.5s · max 1733.3s`, 간격의", "+80.2%가 4초 이하. 꼬리에 두 종류가 섞여 있다 — **작업 중의 침묵**(에이전트가 읽고", "+생각하는 동안. 로그에는 쓰기 성공만 남으므로 그 구간은 한 줄도 안 남는다)과", "+**작업 사이의 침묵**. 관측된 최대 「작업 중 침묵」은 133.9초다.", "+", "+임계값별로 두 로그가 몇 조각이 되는지: 60s → 7작업 · 120s → 6 · **300s → 4(로그당 2)** ·", "+600s → 3. 한 실험(53줄 · 11분 40초)만 놓고 보면 줄 단위 알림은 53개, 작업 단위는 2개다.", "+", "+**결정**", "+", "+1. **`AGENT_TASK_IDLE_MS = 5분`.** 근거 셋: ① 관측된 최대 작업 중 침묵(133.9초)의", "+   2.24배 — 실측한 어떤 것보다 두 배 오래 생각해도 한 작업으로 남는다.", "+   ② `AGENT_ACTIVITY_STALE_AFTER_MS`(heartbeat 낡음 5분)와 같은 값 — 「이 에이전트는", "+   이제 없다」가 제품 안에서 두 숫자를 갖지 않는다. ③ 오차 비용이 비대칭이고 유계다:", "+   길어서 틀리면 끝 알림이 최대 5분 늦을 뿐, 짧아서 틀리면 한 작업이 알림 여러 개로", "+   쪼개진다(배지가 늘 빨간불이면 배지는 뜻을 잃는다).", "+2. **알림은 다섯 갈래뿐** — 작업 시작 · 작업 끝(요약과 함께) · 도메인 생성/소멸 ·", "+   브릿지 끼어듦 · 볼트 문제. 노드 하나·관계 하나는 지도가 이미 밝게 보여주므로 넣지", "+   않고, 도구 호출은 위 선행 판정이 반려했다.", "+3. **뼈대 사건의 진실원은 활동 로그가 아니라 매니페스트다.** 로그로 도메인 생성을", "+   잡으려 했으나 실측 98줄에서 **한 건도 안 잡혔다** — 도메인은 거의 항상 배치", "+   (`add_concepts`)로 태어나고 배치의 target 은 `(batch)` 다. 매니페스트 스냅숏 diff 는", "+   배치·수기 편집을 가리지 않는다.", "+4. **알림함은 라우트가 아니라 팝오버다.** 지도를 떠나 지도에 관한 소식을 읽게 만들면", "+   그 소식의 값이 사라진다. 지속적인 기록의 목적지는 이미 `/git` 과 볼트 안", "+   `activity.jsonl` 이고, 이 팝오버는 그리로 가는 짧은 창이다(라우트 0개 추가).", "+5. **자리는 지도 우하단 판독 스택**(범례·첫 실행 판독·프레임 계기의 집). 상단 중앙", "+   상태 열이 갈래로는 맞았지만 **1024 에서 안 들어간다** — 그 열은 INDEX 오른끝(388px)에서", "+   69px 떨어져 있는데 이 칩이 194px 이라 32px 겹쳤고(실측), 우상단 유틸 레인도 28px 만", "+   남았다. 저 열의 칩 넷은 사용자가 만든 **일시** 상태라 그 여유를 알고 쓰는 것이고", "+   이건 **상시**다. 우하단은 좌우 경쟁자가 없고, 토스트가 이미 그 스택의 실제 rect 를", "+   읽어 비켜선다(`resolveToastBottomOffsetForStack`).", "+6. **「연결됨」이라고 쓰지 않는다.** Atlas 는 에이전트에 연결하지 않고 폴더를 볼 뿐이라", "+   그 말은 거짓이다. 「마지막 작업 N분 전」은 언제 말해도 참이다.", "+", "+**진 반대 의견**: *\"5분은 너무 길다 — 끝났는지 5분을 기다려야 안다.\"* 맞는 지적이고,", "+그 대가를 알고 치른다. 되받은 근거는 **「끝」의 값이 즉시성이 아니라 요약**이라는 것이다", "+(「추가 34 · 편집 2 · 삭제 4」는 늦게 와도 값이 그대로지만, 잘못 갈린 요약은 값이 0이다).", "+즉시성이 필요한 신호는 「작업 중」 표시가 2분 창으로 이미 담당한다.", "+", "+**반증 조건**: ① 사용자가 한 작업이 알림 여러 개로 갈렸다고 보고하면 임계값이 짧은", "+것이다(→ 재측정 후 상향). ② 「끝났는데 알림이 안 온다」가 반복되면 5분이 긴 것이다", "+(→ 하향, 단 재측정 근거와 함께). ③ 배치가 아닌 개별 쓰기가 지배적인 로그가 관측되면", "+3번의 근거가 약해진다 — 그때는 로그만으로도 뼈대 사건을 잡을 수 있다.", "+", "+**재검토**: 활동 로그 표본이 다섯 벌 이상 쌓였을 때 분포 재측정.", "+"]}, {"hash": "1abdca6ee", "msg": "feat: 채팅 에이전트에 키 없는 「주소로 연결」 갈래 — Ollama·LM Studio·llama.cpp (#812)", "ago": "27 hours ago", "concepts": [], "files": [["M", "docs/CHANGELOG.md"], ["M", "docs/DECISIONS.md"], ["M", "docs/FEATURES.md"]], "diff": [" docs/CHANGELOG.md | 27 +++++++++++++++++++++++++++", " docs/DECISIONS.md | 23 +++++++++++++++++++++++", " docs/FEATURES.md  | 21 +++++++++++++++++++++", " 3 files changed, 71 insertions(+)", "@@ -43,2 +43,29 @@", " (`tests/e2e/storefront-node.ts`).", "+## 2026-08-01 — 채팅 에이전트가 로컬 러너에 붙는다 (Ollama · LM Studio · llama.cpp)", "+", "+**설정 › AI 연결에 네 번째 행이 생겼다 — 키가 아니라 주소를 적는 자리.**", "+러너 주소(기본 `http://localhost:11434`)를 적고 [연결 확인] 을 누르면 설치된", "+모델이 목록으로 오고, 거기서 고른 모델이 볼트 에이전트의 대화를 받는다. API", "+키는 필요 없다.", "+", "+**엔드포인트는 OpenAI 호환(`/v1/chat/completions` · `/v1/models`)이다.** 그래서", "+Ollama 뿐 아니라 LM Studio · llama.cpp server · vLLM 이 같은 문으로 들어온다 —", "+주소만 바꾸면 된다. Ollama 네이티브 API 를 골랐다면 러너마다 어댑터를 하나씩", "+써야 했다.", "+", "+**나가지 않았다는 것이 기록으로 증명된다.** 감사 줄의 목적지는 제공자 이름이", "+아니라 호스트라, 로컬 러너를 쓰면 `.ontology-atlas/llm-audit.jsonl` 에", "+`\"host\":\"localhost:11434\"` 가 그대로 남는다. 설정 화면의 전송 범위 문구도 그", "+사실을 말한다 — 다만 사용자가 `https` 로 **다른 기계**를 가리켰을 때는 \"이", "+컴퓨터 밖으로 안 나간다\" 고 쓰지 않는다.", "+", "+**실패하면 왜 실패했는지 말한다.** 러너가 꺼져 있음 · 그 포트에 다른 프로그램이", "+있음(404) · 설치된 모델이 0개인 것이 서로 다른 문장을 받고, 각각 다음에 할 일을", "+함께 적는다. (같은 손질로 명명 벤더 셋의 네트워크 실패도 `실패: 0` 대신 이유를", "+말하게 됐다 — curl 은 연결 실패에도 `%{http_code}` 자리에 `000` 을 찍어서, 그게", "+\"HTTP 0 으로 응답했다\" 는 없는 사실로 읽히고 있었다.)", "+", "+명명 벤더 목록은 **셋 그대로**다. 이 갈래는 네 번째 벤더가 아니라 롱테일 전부를", "+받는 문이다 — 근거는 `docs/DECISIONS.md` 2026-08-01 「네 번째 연결은 벤더가", "+아니라 문이다」.", " ", "@@ -103,2 +103,25 @@", " ", "+## 2026-08-01 — 네 번째 연결은 벤더가 아니라 **문**이다: 키 없는 「주소로 연결」 갈래를 열어 Ollama·LM Studio·llama.cpp 를 한 자리로 흡수한다", "+", "+**소집**: 단독 패스 (소유자 직접 지시) · **트리거**: 소유자 — *\"에이전트(채팅)모드도 ollama 나 오픈소스들도 연결 가능하게 해줘! 지금 나는 ollama 쓰고있는데 … 이것도 설정에서\"*", "+**루브릭**: 21/24 (치명적 0: 없음)", "+**선행 결정 관계**: 새 결정이 아니라 **이미 허용된 것의 구현**이다 — `.claude/rules/local-first.md` v9 가 *\"LLM 연결(BYOK / localhost)은 opt-in + 전송 범위 UI 명시 + 로컬 감사 로그 조건으로 허용\"* 이라고 이미 적어 뒀고, 세 조건을 전부 구현했다. 동시에 `src-tauri/src/secrets.rs` 의 **「명명 벤더 3 동결」은 유지**된다(테스트 `the_named_vendor_list_stays_frozen_at_three` 무수정 통과).", "+", "+**결정**: Ollama 를 **네 번째 명명 벤더로 넣지 않는다.** 그 자리의 조건은 「Bearer 호환으로 흡수 불가한 전용 인증 + 수요 증거」 둘 다인데 Ollama 는 ①을 못 채운다(OpenAI 호환 엔드포인트를 그대로 연다). 대신 `secrets.rs` 가 롱테일용으로 **이미 예고해 둔** *\"사용자가 주소를 직접 적는 갈래\"* 를 실제로 연다 — provider id `local`, base URL 사용자 입력, 키 0.", "+", "+**적용 규칙**: 최소 슬라이스 · 헌장 우선", "+", "+- **엔드포인트는 OpenAI 호환(`/v1/chat/completions` · `/v1/models`)**, Ollama 네이티브(`/api/chat` · `/api/tags`)가 아니다. 네이티브를 고르면 러너마다 어댑터가 하나씩 늘고, 그건 명명 벤더 동결이 피하려던 바로 그 롱테일이다. 호환을 고르면 LM Studio·llama.cpp server·vLLM·LocalAI 가 **같은 문 하나**로 들어온다 — 그것이 소유자가 말한 \"오픈소스들도\" 의 실질이다.", "+- **키 없는 경로는 타입으로 연다.** `Target::{Vendor{secret}, Address{base_url}}` — 명명 벤더 키가 사용자가 적은 주소로 나가는 조합이 **표현 불가능**하다(런타임 게이트는 IPC 커맨드에 따로).", "+- **평문 http 는 루프백에서만.** 밖으로 나가려면 https. URL 안의 userinfo·쿼리·따옴표는 거절한다.", "+- **전송 범위 문구는 루프백일 때만 \"이 컴퓨터 밖으로 안 나간다\" 고 말한다** — 사용자가 https 로 다른 기계를 가리킬 수 있고, 참이 아닌 자리에 그 문장을 쓰면 이 제품의 신뢰 서사가 거짓말이 된다.", "+- **모델은 타이핑이 아니라 목록에서 고른다.** [연결 확인] 한 번이 「살아 있나 · 호환되나 · 뭘 고를 수 있나」 셋을 한 요청·한 감사 줄로 답한다.", "+", "+**이 갈래가 이 제품에 특별히 맞는 이유**: `llm.rs` 는 감사 줄의 목적지를 제공자 이름이 아니라 **호스트**로 남긴다. 로컬 러너를 쓰면 `host:\"localhost:11434\"` 가 찍히므로 **「아무 데도 안 나갔다」가 주장이 아니라 기록이 된다.** 실측(2026-08-01, 소유자 기계): verify·chat 두 줄 모두 `provider:\"local\"`, `host:\"localhost:11434\"`.", "+", "+**기록된 반대 (가장 강한 패배 논점)**: 호환 층은 **러너 버전에 달렸다.** 도구 호출(`tools`/`tool_calls`)은 호환 API 에 늦게 붙었고 러너·모델마다 완성도가 다르다 — 볼트 에이전트는 도구 호출이 본체이므로, 도구를 못 쓰는 로컬 모델을 고른 사용자는 \"연결은 됐는데 아무것도 안 한다\" 를 만날 수 있다. 네이티브 API 를 썼다면 최소한 Ollama 에서는 그 층이 더 안정적이었을 것.", "+**반증 조건**: 로컬 러너로 연결한 사용자가 **도구 호출 실패**로 첫 왕복을 못 넘긴 사례가 관측되면 반대가 옳았던 것 — 그때의 처방은 네이티브 어댑터 추가가 아니라 **연결 확인이 모델의 도구 지원 여부까지 판정**하는 것이다(Ollama 네이티브 `/api/tags` 의 `capabilities` 에 `tools` 가 있다. 호환 목록에는 없다 — 그 한 필드 때문에 네이티브를 **보조로만** 부르는 것은 정당하다).", "+**재검토**: 소유자가 로컬 러너로 실제 볼트 작업을 한 번 끝낸 뒤 — 도구 왕복이 몇 번째에서 끊겼는지가 위 반증 조건의 관측이다.", "+", "+**서명 (accountable)**: stark", " **상태**: 유효"]}, {"hash": "61ea00612", "msg": "feat: 예시 쇼핑몰 볼트를 규격대로 다시 짓고 `/project/storefront/` 404 를 고친다 (#809)", "ago": "28 hours ago", "concepts": [{"slug": "README", "kind": "document"}], "files": [["M", "README.md"], ["M", "docs/CHANGELOG.md"], ["M", "docs/DECISIONS.md"]], "diff": [" docs/CHANGELOG.md | 37 ++++++++++++++++++++++++++++++++", " docs/DECISIONS.md | 63 +++++++++++++++++++++++++++++++++++++++++++++++++++++++", " 2 files changed, 100 insertions(+)", "@@ -9,2 +9,39 @@", " ", "+## 2026-08-01 — 예시 쇼핑몰 볼트를 규격대로 다시 짓고, `/project/storefront/` 404 를 고쳤다", "+", "+**볼트를 안 연 사람이 보는 첫 데이터가 우리 규격을 안 지키고 있었다.**", "+`samples/storefront/` 32개 중 25개에 `display_en` 이 없어서, `/en/docs` 와", "+`/en/projects` 는 한국어 원문 제목을 그대로 그리고 지도는 번역된 이름을 그렸다 —", "+**같은 노드가 화면마다 다른 언어**였다. \"온톨로지를 제대로 만들어 준다\"고 파는", "+제품의 예시 자체가 반증이 되고 있었다.", "+", "+**0에서 다시 지었다.** 도그푸드 볼트(2026-07-31)와 같은 절차, 같은 규격", "+(`mcp/src/construction-rules.mjs`)이다. 여덟 업무 영역 — 상품 · 재고 · 주문 ·", "+결제 · 배송 · 회원 · 마케팅 · 고객지원 — 과 그 안의 역량, 역량이 다루는 대상까지.", "+현재 규모는 `node cli/src/index.mjs overview samples/storefront` 가 말한다(문서는", "+수를 적지 않는다). `validate` issue 0 · `health` healthy · orphan 0.", "+", "+**모든 노드가 `display_ko` 와 `display_en` 을 둘 다 가진다.** `title` 은", "+검색·매칭의 단일 진실원이라 영어 정본으로 두고, 화면 이름은 `display_*` 가", "+나른다. 본문은 로케일 분기가 없으므로 **영어 문단 + 한국어 문단 병기**로 갔다 —", "+어느 언어 사용자도 막히지 않는 형태다.", "+", "+**온톨로지가 트리가 아니라 그래프임이 보인다.** 도그푸드 볼트는 `relates` 가", "+0이라 그걸 가르칠 예시가 없었다. 이 샘플은 \"반품 접수 ↔ 교환 접수\",", "+\"회원 등급 ↔ 적립금\" 같은 의미 관계와, \"주문 확정 → 결제 승인 · 재고 선점\"", "+같은 도메인을 가로지르는 의존을 실제로 담는다.", "+", "+**`/ko/project/storefront/` 가 404 였다.** `generateStaticParams` 가 도그푸드", "+매니페스트에서만 slug 를 뽑고 있어서, 앱 곳곳이 홍보하는 유일한 데모가 자기", "+정본 주소를 못 가졌다 — 공유·북마크·크롤러가 다 막혔다. 이제 **번들된 샘플", "+전부**에서 뽑는다(`bundledProjectSlugs()`), 게이트는", "+`tests/contract/bundled-project-routes.contract.test.ts`.", "+", "+**샘플을 겨냥한 테스트에서 이름과 수를 걷었다.** 공방 e2e 5개가", "+`capability:order-create` 를 박고 있었고 재생성으로 한꺼번에 죽었는데 **제품", "+결함은 0건**이었다. 이제 매니페스트에서 조건에 맞는 노드를 유도한다", "+(`tests/e2e/storefront-node.ts`).", "+", "+---", "+", " ## 2026-08-01 — 문서 검사를 산문 핀에서 생성-후-diff 로 바꿨다", "@@ -44,2 +44,65 @@", " ", "+## 2026-08-01 — 쇼핑몰 샘플 재생성 보고: 브릿지 규격은 **구축이 아니라 수리**의 도구다 (실전 첫 검증)", "+", "+**소집**: 단독 패스 · **트리거**: 2026-07-31 「온톨로지 구축 규격」이 요구한 재생성 보고 (*\"손보정 0건 보고 — 있었다면 위치+이유=규격 구멍 목록\"*), 쇼핑몰 샘플 몫.", "+**선행 결정 관계**: 2026-07-31 「구축 규격」과 2026-08-01 「슬러그는 평평한 식별자다」를 **인용하며 유효**로 둔다. 뒤집는 것 없음.", "+", "+**관측 (규격의 실전 첫 브릿지 검증)**", "+", "+도그푸드 재생성은 최대 팬아웃이 5라 방아쇠가 한 번도 안 걸렸고, 그래서", "+**브릿지 규칙(구축 규격 4단계)은 코드가 아니라 문장으로만 존재했다.** 쇼핑몰은", "+자연히 넓어지는 도메인이라 그 첫 시험대였다. 결과:", "+", "+1. **팬아웃 방아쇠는 걸렸다.** `capabilities/payment-authorize` 가 결제 수단", "+   8개를 자식으로 들고 있었고(트리거 6), `domains/catalog` · `domains/order` 가", "+   역량 8개로 트리거에 닿았다.", "+2. **브릿지는 2개 만들었다** — `capabilities/wallet-payment`(간편결제) ·"]}, {"hash": "907887923", "msg": "refactor: 문서 검사를 산문 핀에서 생성-후-diff 로 바꾼다 — 2,021개를 걷고 105개를 남긴다 (#807)", "ago": "29 hours ago", "concepts": [{"slug": "README", "kind": "document"}], "files": [["M", "AGENTS.md"], ["M", "README.md"], ["M", "docs/CHANGELOG.md"], ["M", "docs/DECISIONS.md"], ["M", "docs/DEVELOPMENT-CHECKS.md"], ["M", "docs/archive/DATA-MODEL.md"], ["M", "docs/audits/CASE-STUDY-AGENTS-MD-DRIFT.md"], ["M", "docs/guide/relations.md"]], "diff": [" docs/.generated/mcp-surface.json          | 494 ++++++++++++++++++++++++++++++", " docs/CHANGELOG.md                         |  30 +-", " docs/DECISIONS.md                         | 115 +++++++", " docs/DEVELOPMENT-CHECKS.md                |  49 +++", " docs/archive/DATA-MODEL.md                |   2 +-", " docs/audits/CASE-STUDY-AGENTS-MD-DRIFT.md |   8 +-", " docs/guide/relations.md                   |   2 +-", " 7 files changed, 693 insertions(+), 7 deletions(-)", "@@ -0,0 +1,494 @@", "+{", "+  \"_generatedBy\": \"pnpm docs:surface:build\",", ode-shapes.ts:201` — 음각 숫자 폰트 `600 ${size}px ui-monospace…`", "-  패밀리/웨이트 hardcode.", "+- `render/node-shapes.ts` 의 `drawEngraved()` — 음각 숫자 폰트 `600 ${size}px ui-monospace…`", "+  패밀리/웨이트 hardcode(심볼 이름 참조, 2026-08-01 정정 — 이전엔 `:201` 행 번호를", "+  가리켰는데 코드가 옮겨지면 조용히 틀린 곳을 가리키게 된다).", " - `ui/TopologyV2DetailPanel.tsx` — 색은 전부 `--topology-v2-panel-*` 토큰", "@@ -267,2 +268,164 @@ v1 의 [Absolute rules](#absolute-rules-donts) 전부 그대로 유효하다. ", " ", "+## 노드 규격 (Node Spec, 2026-08-01)", "+", "+> 토큰 **이름**(`--kind-glyph-*`, `--topology-v2-radius-*`)은 이미 있었다. 이", "+> 절이 채우는 건 그 이름이 **무엇을 뜻하는지** — 형태 매핑의 이유, 반지름이 왜", "+> 그 값인지, 크기가 왜 자식 수를 따르는지, 숫자가 언제 뜨는지. 소유자 지시", "+> (2026-08) \"노드 규격이나 정보들도 다 디자인 시스템에 들어가야\" 에 대한 답.", "+> 코드 참조는 **심볼 이름**으로 한다 — 행 번호는 코드가 한 줄만 옮겨도 조용히", "+> 틀린 곳을 가리킨다(바로 위 \"부채\" 절의 `node-shapes.ts:201` 참조가 그", "+> 실패 사례였고, 이 절을 쓰며 심볼 이름으로 고쳤다).", "+", "+### 1. 형태 — kind 는 색이 아니라 도형", "+", "+**채널 선택 자체가 규격이다.** 범주(kind)를 구분하는 시각 변수로 색 대신", "+형태를 쓴다. 이 저장소가 이미 인용해 온 Jacques Bertin, *Sémiologie", "+graphique* (1967) 의 논증대로 **색상(hue)은 순서를 표현하지 못한다**", "+(`.claude/agents/design-infoviz.md`). 이 앱은 hue 를 이미 두 가지 다른 뜻에", "+예약해 뒀다 — 명도/깊이 사다리로 **위계**(project ⊃ domain ⊃ capability ⊃", "+element, 아래 \"지도 잉크 사다리\" 절)를, 색 자체로 **상태**(신호 톤 3종 +", "+전원/펄스)를 나른다. kind 라는 순서 없는 범주 구분에 세 번째 hue 의미를", "+얹으면 이미 일하고 있는 두 채널이 오염된다 — 그래서 kind 는 형태로 나른다.", "+", "+| kind | 형태 | 캔버스 소스 | DOM 소스 |", "+|---|---|---|---|", "+| `project` | 육각(hex) 플레이트 | `hexPoints()` → `bodyPoints()` (`render/node-shapes.ts`) | `<polygon>` (`shared/ui/topology-v2-kind-glyph.tsx`) |", "+| `domain` | 사각 칩 (pin-tick 다리 4개) | `squarePoints()` → `bodyPoints()` | `<rect>` |", "+| `capability` | 원 (형태 변형 없음) | `bodyPoints()` → `null`(이미 원) | `<circle>` |", "+| `element` | 사각 + 중앙 via-hole(드릴 홀) | `bodyPoints()` 바디 + `draw()` 안 별도 via 아크 | `<rect>` + 중앙 `<circle>` |", "+", "+**두 게이트웨이가 반드시 같은 매핑을 그린다** — 표에 적는 것만으로는 안", "+지켜진다(§\"규격은 lint 로 강제된다\" 원칙 그대로). 각 파일은 자기 안에서만", "+일관성을 검증해 왔다(`node-shapes.test.ts`, `topology-v2-kind-glyph.test.tsx`)", "+— 두 파일이 **서로** 같은 매핑인지는 아무 것도 안 보고 있었다. 계약 테스트", "+`tests/contract/node-kind-shape-parity.contract.test.ts`(2026-08-01 신설)가 그", "+자리를 메운다: 프로브로 한쪽 매핑을 깨뜨려 실패를 확인했다(도메인 실루엣을", "+원으로 바꿔 그리게 만들면 즉시 적발).", "+", "+형태는 `farT`(원거리 진행도)에 따라 원으로 수렴한다 — `FULL_CIRCLE_FAR_T =", "+0.985` 를 넘으면 무조건 원. 모서리 반지름은", "+`interpolateCornerRadius(minCornerRadius(kind, r), r, farT)` 로", "+`minCornerRadius`(kind 별 최소 모서리 비율 — 예: project 는 반지름의 14%)에서", "+`r`(완전한 원)까지 보간한다 — 실루엣 스왑이 아니라 연속 모프", "+(`docs/TOPOLOGY-V2-DESIGN.md` §3.1).", "+", "+장식(pin-tick·via-hole·이중 헤어라인)은 실루엣이 아니라 재질 표현이고,", "+반지름·`farT` 게이트 아래서만 그려진다(원거리에서 소멸). 임계값은", "+`node-shapes.ts` 상단 상수 블록(`DOMAIN_PIN_MIN_HALF_EXTENT` 등)이 단일", "+출처다 — 이 문서에 값을 복제하지 않는다(복제는 드리프트의 시작, Carbon).", "+"]}, {"hash": "a83850ca8", "msg": "feat: 브릿지 노드에 이름·자격 조건을 붙이고, 빈 브릿지와 브릿지 모양을 파생한다 (#804)", "ago": "2 days ago", "concepts": [{"slug": "capabilities/mcp-server", "kind": "capability"}], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/ontology/capabilities/mcp-server.md"]], "diff": [" docs/DECISIONS.md                        | 26 ++++++++++++++++++++++++++", " docs/ontology/capabilities/mcp-server.md |  5 +++--", " 2 files changed, 29 insertions(+), 2 deletions(-)", "@@ -78,2 +78,28 @@", " ", "+## 2026-08-01 — [확장] 브릿지 노드를 규격의 1급 개념으로 — 이름 없는 절차에 이름과 자격 조건을 붙인다", "+", "+**소집 근거**: 소유자 직접 요구 (*\"노드가 수십 개씩 확산되면 이상하지? 브릿지 노드 같은 걸 고민해야 한다 … 구축 시스템 프롬프트가 매우 좋아야 한다? 도구도 그렇고\"*) — **소집한 자리**: 없음. 기존 결정의 연장이다: `CONSTRUCTION_RULES_EN` step 4(공유 행동을 명명해 add_concept 1회 + 자식 재부모화)가 이미 정확히 이 행위를 지시하는데 **대상의 이름이 없어** LLM 이 「이런 노드를 만들어도 된다」를 개념으로 집지 못했다. chief 단독 조정, 구현 판정 2건은 기준과 함께 구현자 위임.", "+", "+**정의 — 자격 조건 4가 붙지 않은 브릿지 권장은 빈 버킷 승인이다** (카운슬 전체가 합의한 Goodhart 함정과 정면 충돌하므로, 이름과 자격은 반드시 함께 간다):", "+1. 브릿지는 자식들이 **공유하는 행동을 명명**한다 — 「그룹 A/B」처럼 자리만 나누면 브릿지가 아니다.", "+2. 그 행동을 **한 문장으로 쓸 수 있어야** 만든다(step 4 기존 조건 승계).", "+3. 브릿지 자신도 **다른 형제와 의미 배타적**이어야 한다.", "+4. 만든 뒤 자식이 **실제로 재부모화**돼야 한다 — 빈 채로 남으면 그게 빈 버킷이다.", "+", "+**코드 방어**: 자식 0개(해소 기준)이거나 본문이 스타터 템플릿 그대로인 브릿지는 결정론적으로 잡혀야 한다 — 기존 「존재를 벌었나」 부류 감사에 걸리는지 확인하고 안 걸리면 배선(프롬프트만으로는 비프론티어에서 샌다 — 기존 강등 원칙 그대로).", "+", "+**정한 경계**:", "+- **kind 신설 반대** — 4-kind 위계는 제품의 뼈대고 스키마 enum 이 고정한다. 지도가 브릿지를 판별해야 한다면 **구조적 파생**(예: capability 이면서 자식이 전부 element 이고 자신이 다른 capability 의 자식) 우선, frontmatter 플래그는 위조·손편집 드리프트 표면이라 파생 불가가 증명될 때만.", "+- **원샷 브릿지 도구(add_concept+patch_concept N 을 한 호출로)는 이번에 만들지 않는다** — 새 MCP 도구는 공개 계약 확장이다. 재상정 조건: 캘리브레이션에서 약한 모델이 다단 절차를 완주 못 하는 것이 관측되면.", "+- **시각 표현**은 별도 디자인 사안 — 소유자 후보 중 glow·붉은 테두리는 헌장 금지(glow 명문 예외 1건뿐, 적색은 error 전용). 데이터 쪽 산출은 판별 가능성 결론까지.", "+- 순서: **볼트 재생성보다 먼저** — 브릿지 개념 없이 재생성하면 다시 만들어야 한다.", "+", "+**위임한 판정 2건 (기준 포함, 구현자)**: ⓐ 브릿지 안내가 `add_concept` description 인가 서버 안내문인가 — 바이트 예산 실측으로 판정 ⓑ 밀집 경고의 다음-할-일 문구를 「브릿지를 만들라」로 구체화 — step 4 와 문장 중복 없이.", "+", "+**반증 조건**: ① 자격 조건 4가 프롬프트에 있는데도 빈 브릿지가 생성되는 세션 관측 → 코드 방어 승격 ② 다단 절차 완주 실패 관측 → 원샷 도구 재상정(별도 원장 기록으로) — **재검토**: 볼트 재생성 캘리브레이션 결과.", "+", "+**상태**: 유효", "+", "+---", "+", " ## 2026-07-31 — [정정] 구축 규격에 «연구된 권장 범위»를 채운다: 부트스트랩 트리거 8(domain→capability)·6(capability→element), 살아있는 볼트 p90 우선 — 그리고 dogfood 볼트는 수리가 아니라 전면 재생성한다", "@@ -104,3 +104,4 @@ reject 한다. `tools/list` 도 scalar string 과 string-array item 에 같은", " `materialize_external_element` / `unassigned_node` / `empty_domain` /", "-`separate_evidence_from_concept` / `fold_bulk_siblings` 만", "+`separate_evidence_from_concept` / `fold_bulk_siblings` /", "+`retire_unearned_node` 만", " 허용해 잘못된 relation / maintenance filter 를 조용히 drop 하지 않는다. match/search 계열 optional scalar filter 도 core 에서", "@@ -412,3 +413,3 @@ post-write compact `postWriteMaintenance` 도 queue bucket 과 executable action", " `unassigned_node` / `empty_domain` / `separate_evidence_from_concept` /", "-`fold_bulk_siblings` 으로 검증해", "+`fold_bulk_siblings` / `retire_unearned_node` 으로 검증해", " agent 작업 큐 filter 오타가 빈 계획으로 조용히 숨지 않게 한다. verify / dogfood"]}, {"hash": "4940106e4", "msg": "feat: 온톨로지 구축 규격 — 자격 게이트(코드) + 구축 절차(프롬프트) 세 경로 (#803)", "ago": "2 days ago", "concepts": [{"slug": "capabilities/mcp-server", "kind": "capability"}], "files": [["M", "docs/DECISIONS.md"], ["M", "docs/ontology/capabilities/mcp-server.md"]], "diff": [" docs/DECISIONS.md                        | 32 ++++++++++++++++++++++++++++++--", " docs/ontology/capabilities/mcp-server.md |  6 ++++--", " 2 files changed, 34 insertions(+), 4 deletions(-)", "@@ -78,2 +78,30 @@", " ", "+## 2026-07-31 — [정정] 구축 규격에 «연구된 권장 범위»를 채운다: 부트스트랩 트리거 8(domain→capability)·6(capability→element), 살아있는 볼트 p90 우선 — 그리고 dogfood 볼트는 수리가 아니라 전면 재생성한다", "+", "+**소집 근거**: 소유자 정정 2건(직전 레코드의 서명 범위 초과) — **소집한 자리**: 근거(po-evidence) 단발 호출 · **이유**: 「어떻게 아는가」와 서술/규범 구분이 걸린 문헌 조사. 카운슬 재소집 아님 — 직전 레코드의 본체(자격 게이트·하드 캡 없음·advisory 원칙)는 그대로 유효하고, 이 기록은 그 위 두 곳을 정정·확장한다.", "+", "+**소유자 정정 ① (권고 일부 뒤집음)**: *\"개수가 몇 개가 적절할지 … 온톨로지 논문들 다 찾아보라고 한 거야. 좀 정해 놓으면 훨씬 낫잖?\"* — 카운슬이 기각한 것은 통과/실패 **하드 캡**이고, 소유자가 요청한 것은 0에서 시작하는 사용자를 위한 **연구된 권장 범위**다. 둘은 다른데 chief 의 브리핑이 하나로 묶어 전달했다. 「상한 없음」 결론의 조사가 부족했다는 점은 지킴이 스스로 인정(*\"N&M 2001 단독 + OntoQA/OQuaRE 서술 메트릭의 규범 과대 해석\"*).", "+", "+**소유자 정정 ② (직전 레코드 OUT 항목 뒤집음)**: *\"dogfood 데이터를 신규 기반으로 전부 다 수정 … 기존 거 다 지우고 … 예시 쇼핑몰 데이터도\"* — 직전 슬라이스가 OUT 으로 두었던 「전면 볼트 재작성」을 소유자가 명시적으로 IN 으로 뒤집었다. 92 파일럿 수리 → **전면 재생성, 0에서**: 기존 `docs/ontology/` 를 통째로 지우고(브랜치에서, 지우기 전 커밋), **새 규격의 시스템 프롬프트를 따르는 에이전트가 이 저장소를 읽고 다시 만든다**(기존 진입점 `/ontology-bootstrap`·`analyze_repo_structure` 활용). 손보정 금지 — 손보정이 필요했다면 그 지점이 규격의 구멍이고, 고칠 것은 볼트가 아니라 규격 문장이다. 이 재생성이 곧 비프론티어 캘리브레이션 세션이다. 분포가 권장 범위를 벗어나면 규격을 고치고 재생성을 반복한다. 쇼핑몰 샘플 소스도 같은 절차. `created_by` 는 human 약 10(사람 판단이 성립 조건인 노드: 도메인 경계·프로젝트 정의·방향)·나머지 `agent:*`, 선정 근거를 문서에 남긴다 — #801 의 「소급 추론 금지」는 기존 볼트 얘기고, 새로 만드는 볼트는 값이 사실이다. 순서는 소유자 명시: **규격 확정(값+PR1~3) → 재생성**. 재생성 자체가 규격의 첫 검증이다 — 새 볼트 분포가 권장 범위를 벗어나면 규격이 틀린 것이다.", "+", "+**근거 조사 결과 (2026-07-31, 출처는 직접 열어 확인)**:", "+- **권장(트리거) 범위**: `domain→capability` **6~10, 중심 8** · `capability→element` **5~7, 중심 6** · `project→domain` 은 표본 무의미로 규격에 넣지 않음. 서술 통계에서의 승격이며 승격 근거는 실측 분포다 — schema.org `Thing` 직속 11(15년 프로덕션 루트 폭), 우리 볼트 비허브 domain 중앙값 4, 유일한 건강 사례 `topology-kind-legibility`(element 7개 전부 실노드 해소).", "+- **적용 형태**: 볼트 자신의 p90 이 1순위(해당 kind 부모 10개 이상일 때), 부트스트랩 값은 그 전까지의 폴백. 하드 캡 아님 — 트리거 시 요구하는 것은 「형제와 겹치지 않는 한 문장」이지 개수 축소가 아니다.", "+- **발화 조건 강등 (비프론티어 대응)**: 밀집 부모 경고는 참조 해소율 <70% 또는 bulk-provenance 동반 시에만 발화 — 전부 해소된 넓은 부모(schema.org `CreativeWork` 직속 67, 정당한 대팬아웃)는 트리거하지 않는다. 「공유 접두사」는 필수 사전 필터에서 격하 — 방향이 양쪽 다 틀리는 신호로 실측됨(`topology-kind-color-*` ×4 는 정당, cli 92는 접두사 0 겹침인데 결함).", "+- **직전 레코드의 사실 정정 2건**: ⑴ \"OQuaRE 의 NOCOnto 는 권고 임계값 자체가 없다\" 는 부정확 — 밴드는 있으나 SE 관행 차용이고 전문가 신뢰도가 갈린다(Duque-Ramos 2013 · PLOS ONE 2014). \"무규범\"도 \"1급 규범\"도 과단순화. ⑵ Miller 7±2 는 재인(recognition) 과제에 적용되지 않아 이 규격의 근거로 쓰지 않는다(Larson & Czerwinski 1998 의 함의는 오히려 「라벨 질이 좋으면 폭은 문제 아님」).", "+- **실측 추가**: `capabilities/elements[]` 234건 중 노드 해소 38건(16%) — cli 의 92는 유일 사례가 아니라 극단값이고, 대다수 capability 는 element 문서 없이 코드 경로만 가리킨다. `denseParentActionMessage()` 는 p90 인자를 받도록 짜여 있으나 호출부 0건(배선 미완 스텁)이었다.", "+", "+**적용한 규칙**: 최소 슬라이스(새 응답 스키마 0 — 기존 게이트·`postWriteMaintenance`·상수 블록 확장만) · 합집합 금지(접두사 신호를 살리는 절충 대신 격하).", "+", "+**권고 (chief)**: 위 값을 `schema.mjs` `BOOTSTRAP_FANOUT_TRIGGER`(8/6) + `MIN_PARENTS_FOR_LIVE_PERCENTILE`(10) 로 심고 dense-parent 트리거를 배선(PR1 후속, 같은 브랜치) → PR2/PR3 텍스트 파생 → **재생성 스테이지**: 전면 — 부분 존치 판정은 소유자가 명시 철회(*\"기존 데이터를 아예 지우고 새로 만들어야지 처음부터, 지금 우리가 세팅할 시스템 프롬프트 기반으로\"*). 판정 기준: 새 볼트 분포가 권장 범위 안 · `elements:` 에 파일 경로 0건(그건 evidence) · vault:validate/package:check/docs-vault:check 통과 · 내용이 실제 코드와 정합 · **손보정 0건 보고**(있었다면 위치+이유=규격 구멍 목록). 쇼핑몰 샘플은 생성물 직접 편집 금지, 소스에서 재생성. 캘리브레이션 시나리오에 CreativeWork 형(넓지만 정당) 케이스 필수 포함.", "+**서명 (accountable: 소유자)**: 승인 — 정정 자체가 소유자 발화다. 잔여 확인 1건: 부트스트랩 값 8/6 자체는 근거의 승격 판단이므로 재생성 결과가 나오면 실측으로 재검한다.", "+", "+**기록된 반대 / 반증 조건**: ⑴ 8/6 이 틀렸다면 — 규격 가동 후 신규 볼트들의 실측 중앙값이 8/6 근방이 아니라 뚜렷이 다른 값에 수렴하는 것이 관측된다 → 그 실측값으로 상수 교체 (**재검토**: 재생성 스테이지 완료 + 첫 성장 리포트). ⑵ 발화 조건 강등이 틀렸다면 — 참조가 전부 해소됐는데도 사람·에이전트가 다루지 못하는 20+ 자식 부모가 관측된다 function nodeShape(kind,x,y,r,cls,idSuffix){

  const st=`fill:${fill};stroke:${stroke};`;
  if(k==="project"){const pts=[0,60,120,180,240,300].map((d)=>{const t=(d-90)*Math.PI/180;
    return `${(x+r*Math.cos(t)).toFixed(1)},${(y+r*Math.sin(t)).toFixed(1)}`;}).join(" ");
    return `<polygon class="${cls}" style="${st}" points="${pts}"/>`;}
  if(k==="capability") return `<circle class="${cls}" style="${st}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}"/>`;
  const side=r*1.72, rx=k==="domain"?r*0.34:r*0.2;

function egoOf(slug){
  const n=vaultOf(slug); if(!n) return null;
  const g={belongs_to:[],contains:[],depends_on:[],used_by:[]};
  (n.out||[]).forEach((e)=>{ if(e.type==="belongs_to") g.belongs_to.push(e.to);
                             else if(e.type==="contains") g.contains.push(e.to);
                             else g.depends_on.push(e.to); });
  (n.in||[]).forEach((e)=>{ if(e.type==="belongs_to"||e.type==="contains") g.contains.push(e.from);
                            else g.used_by.push(e.from); });
  Object.keys(g).forEach((k)=>{g[k]=[...new Set(g[k])];});
  return {node:n,g};

/*

function renderEgoGraph(slug){

    const shown=all.slice(0,cap);
    return {...b, all, shown, rest:all.length-shown.length, slots:shown.length+(all.length>shown.length?1:0)};
  }).filter((g)=>g.all.length);
  if(!groups.length) return `<div class="egograph"><div class="eg-empty">이 개념은 아직 이어진 곳이 없어요</div></div>`;
  const slots=groups.reduce((a,g)=>a+g.slots,0);

  /*

   * 노드가 21~37px 사이를 오갔다(실측) — 그 크기 변화는 **아무 사실도 안 나른다**.

   * 따라 움직인다. 이웃이 둘이면 가깝게, 여덟이면 넓게.

  const VW=660, VH=345, cx=VW/2, cy=VH/2;
  const maxSlots=Math.max(...groups.map((g)=>g.slots), 1);
  const R=Math.max(74, Math.min(126, 58+ (slots<=2?26:0) + maxSlots*11));
  /* 어긋 배치 폭도 밀도를 따른다 — 17개를 한 고리에 두면 이웃 라벨끼리 붙는다. */
  const STAG=slots>12?36:slots>4?22:0, EX=1.52, EY=0.80;

      const t=g.slots===1?0.5:i/(g.slots-1);
      const ang=(cursor+GAP/2+(g.slots===1?span/2:span*t))*Math.PI/180;
      /*
