       * 이웃의 라벨과 같은 높이에 앉아 부딪힌다(실측 2건). 한 겹 바깥으로 뺀다.
       */
      const isMoreSlot=g.rest>0&&i===g.slots-1;
      const rr=R+(i%2)*STAG+(isMoreSlot?34:0);
      const x=cx+rr*Math.cos(ang)*EX, y=cy+rr*Math.sin(ang)*EY;
      const dep=g.k==="depends_on"||g.k==="used_by";
      out+=`<path class="eg-edge ${dep?"dep":""}" data-fan="${g.k}" d="M${cx},${cy} L${x.toFixed(1)},${y.toFixed(1)}"/>`;
      if(isMoreSlot){
        const mw=26+String(g.rest).length*6;
        out+=`<g class="eg-g eg-morehit" data-fan="${g.k}" tabindex="0" role="button" aria-label="접힌 ${g.rest}개 마저 보기"><rect class="eg-morebox" x="${(x-mw/2).toFixed(1)}" y="${(y-9).toFixed(1)}"
            width="${mw}" height="18" rx="9"/>
          <text class="eg-more" x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle">외 ${g.rest}</text></g>`;
   continue;
      }
      const sn=g.shown[i], nb=vaultOf(sn), nk=nb?.kind??"element", full=labelOf(sn);
      /*
       * 상자가 고정이라 긴 이름은 넘친다. 게다가 부채가 촘촘할수록 옆 라벨과
       * 부딪히므로, 자르는 길이를 **밀도에 맞춘다** — 펼친 17개 부채에서 이
       * 규칙 없이는 겹침이 남았다(실측 1건).
       */
      const maxLen=g.slots>12?9:g.slots>8?12:16;
      const name=full.length>maxLen?full.slice(0,maxLen-1)+"…":full;
      const rn=R_NB[nk]??9;
      /*
       * 세로에 가까운 자리에서 라벨을 노드 위/아래에 두면(가운데 정렬) 이웃한
       * 두 슬롯의 라벨이 같은 높이에 쌓여 겹친다(실측). 거의 수직인 자리만
       * 가운데로 두고, 나머지는 좌우로 뻗게 해 서로 비켜 가게 한다.
       */
      const cos=Math.cos(ang), right=cos>0.04, left=cos<-0.04;
      const lx=x+(right?rn+8:left?-(rn+8):0);
      const ly=y+(right||left?3.5:(Math.sin(ang)>0?rn+15:-(rn+9)));
      out+=`<g class="eg-g" data-fan="${g.k}"><title>${full} · ${KIND_KO[nk]??nk}</title>
        ${nodeShape(nk,x,y,rn,"eg-node")}
        <text class="eg-label" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${right?"start":left?"end":"middle"}">${name}</text>
        <circle class="eg-hit" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(rn+9).toFixed(1)}"
          data-go="${sn}" tabindex="0" role="button" aria-label="${full} 로 넘어가기"/></g>`;

    }
    /*
     * 관계 이름은 이제 왼쪽 읽기 칸이 진다. 그림 안에 두면 부채 바깥 40px 에
     * 앉아 상자를 넓히고, 상자가 넓어지면 세로에 묶인 그림이 통째로 줄어든다
     * (실측: 이름을 뺀 것만으로 채움률이 오른다). 그림은 그림만 그린다.
     */
    cursor+=span+GAP;
  });
  const rs=R_SELF[kind]??10;
  const selfName=labelOf(slug), selfShown=selfName.length>22?selfName.slice(0,21)+"…":selfName;
  out+=`<g><circle class="eg-selring" cx="${cx}" cy="${cy}" r="${(rs+6).toFixed(1)}"/>
    ${nodeShape(kind,cx,cy,rs,"eg-node self")}
    <title>${selfName}</title><text class="eg-label self" x="${cx}" y="${(cy+rs+18)}" text-anchor="middle">${selfShown}</text></g>`;
  const total=groups.reduce((a,g)=>a+g.all.length,0);
  return `<div class="egograph"><svg viewBox="0 0 ${VW} ${VH}"
     role="img" aria-label="${labelOf(slug)} 와 바로 옆 이웃 ${total}개">${sheenDefs()}${out}</svg></div>`;
}
/** 종류마다 가진 사실이 다르다 — 실측: path 는 요소 43/43, 도메인·역량 0/25. */
function propsFor(slug){
  const n=vaultOf(slug); if(!n) return "";
  const by=n.by?(/^agent/.test(n.by)?"에이전트":"사람"):null;
  const e=egoOf(slug), g=e?e.g:{contains:[],depends_on:[]};
  const rows = n.kind==="project" ? [["갈래",`${g.contains.length}개 도메인`],["쓴 주체",by],["볼트 위치",`docs/ontology/`,1]]
    : n.kind==="domain"        ? [["상위",g.belongs_to.length?labelOf(g.belongs_to[0]):"프로젝트 직속"],["쓴 주체",by],["담은 것",`${g.contains.length}개`]]
    : n.kind==="capability"    ? [["도메인",n.domain?labelOf(n.domain):"없음"],["쓴 주체",by],["실현 요소",`${g.contains.length}개`]]
    :                            [["도메인",n.domain?labelOf(n.domain):"없음"],["쓴 주체",by],["증거",n.path,1]];
  const rel=BEARINGS.map((b)=>({...b,n:(g[b.k]??[]).length})).filter((b)=>b.n);
  return `<dl class="props">
    ${rows.map(([t,v,mono])=>`<div class="prop"><dt>${t}</dt>
      <dd class="${v?"":"none"}">${v?(mono?`<code>${v}</code>`:v):"—"}</dd></div>`).join("")}
    ${rel.length?`<div class="prop rel"><dt>이어진 곳</dt>
      ${rel.map((b)=>`<div class="relrow" data-fan="${b.k}"><i class="rl ${b.k==="depends_on"||b.k==="used_by"?"dep":""}"></i>
        <span>${b.ko}</span><b>${b.n}</b></div>`).join("")}</div>`:""}
  </dl>`;
}
function renderEgo(slug){
  const n=vaultOf(slug);
  if(!n) return `<div class="ego"><div class="ego-id"><b>${labelOf(slug)}</b>
    <span class="kd">이 문서는 아직 개념으로 등록되지 않았어요</span></div></div>`;
  const kind=n.kind??"element";
  return `<div class="ego">
    <div class="ego-id">${glyph(kind)}<b>${labelOf(slug)}</b><span class="kd">${KIND_KO[kind]??kind}</span>
      ${egoOverride?`<button class="act" id="egoBack" style="margin-left:auto;height:24px">걸음이 바꾼 개념으로</button>`:""}
      <button class="act" id="egoToggle" style="${egoOverride?"":"margin-left:auto;"}height:24px">${egoOpen?"그림 접기":"그림 펼치기"}</button></div>
    ${egoOpen?`<div class="ego-body">${propsFor(slug)}${renderEgoGraph(slug)}</div>`:propsFor(slug)}
  </div>`;
}
let egoOpen=true, focusIdx=0, chipsAll=false;
/** 그림에서 이웃을 눌러 들어간 개념. 걸음이 바뀌면 풀린다. */
let egoOverride=null;
/** 펼쳐 놓은 부채. 개념이 바뀌면 접힌다. */
let openFans=new Set();
function renderDetail(){
  const steps=visibleSteps();
  const s=steps[selected];
  if(!s){el("detail").innerHTML=`<div class="dempty">왼쪽에서 걸음을 골라 보세요.</div>`;return;}
  const sorted=[...s.concepts].sort(sortK);
  const files=filesOf(s);
  el("detail").innerHTML=`
    <div class="dhead">
      <div class="dsubj">${s.pending?"아직 안 남긴 변화":s.msg}</div>
      <div class="dmeta">${s.pending?"이 폴더에서 고친 것 — 남기면 걸음이 됩니다":`${s.hash}00000000 · ${s.ago}`}</div>
    </div>
    ${sorted.length?`<div class="dsec">
      <div class="dlabel">바뀐 개념 <i>${sorted.length}</i></div>
      <div class="chips">
        ${sorted.slice(0,chipsAll?sorted.length:12).map((c,i)=>`<button class="chip ${i===focusIdx?"on":""}" data-f="${i}">${glyph(c.kind)}${labelOf(c.slug)}</button>`).join("")}
        ${sorted.length>12&&!chipsAll?`<button class="chip" id="chipMore">외 ${sorted.length-12}개 모두 보기</button>`:""}
      </div>
    </div>`:""}
    ${sorted.length?`<div class="dsec">
      <div class="dlabel">고른 개념 <i>성질과 바로 옆 이웃 · 이웃을 누르면 그쪽으로 넘어갑니다</i></div>
      ${renderEgo(egoOverride ?? sorted[Math.min(focusIdx,sorted.length-1)].slug)}
    </div>`:""}
    <div class="dsec">
      <div class="dlabel">바뀐 파일 <i>${files.length}</i></div>
      <div class="files">${files.map(([m,p])=>`<div class="file"><span class="m ${m==="A"?"a":m==="D"?"d":"mm"}">${m}</span><span>${p}</span></div>`).join("")}</div>
    </div>
    ${s.diff&&s.diff.length?`<div class="dsec">
      <div class="dlabel">바뀐 내용 <i>이 걸음이 문서에 실제로 쓴 것</i></div>
      <div class="diff">${s.diff.filter((l)=>!/^\s*\S+ \| \d+ [+-]*$/.test(l) && !/^ \d+ files? changed/.test(l)).map((l)=>{
        const c=l[0]==="+"?"add":l[0]==="-"?"del":l.startsWith("@@")?"hunk":"ctx";
        return `<div class="dl ${c}">${l.replace(/</g,"&lt;")||"&nbsp;"}</div>`;}).join("")}</div>
    </div>`:""}`;
  wireChips();
}

function wireChips(){
  // 「외 N」 펼치기
  /* 키보드도 같은 일을 한다 — 마우스 전용 기능은 없는 기능이다. */
  const press=(el,fn)=>{el.addEventListener("click",fn);
    el.addEventListener("keydown",(ev)=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); fn(); }});};
  el("detail").querySelectorAll(".eg-morehit").forEach((m)=>press(m,()=>{
    openFans.add(m.dataset.fan); renderDetail();
  }));
  // 읽기표 ↔ 그림 잇기
  const gph=el("detail").querySelector(".egograph");
  el("detail").querySelectorAll(".relrow[data-fan]").forEach((r)=>{
    const on=()=>{ if(!gph) return; gph.dataset.hi=r.dataset.fan;
      gph.querySelectorAll('[data-fan]').forEach((n)=>{
        if(n.dataset.fan===r.dataset.fan) n.setAttribute("data-hi-on",""); else n.removeAttribute("data-hi-on"); }); };
    const off=()=>{ if(!gph) return; delete gph.dataset.hi;
      gph.querySelectorAll('[data-hi-on]').forEach((n)=>n.removeAttribute("data-hi-on")); };
    r.addEventListener("mouseenter",on); r.addEventListener("mouseleave",off);
    r.addEventListener("focusin",on); r.addEventListener("focusout",off);
  });
  el("detail").querySelectorAll(".eg-hit[data-go]").forEach((h)=>press(h,()=>{
    egoOverride=h.dataset.go; openFans=new Set(); renderDetail();
  }));
  const bk=document.getElementById("egoBack");
  if(bk) bk.addEventListener("click",()=>{egoOverride=null;openFans=new Set();renderDetail();});
  const tg=document.getElementById("egoToggle");
  if(tg) tg.addEventListener("click",()=>{egoOpen=!egoOpen;renderDetail();});
  const more=document.getElementById("chipMore");
  if(more) more.addEventListener("click",()=>{chipsAll=true;renderDetail();});
  el("detail").querySelectorAll(".chip[data-f]").forEach((b)=>b.addEventListener("click",()=>{
    focusIdx=Number(b.dataset.f); egoOverride=null; openFans=new Set(); renderDetail();
  }));
}
function render(){renderTop();renderList();renderDetail();}

document.querySelectorAll(".switch button").forEach((b)=>b.addEventListener("click",()=>{
  document.querySelectorAll(".switch button").forEach((x)=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.s;selected=0;
  if(mode==="nogit"){
    /*
     * git 이 없으면 기록이 없다 — 목록도 상세도 그릴 것이 없다. 그래서 이
     * 상태만 본문을 통째로 안내로 바꾼다. 강등 카드 계약(surfaces.md): ① 왜
     * 이런지 ② 어디서 되는지 ③ 여기선 무엇이 되는지를 다 말한다.
     */
    document.querySelector(".body").innerHTML=`<div class="nogit">
      <div class="nogit-card">
        <div class="nogit-head">
          <span class="nogit-mark">⌥</span>
          <div>
            <h2>이 컴퓨터에 git 이 없어요</h2>
            <p>git 은 변경 이력을 쌓는 프로그램이에요. <b>한 번만 설치하면</b> 그 뒤로는 이 화면에서 다 됩니다.</p>
          </div>
        </div>
        <div class="nogit-ways">
          <div class="way"><span class="way-n">1</span><div>
            <b>명령어 도구 설치</b><i>대부분 이걸로 충분해요</i>
            <code>xcode-select --install</code></div></div>
          <div class="way"><span class="way-n">2</span><div>
            <b>Homebrew 를 쓰신다면</b><i>이미 brew 가 있을 때</i>
            <code>brew install git</code></div></div>
          <div class="way"><span class="way-n">3</span><div>
            <b>직접 받기</b><i>설치 프로그램으로</i>
            <a href="https://git-scm.com/downloads" target="_blank" rel="noreferrer">↗ git-scm.com/downloads</a></div></div>
        </div>
        <div class="nogit-foot">
          <button class="act primary">설치했어요 · 다시 확인</button>
          <span>설치 전에도 <b>지도 · 문서함 · 공방</b>은 그대로 쓸 수 있어요. 기록만 쉬어요.</span>
        </div>
      </div>
    </div>`;
    document.querySelector(".top").classList.add("muted");
    el("diverge").classList.remove("on");
    return;
  }
  location.hash=mode; location.reload();
}));

if(location.hash){mode=location.hash.slice(1)||"clean";
  document.querySelectorAll(".switch button").forEach((x)=>x.classList.toggle("on",x.dataset.s===mode));}
el("onlyCon").addEventListener("click",()=>{
  onlyConcepts=!onlyConcepts; el("onlyCon").classList.toggle("on",onlyConcepts);
  selected=0; focusIdx=0; renderList(); renderDetail();
});
document.querySelectorAll(".seg button[data-w]").forEach((b)=>b.addEventListener("click",()=>{
  el("onlyCon").addEventListener("click",()=>{
  onlyConcepts=!onlyConcepts; el("onlyCon").classList.toggle("on",onlyConcepts);
  selected=0; focusIdx=0; renderList(); renderDetail();
});
document.querySelectorAll(".seg button[data-w]").forEach((x)=>x.classList.remove("on"));
  b.classList.add("on");win=b.dataset.w;selected=0;renderList();renderDetail();
}));
selected=Math.max(0,visibleSteps().findIndex((x)=>x.concepts.length));
render();
</script>
