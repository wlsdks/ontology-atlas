<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>/ontology 허브 B3 — 허브가 곧 지도 (몰입형)</title>
<!--
  B3 rationale note (honest implication): this variant makes the hub page and
  /topology converge into one surface — the map IS the hub, the tree and the
  datasheet are floating instruments over it. If B3 ships, /topology stops
  being a separate destination and becomes this page's fullscreen state.
-->
<style>
  /* Values copied from app/globals.css token families (standalone prototype). */
  :root {
    --canvas-bg: #0a0a0d;
    --panel: #17171c;
    --border-soft: #2a2a30;
    --border-strong: #45454d;
    --divider: #23232a;
    --text-primary: #ececf0;
    --text-secondary: #a3a3ac;
    --text-tertiary: #868690;
    --text-quaternary: #55555d;
    --indigo: #5e6ad2;
    --indigo-bright: #8890e0;
    --numeral-face: #8c8c94;
    --numeral-shadow: #08080a;
    --metric-surface: rgba(255, 255, 255, 0.028);
    --row-hover: rgba(255, 255, 255, 0.045);
    --action-surface: rgba(255, 255, 255, 0.03);
    --machined-edge: rgba(255, 255, 255, 0.05);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--canvas-bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Pretendard", sans-serif;
  }
  .num {
    font-family: var(--mono); font-weight: 600;
    color: var(--numeral-face); text-shadow: 0 1px 0 var(--numeral-shadow);
    font-variant-numeric: tabular-nums;
  }

  /* ---- the page IS the map --------------------------------------------- */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }

  /* engraved census — carved straight into the canvas, top center */
  .census {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.14em; font-weight: 600;
    color: var(--numeral-face); text-shadow: 0 1px 0 var(--numeral-shadow);
    white-space: nowrap; pointer-events: none;
  }
  .census .sep { color: var(--text-quaternary); margin: 0 5px; }

  /* bottom-right legend — plain contract line, no chrome */
  .legend {
    position: fixed; right: 20px; bottom: 16px;
    display: flex; align-items: center; gap: 14px;
    font-size: 11px; color: var(--text-quaternary);
  }
  .legend b { color: var(--text-tertiary); font-weight: 560; }
  .legend .mono { font-family: var(--mono); }

  /* ---- left floating instrument panel: the machined tree ---------------- */
  .instrument {
    position: fixed; left: 18px; top: 18px; bottom: 18px; width: 316px;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 11px;
    box-shadow: inset 0 1px 0 var(--machined-edge), 0 22px 54px rgba(0, 0, 0, 0.55);
    display: flex; flex-direction: column;
    padding: 12px;
  }
  .instrument .phead {
    display: flex; align-items: center; gap: 8px;
    padding: 0 2px 10px;
  }
  .instrument .phead .plabel {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-tertiary);
  }
  .instrument .phead .power { margin-left: auto; }
  .power { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--indigo); flex: none; }
  .search { position: relative; margin-bottom: 8px; }
  .search input {
    width: 100%; appearance: none;
    background: var(--canvas-bg);
    border: 1px solid var(--border-soft); border-radius: 7px;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
    color: var(--text-primary);
    font: 400 12px/1 inherit; font-family: inherit;
    padding: 7px 10px 7px 28px; outline: none;
    transition: border-color 150ms ease;
  }
  .search input::placeholder { color: var(--text-quaternary); }
  .search input:hover { border-color: var(--border-strong); }
  .search input:focus { border-color: var(--indigo); }
  .search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); }

  .tree { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .tree::-webkit-scrollbar { width: 8px; }
  .tree::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 4px; }
  .trow {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px;
    border: 1px solid transparent;
    font-size: 12.5px; color: var(--text-secondary);
    cursor: pointer; user-select: none;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .trow:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .trow.sel { border-color: rgba(94, 106, 210, 0.55); color: var(--text-primary); background: var(--metric-surface); }
  .trow.dimmed { color: var(--text-quaternary); }
  .trow.dimmed:hover { color: var(--text-tertiary); }
  .trow .caret {
    width: 11px; flex: none; text-align: center;
    color: var(--text-quaternary); font-size: 8.5px;
    transition: transform 120ms ease;
  }
  .trow.open .caret { transform: rotate(90deg); }
  .trow .caret.leaf { visibility: hidden; }
  .trow .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .num { font-size: 11px; flex: none; }
  .trow .fresh-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--indigo); flex: none; }
  .trow .stale-mark {
    flex: none; font-size: 9.5px; color: var(--text-quaternary);
    border: 1px dashed var(--border-strong); border-radius: 4px; padding: 0 4px;
  }
  .depth-1 { margin-left: 18px; }
  .depth-2 { margin-left: 36px; }
  .group-kids.closed { display: none; }
  .instrument .pfoot {
    border-top: 1px solid var(--divider); padding-top: 9px; margin-top: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .instrument .pfoot .payload {
    min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: var(--mono); font-size: 10px; color: var(--text-quaternary);
  }
  .instrument .pfoot button {
    appearance: none; cursor: pointer; flex: none;
    font: 500 10.5px/1 inherit; font-family: inherit;
    color: var(--indigo-bright);
    background: var(--action-surface);
    border: 1px solid rgba(94, 106, 210, 0.5);
    border-radius: 5px; padding: 5px 8px;
    transition: background-color 150ms ease, border-color 150ms ease;
  }
  .instrument .pfoot button:hover { background: var(--row-hover); border-color: var(--indigo); }

  /* ---- right floating compact datasheet (on selection) ------------------ */
  .sheet {
    position: fixed; right: 18px; top: 18px; width: 296px;
    background: var(--panel);
    border: 1px solid var(--border-soft);
    border-radius: 11px;
    box-shadow: inset 0 1px 0 var(--machined-edge), 0 22px 54px rgba(0, 0, 0, 0.55);
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .sheet .head { display: flex; align-items: flex-start; gap: 8px; }
  .sheet .head .titleblock { min-width: 0; flex: 1; }
  .sheet .head .titlerow { display: flex; align-items: center; gap: 6px; }
  .sheet h2 {
    margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sheet .kindline { padding-left: 12px; margin-top: 2px; font-size: 10.5px; color: var(--text-tertiary); }
  .sheet .kindline .q { color: var(--text-quaternary); }
  .sheet .metric {
    border-radius: 5px; background: var(--metric-surface);
    border: 1px solid var(--divider);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
    padding: 6px 8px;
    font-family: var(--mono); font-size: 11px; color: #b6b6c0;
  }
  .sheet .metric b { font-weight: 600; color: var(--numeral-face); text-shadow: 0 1px 0 var(--numeral-shadow); }
  .sheet .group { display: flex; flex-direction: column; gap: 3px; }
  .sheet .ghead { display: flex; align-items: center; gap: 8px; }
  .sheet .ghead .glabel {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-tertiary);
  }
  .sheet .ghead .num { font-size: 10px; }
  .sheet .row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px; border-radius: 5px;
    font-size: 11.5px; color: var(--text-secondary); cursor: pointer;
  }
  .sheet .row:hover { background: var(--row-hover); }
  .sheet .row .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .foot {
    display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--divider); padding-top: 8px;
  }
  .sheet .foot button {
    appearance: none; cursor: pointer; flex: none;
    font: 500 10.5px/1 inherit; font-family: inherit;
    color: var(--indigo-bright);
    background: var(--action-surface);
    border: 1px solid rgba(94, 106, 210, 0.5);
    border-radius: 5px; padding: 5px 8px;
    transition: background-color 150ms ease, border-color 150ms ease;
  }
  .sheet .foot button:hover { background: var(--row-hover); border-color: var(--indigo); }
  .sheet .foot a {
    font-size: 11px; color: var(--text-tertiary); text-decoration: none; margin-left: auto;
  }
  .sheet .foot a:hover { color: var(--text-secondary); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="census">296 CONCEPTS<span class="sep">·</span>508 RELATIONS<span class="sep">·</span>6 DOMAINS</div>

<div class="legend">
  <span><b>클릭</b> 포커스</span>
  <span><b>Esc</b> 개요</span>
  <span class="mono">contains ─ · depends ╌</span>
</div>

<!-- left floating instrument: the machined tree over the map -->
<aside class="instrument" aria-label="개념 목차">
  <div class="phead">
    <span class="plabel">Index</span>
    <span class="power" title="에이전트 동기화 12분 전"></span>
  </div>
  <div class="search">
    <svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#55555d" stroke-width="1.3"/><line x1="7.8" y1="7.8" x2="11" y2="11" stroke="#55555d" stroke-width="1.3" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="개념 검색" autocomplete="off" />
  </div>
  <nav class="tree" id="tree"></nav>
  <div class="pfoot">
    <span class="payload">get_concept("capabilities/product-owner-operating-system")</span>
    <button type="button">다음 액션 복사</button>
  </div>
</aside>

<!-- right floating compact datasheet — appears on selection -->
<aside class="sheet">
  <div class="head">
    <span class="glyph" data-glyph="capability" style="margin-top:1px"></span>
    <div class="titleblock">
      <div class="titlerow">
        <span class="power"></span>
        <h2>Product Owner Operating System</h2>
      </div>
      <div class="kindline">역량 <span class="q">· 전원 켜짐 · Onboarding &amp; UX</span></div>
    </div>
  </div>
  <div class="metric">쓰는 곳 <b>2</b> · 기대는 곳 <b>2</b> · 근거 <b>1</b></div>
  <div class="group">
    <div class="ghead">
      <svg width="22" height="6" viewBox="0 0 22 6" aria-hidden="true"><line x1="1" y1="3" x2="21" y2="3" stroke="#4a4a54" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span class="glabel">담는 것</span><span class="num">1</span>
    </div>
    <div id="sheet-contains"></div>
  </div>
  <div class="group">
    <div class="ghead">
      <svg width="22" height="6" viewBox="0 0 22 6" aria-hidden="true"><line x1="1" y1="3" x2="21" y2="3" stroke="#5c5c72" stroke-width="1.4" stroke-dasharray="3 3" stroke-linecap="round"/></svg>
      <span class="glabel">서로 잇닿음</span><span class="num">2</span>
    </div>
    <div id="sheet-relates"></div>
  </div>
  <div class="foot">
    <button type="button">다음 액션 복사</button>
    <a href="#">전체 상세 →</a>
  </div>
</aside>

<script>
(function () {
  "use strict";
  var GLYPH_COLORS = {
    project:    { fill: "#1c1c22", stroke: "#57575f" },
    domain:     { fill: "#191920", stroke: "#48484f" },
    capability: { fill: "#17171d", stroke: "#3c3c44" },
    element:    { fill: "#15151a", stroke: "#34343b" }
  };
  var DIM = { fill: "#1a1a1e", stroke: "#2e2e34", edge: "#1f1f25" };
  var INDIGO = "#5e6ad2", INDIGO_BRIGHT = "#8890e0";

  function hexPts(c, r) {
    var pts = [];
    for (var i = 0; i < 6; i++) {
      var a = (i * 60 - 90) * Math.PI / 180;
      pts.push((c + r * Math.cos(a)).toFixed(2) + "," + (c + r * Math.sin(a)).toFixed(2));
    }
    return pts.join(" ");
  }
  function glyphSVG(kind, s) {
    s = s || 14;
    var col = GLYPH_COLORS[kind] || GLYPH_COLORS.element;
    var c = s / 2;
    var common = 'fill="' + col.fill + '" stroke="' + col.stroke + '" stroke-width="1.25"';
    var body;
    if (kind === "project") body = '<polygon points="' + hexPts(c, c - 1.2) + '" ' + common + '/>';
    else if (kind === "domain") body = '<rect x="' + (s * 0.067) + '" y="' + (s * 0.227) + '" width="' + (s * 0.867) + '" height="' + (s * 0.547) + '" rx="1.6" ' + common + '/>';
    else if (kind === "capability") body = '<circle cx="' + c + '" cy="' + c + '" r="' + (c - 1.6) + '" ' + common + '/>';
    else body = '<rect x="' + (s * 0.16) + '" y="' + (s * 0.16) + '" width="' + (s * 0.68) + '" height="' + (s * 0.68) + '" rx="1.4" ' + common + '/><circle cx="' + c + '" cy="' + c + '" r="' + (s * 0.1) + '" fill="#0c0c10"/>';
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 ' + s + " " + s + '" aria-hidden="true" style="flex:none">' + body + "</svg>";
  }
  document.querySelectorAll("[data-glyph]").forEach(function (el) {
    el.innerHTML = glyphSVG(el.getAttribute("data-glyph"), parseInt(el.getAttribute("data-size") || "15", 10));
  });

  // ---- tree (left instrument) ------------------------------------------
  var TREE = {
    kind: "project", title: "ontology-atlas", n: 296, open: true,
    kids: [
      { kind: "domain", title: "AI Agent Partner", n: 39, dimmed: true },
      { kind: "domain", title: "Views", n: 85, dimmed: true },
      { kind: "domain", title: "Vault — Local-First", n: 35, dimmed: true },
      {
        kind: "domain", title: "Onboarding & UX", n: 101, open: true, fresh: true,
        kids: [
          { kind: "capability", title: "Agent Config Onboarding", n: 4, fresh: true },
          { kind: "capability", title: "CLI Developer Entry", n: 6 },
          { kind: "capability", title: "Product Owner Operating System", n: 1, sel: true, fresh: true },
          { kind: "element", title: "Landing First Impression" },
          { kind: "element", title: "Locale Switch" },
          { kind: "element", title: "Operations Nav" },
          { kind: "element", title: "Mobile Bottom Tab Bar" },
          { kind: "element", title: "Theme Toggle" },
          { kind: "element", title: "Toast" },
          { kind: "element", title: "Gesture Hint" }
        ]
      },
      { kind: "domain", title: "Ontology Core", n: 29, dimmed: true },
      { kind: "domain", title: "Mode-Aware Adapters", n: 11, stale: true, dimmed: true }
    ]
  };
  var treeEl = document.getElementById("tree");
  function rowHTML(node, depth) {
    var hasKids = !!(node.kids && node.kids.length) || node.kind === "domain";
    var cls = "trow depth-" + depth +
      (node.open ? " open" : "") +
      (node.sel ? " sel" : "") +
      (node.dimmed ? " dimmed" : "");
    var html = '<div class="' + cls + '" data-title="' + node.title.toLowerCase() + '">' +
      '<span class="caret' + (hasKids ? "" : " leaf") + '">▶</span>' +
      glyphSVG(node.kind, 13) +
      '<span class="t">' + node.title + "</span>" +
      (node.fresh ? '<span class="fresh-dot" title="최근 갱신"></span>' : "") +
      (node.stale ? '<span class="stale-mark">정체</span>' : "") +
      (node.n != null ? '<span class="num">' + node.n + "</span>" : "") +
      "</div>";
    if (node.kids && node.kids.length) {
      html += '<div class="group-kids' + (node.open ? "" : " closed") + '">' +
        node.kids.map(function (k) { return rowHTML(k, depth + 1); }).join("") +
        "</div>";
    }
    return html;
  }
  treeEl.innerHTML = rowHTML(TREE, 0);
  treeEl.addEventListener("click", function (e) {
    var row = e.target.closest(".trow");
    if (!row) return;
    var kids = row.nextElementSibling;
    if (kids && kids.classList.contains("group-kids")) {
      kids.classList.toggle("closed");
      row.classList.toggle("open");
    }
    treeEl.querySelectorAll(".trow.sel").forEach(function (r) { r.classList.remove("sel"); });
    row.classList.add("sel");
  });
  document.getElementById("q").addEventListener("input", function (e) {
    var v = e.target.value.trim().toLowerCase();
    treeEl.querySelectorAll(".trow").forEach(function (r) {
      r.style.display = !v || r.getAttribute("data-title").indexOf(v) !== -1 ? "" : "none";
    });
    if (v) treeEl.querySelectorAll(".group-kids").forEach(function (g) { g.classList.remove("closed"); });
  });

  // datasheet rows
  function sheetRow(item) {
    return '<div class="row">' + glyphSVG(item.k, 12) + '<span class="t">' + item.t + "</span></div>";
  }
  document.getElementById("sheet-contains").innerHTML = [
    { k: "element", t: "Product Owner Operating System Doc" }
  ].map(sheetRow).join("");
  document.getElementById("sheet-relates").innerHTML = [
    { k: "capability", t: "Agent Onboarding Brief" },
    { k: "capability", t: "Topology Ontology Inspection" }
  ].map(sheetRow).join("");

  // ---------------------------------------------------------------------
  // full-bleed map — the v2 topology aesthetic as the page itself.
  // blueprint grid + static vignette + machined shapes + ego focus on the
  // Onboarding & UX domain (selection: PO Operating System capability).
  // Dim uses OPAQUE tokens. No glow, no animation.
  // ---------------------------------------------------------------------
  var domains = [
    { id: "ai-agent-partner", title: "AI Agent Partner", count: 39 },
    { id: "views", title: "Views", count: 85 },
    { id: "vault-local-first", title: "Vault — Local-First", count: 35 },
    { id: "ontology-core", title: "Ontology Core", count: 29 },
    { id: "onboarding-ux", title: "Onboarding & UX", count: 101, focus: true },
    { id: "mode-aware-adapters", title: "Mode-Aware", count: 11, stale: true }
  ];
  var FOCUS_DOMAIN = "onboarding-ux";
  var SELECTED = "po-operating-system";
  var capabilities = [
    { id: "mcp-server", title: "MCP Server", domain: "ai-agent-partner" },
    { id: "agent-brief", title: "Agent Brief", domain: "ai-agent-partner" },
    { id: "topology-map-canvas", title: "Topology Map", domain: "views" },
    { id: "ontology-insights", title: "Insights", domain: "views" },
    { id: "local-vault-adapter", title: "Vault Adapter", domain: "vault-local-first" },
    { id: "frontmatter-schema", title: "Frontmatter Schema", domain: "ontology-core" },
    { id: "relation-graph", title: "Relation Graph", domain: "ontology-core" },
    { id: "agent-config-onboarding", title: "Agent Config Onboarding", domain: "onboarding-ux" },
    { id: "cli-developer-entry", title: "CLI Developer Entry", domain: "onboarding-ux" },
    { id: "po-operating-system", title: "PO Operating System", domain: "onboarding-ux" },
    { id: "mode-detection", title: "Mode Detection", domain: "mode-aware-adapters" }
  ];
  var elements = [
    { id: "e1", capability: "mcp-server" },
    { id: "e2", capability: "mcp-server" },
    { id: "e3", capability: "topology-map-canvas" },
    { id: "e4", capability: "topology-map-canvas" },
    { id: "e5", capability: "local-vault-adapter" },
    { id: "e6", capability: "relation-graph" },
    { id: "e7", capability: "agent-config-onboarding" },
    { id: "e8", capability: "agent-config-onboarding" },
    { id: "e9", capability: "cli-developer-entry" },
    { id: "e10", capability: "po-operating-system" },
    { id: "e11", capability: "mode-detection" }
  ];
  var DEPENDS = [
    ["agent-brief", "mcp-server"],
    ["topology-map-canvas", "mcp-server"],
    ["agent-config-onboarding", "mcp-server"],
    ["cli-developer-entry", "frontmatter-schema"],
    ["po-operating-system", "agent-brief"],
    ["ontology-insights", "relation-graph"],
    ["mode-detection", "local-vault-adapter"]
  ];

  var nodes = {}, all = [];
  function addNode(id, kind, extra) {
    var n = { id: id, kind: kind, x: 0, y: 0 };
    for (var k in extra) n[k] = extra[k];
    nodes[id] = n; all.push(n);
    return n;
  }
  addNode("root", "project", { title: "ontology-atlas", r: 26 });
  domains.forEach(function (d) { addNode(d.id, "domain", { title: d.title, count: d.count, focus: d.focus, stale: d.stale, r: 17 }); });
  capabilities.forEach(function (c) { addNode(c.id, "capability", { title: c.title, domain: c.domain, r: 9.5 }); });
  elements.forEach(function (e) { addNode(e.id, "element", { capability: e.capability, r: 5.5 }); });

  (function layout() {
    var TAU = Math.PI * 2;
    var dNodes = domains.map(function (d) { return nodes[d.id]; });
    dNodes.forEach(function (d, i) {
      var a = (i / dNodes.length) * TAU - Math.PI / 2;
      d.angle = a;
      d.x = Math.cos(a) * 215; d.y = Math.sin(a) * 215;
    });
    dNodes.forEach(function (d) {
      var caps = capabilities.filter(function (c) { return c.domain === d.id; }).map(function (c) { return nodes[c.id]; });
      var spread = Math.min(1.0, 0.34 + caps.length * 0.26);
      caps.forEach(function (c, i) {
        var t = caps.length === 1 ? 0 : (i / (caps.length - 1) - 0.5);
        var a = d.angle + t * spread;
        c.angle = a;
        c.x = d.x + Math.cos(a) * 118; c.y = d.y + Math.sin(a) * 118;
      });
    });
    capabilities.forEach(function (cSrc) {
      var c = nodes[cSrc.id];
      var els = elements.filter(function (e) { return e.capability === c.id; }).map(function (e) { return nodes[e.id]; });
      var spread = Math.min(1.05, 0.32 + els.length * 0.32);
      els.forEach(function (e, i) {
        var t = els.length === 1 ? 0 : (i / (els.length - 1) - 0.5);
        var a = c.angle + t * spread;
        e.x = c.x + Math.cos(a) * 66; e.y = c.y + Math.sin(a) * 66;
      });
    });
  })();

  var FOCUS = { "root": 1 };
  FOCUS[FOCUS_DOMAIN] = 1;
  capabilities.forEach(function (c) {
    if (c.domain === FOCUS_DOMAIN) {
      FOCUS[c.id] = 1;
      elements.forEach(function (e) { if (e.capability === c.id) FOCUS[e.id] = 1; });
    }
  });

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }
  function mix(hexA, hexB, t) {
    var a = hexToRgb(hexA), b = hexToRgb(hexB);
    return "rgb(" +
      Math.round(a[0] + (b[0] - a[0]) * t) + "," +
      Math.round(a[1] + (b[1] - a[1]) * t) + "," +
      Math.round(a[2] + (b[2] - a[2]) * t) + ")";
  }
  function roundedPolygon(pts, rad) {
    var n = pts.length;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n];
      var v1x = p1.x - p0.x, v1y = p1.y - p0.y, l1 = Math.hypot(v1x, v1y) || 1;
      var v2x = p2.x - p1.x, v2y = p2.y - p1.y, l2 = Math.hypot(v2x, v2y) || 1;
      var r = Math.min(rad, l1 * 0.45, l2 * 0.45);
      var sx = p1.x - (v1x / l1) * r, sy = p1.y - (v1y / l1) * r;
      var ex = p1.x + (v2x / l2) * r, ey = p1.y + (v2y / l2) * r;
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
      ctx.quadraticCurveTo(p1.x, p1.y, ex, ey);
    }
    ctx.closePath();
  }
  function hexShape(cx, cy, r) {
    var pts = [];
    for (var i = 0; i < 6; i++) {
      var a = (i * 60 - 90) * Math.PI / 180;
      pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
    }
    return pts;
  }

  // fine blueprint grid, tiled once — same recipe as the approved b2plus canvas
  var gridPattern = null;
  function buildGrid() {
    var minor = 24, size = minor * 5;
    var tile = document.createElement("canvas");
    tile.width = size; tile.height = size;
    var g = tile.getContext("2d");
    g.fillStyle = "#0a0a0d";
    g.fillRect(0, 0, size, size);
    g.strokeStyle = "#0e0e13";
    g.lineWidth = 1;
    for (var x = minor; x < size; x += minor) { g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, size); g.stroke(); }
    for (var y = minor; y < size; y += minor) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(size, y + 0.5); g.stroke(); }
    g.strokeStyle = "#121218";
    g.beginPath(); g.moveTo(0.5, 0); g.lineTo(0.5, size); g.stroke();
    g.beginPath(); g.moveTo(0, 0.5); g.lineTo(size, 0.5); g.stroke();
    gridPattern = ctx.createPattern(tile, "repeat");
  }

  function render() {
    var W = window.innerWidth, H = window.innerHeight;
    var DPR = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (!gridPattern) buildGrid();
    ctx.fillStyle = gridPattern || "#0a0a0d";
    ctx.fillRect(0, 0, W, H);

    // static corner vignette — darkens edges, never animated (b2plus recipe)
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.34, W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, "rgba(10, 10, 13, 0)");
    vg.addColorStop(1, "rgba(6, 6, 9, 0.5)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // world→screen: keep clear of the left instrument (334px) + right sheet (314px)
    var leftPad = 334 + 30, rightPad = 314 + 30;
    var availW = W - leftPad - rightPad;
    var scale = Math.min(availW / 760, (H - 110) / 760);
    var cx = leftPad + availW / 2, cy = H / 2 + 8;
    function S(n) { return { x: cx + n.x * scale, y: cy + n.y * scale }; }

    // contains edges — solid, opaque dim outside the ego
    function containsEdge(aId, bId) {
      var a = S(nodes[aId]), b = S(nodes[bId]);
      var lit = FOCUS[aId] && FOCUS[bId];
      ctx.strokeStyle = lit ? "#43434e" : DIM.edge;
      ctx.lineWidth = lit ? 1.2 : 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.setLineDash([]);
    domains.forEach(function (d) { containsEdge("root", d.id); });
    capabilities.forEach(function (c) { containsEdge(c.domain, c.id); });
    elements.forEach(function (e) { containsEdge(e.capability, e.id); });

    // depends — dashed bow, indigo-bright when touching the ego
    ctx.setLineDash([4, 5]);
    DEPENDS.forEach(function (p) {
      var a = S(nodes[p[0]]), b = S(nodes[p[1]]);
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var qx = mx + (cx - mx) * 0.33, qy = my + (cy - my) * 0.33;
      var touches = FOCUS[p[0]] || FOCUS[p[1]];
      ctx.strokeStyle = touches ? INDIGO_BRIGHT : DIM.edge;
      ctx.lineWidth = touches ? 1.6 : 1;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.quadraticCurveTo(qx, qy, b.x, b.y); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.lineWidth = 1;

    // nodes — machined shapes; dim uses opaque tokens
    all.forEach(function (n) {
      var p = S(n);
      var r = n.r * scale * 1.55;
      var focused = !!FOCUS[n.id];
      var col = GLYPH_COLORS[n.kind];
      var fill = focused ? col.fill : DIM.fill;
      var stroke = focused ? mix(col.stroke, INDIGO, 0.45) : DIM.stroke;
      if (n.stale && !focused) stroke = "#33333a";
      if (n.id === FOCUS_DOMAIN) stroke = INDIGO_BRIGHT;
      if (n.id === SELECTED) stroke = INDIGO_BRIGHT;
      ctx.fillStyle = fill;
      ctx.strokeStyle = stroke;
      ctx.lineWidth = n.kind === "project" ? 1.9 : n.kind === "domain" ? 1.5 : n.id === SELECTED ? 1.7 : 1.1;
      if (n.stale) ctx.setLineDash([3, 3]);

      if (n.kind === "project") {
        roundedPolygon(hexShape(p.x, p.y, r), Math.min(4, r * 0.14));
        ctx.fill(); ctx.stroke();
      } else if (n.kind === "domain") {
        var w = r * 1.5, h = r * 0.95;
        ctx.beginPath();
        ctx.roundRect(p.x - w, p.y - h, w * 2, h * 2, 4);
        ctx.fill(); ctx.stroke();
      } else if (n.kind === "capability") {
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.roundRect(p.x - r, p.y - r, r * 2, r * 2, 2);
        ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.fillStyle = "#0c0c10";
        ctx.arc(p.x, p.y, Math.max(1.3, r * 0.3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.setLineDash([]);

      // engraved count numerals on domains — data marks, dim face outside ego
      if (n.kind === "domain" && n.count != null) {
        var size = Math.max(9, 11 * scale * 1.3);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.font = "600 " + size + "px ui-monospace, SFMono-Regular, Menlo, monospace";
        ctx.fillStyle = "#08080a";
        ctx.fillText(String(n.count), p.x, p.y + 1);
        ctx.fillStyle = focused ? "#8c8c94" : "#42424a";
        ctx.fillText(String(n.count), p.x, p.y);
      }
    });

    // labels — all domains + root + focused-domain capabilities
    function label(n, text, colr, size, dy, weight) {
      var p = S(n);
      ctx.textAlign = "center"; ctx.textBaseline = "top";
      ctx.font = (weight || 600) + " " + size + "px -apple-system, 'SF Pro Text', sans-serif";
      ctx.fillStyle = colr;
      ctx.fillText(text, p.x, p.y + dy);
    }
    domains.forEach(function (dSrc) {
      var n = nodes[dSrc.id];
      var focused = dSrc.id === FOCUS_DOMAIN;
      label(n, dSrc.title,
        focused ? "#c6c6cf" : (dSrc.stale ? "#42424a" : "#65656f"),
        focused ? 13 : 11,
        n.r * scale * 1.55 + 8);
    });
    capabilities.forEach(function (cSrc) {
      if (cSrc.domain !== FOCUS_DOMAIN) return;
      var n = nodes[cSrc.id];
      label(n, cSrc.title,
        cSrc.id === SELECTED ? "#b8b8c1" : "#84848e",
        10.5, n.r * scale * 1.55 + 6, 500);
    });
    label(nodes.root, "ontology-atlas", "#77777f", 11.5, nodes.root.r * scale * 1.55 + 7);
  }

  render();
  window.addEventListener("resize", render);
})();
</script>
</body>
</html>
