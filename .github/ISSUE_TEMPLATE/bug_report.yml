name: 🐞 Bug report
description: Something doesn't work as expected. Crashes, regressions, broken UI.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report. Please fill out the sections that apply.
        한국어로 작성하셔도 OK 입니다.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
      placeholder: e.g. filling a relation socket on /ontology/studio throws a console error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: e.g. the socket should write the relation into the node's frontmatter
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Numbered list. Include vault state if relevant.
      placeholder: |
        1. Run `pnpm dev`
        2. Visit /ontology/studio
        3. Click an empty relation socket
        4. Open DevTools console
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which area is affected?
      options:
        - "/ — topology hub (map + INDEX + datasheet)"
        - "/topology"
        - "/ontology/studio (workshop)"
        - "/ontology/insights"
        - "/projects, /project/*"
        - "/docs (vault picker)"
        - "/download"
        - Installed macOS app (window, updater, Connect agent)
        - MCP server (ontology-atlas-mcp)
        - CLI (ontology-atlas)
        - Hosted demo (GitHub Pages)
        - Other
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS / browser / Node / pnpm versions if relevant
      placeholder: macOS 15.4 · Chrome 130 · Node 24.16 · pnpm 10
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console / network output
      description: Paste relevant DevTools console errors or terminal output. Hide secrets.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag-drop images. The app is dark-only, so one theme is enough.
