name: Windows x64 Beta Check

# Narrow the trigger condition to **things only known on Windows** (2026-08-02).
#
# Measurement: #834 (pre-commit hook) triggered this 12-minute job **5 times** — totaling 60 minutes. That PR
# did nothing more than add one line to the `prepare` script in `package.json`, having no relation to Windows
# installers. Nearly half of the recent 40 runs were of this type.
#
# Exclude `package.json` and `pnpm-lock.yaml`. **Nothing is lost by excluding them** — both are
# included in the RUNTIME list of `scripts/classify-change.mjs`, so if they change, the full unit suite and static export build (`pnpm build`) already run on Linux. The three Windows release contract tests are also within `pnpm test:desktop:check` and run on every PR on Linux.
# Thus, what those two files triggered was not "something only known on Windows."
#
# The remaining list consists entirely of **items that go directly into native outputs**: Rust source,
# bundled MCP servers, scripts that bake and verify the binaries and staging, and
# this workflow itself.
#
# ⚠️ This job does not build the `.exe` users receive. That is built by the `build-windows` job in `release-macos.yml` from tags. The artifacts uploaded here are early-warning copies — so narrowing the trigger does not weaken release verification.
on:
  pull_request:
    paths:
      - ".github/workflows/release-macos.yml"
      - ".github/workflows/windows-beta-check.yml"
      - "mcp/**"
      - "scripts/build-mcp-binary.mjs"
      - "scripts/verify-mcp-binary.mjs"
      - "scripts/stage-windows-release-assets.mjs"
      - "scripts/lib/mcp-binary.mjs"
      - "src-tauri/**"
      - "tests/contract/windows-desktop-release.contract.test.ts"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # `cargo test`'s debug compilation **does not generate full debug information**.
  # On MSVC, baking and linking PDBs for 556 crates accounts for a large
  # portion of the cost in this profile, but CI does not attach a debugger to this job.
  #
  # However, we do not turn it off completely (`0`) — that would remove file and line information from backtraces when tests fail, making remote diagnosis difficult. `line-tables-only` is a middle ground that keeps file and line info while discarding type information, so this job keeps what it actually uses and avoids creating what it doesn't.
  #
  # **The release profile is untouched** — the installer files users receive must be baked in the same way as the release workflow to make this job's proof valid.
  #
  # `CARGO_INCREMENTAL` is absent here. `Swatinem/rust-cache` sets it to 0 itself (as documented) — writing the same value in two places starts drift from that moment.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  verify-windows:
    name: Verify unsigned Windows x64 beta
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Almost all of this job's time is Rust compilation (measurement on 2026-08-02, step durations from the last successful run): of 720 seconds, **637 seconds (88%)** — 437 seconds for the release bundle +
      # 200 seconds for `cargo test`'s debug compilation. Even if we set all other steps to 0,
      # we can only save 83 seconds.
      #
      # However, those 637 seconds are time spent rebuilding **dependencies from scratch** every time. Tauri's
      # dependency graph is overwhelmingly larger than our crates, and that part has identical bytes if `Cargo.lock`
      # remains unchanged. Caching `target/` and `~/.cargo` means we only rebuild our own crates.
      #
      # The cache key is generated by this action using `Cargo.lock` + runner + toolchain — if the lock changes, a miss occurs automatically, so stale dependencies do not persist.
      # As a third-party action, we pin it by SHA in accordance with this repository's conventions.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

      # audit-check reports informational advisories but does not fail on them.
      # GTK3's glib advisory is Linux-only in Tauri's dependency tree; this
      # native Windows lane still fails on every other Rust unsoundness warning.
      - name: Deny unsound Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --ignore RUSTSEC-2024-0429

      - name: Windows release contract tests
        run: node --test scripts/lib/mcp-binary.test.mjs scripts/stage-windows-release-assets.test.mjs scripts/verify-mcp-binary.test.mjs

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Build and verify Windows MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native bridge tests on Windows
        run: pnpm test:desktop:bridge

      - name: Build Windows NSIS installer without updater signing
        shell: pwsh
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Require the beta installer to be unsigned
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installer.Count)." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The public copy says unsigned, but Authenticode status is $($signature.Status)."
          }

      - name: Scan installer with Microsoft Defender
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
          $scanner = $null
          if (Test-Path $platformRoot) {
            $scanner = Get-ChildItem $platformRoot -Filter MpCmdRun.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $scanner) {
            $fallback = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
            if (Test-Path $fallback) { $scanner = Get-Item $fallback }
          }
          if (-not $scanner) { throw "Microsoft Defender scanner is unavailable on the Windows runner." }
          & $scanner.FullName -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or found a threat (exit $LASTEXITCODE)." }

      - name: Silent install and installed-app smoke
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit $($install.ExitCode)." }

          $app = Get-ChildItem $env:LOCALAPPDATA -Filter 'ontology-atlas.exe' -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $app) { throw "The installer completed but ontology-atlas.exe was not found." }

          $sidecar = Join-Path (Split-Path $app) 'ontology-atlas-mcp.exe'
          if (-not (Test-Path $sidecar)) { throw "The installed app is missing ontology-atlas-mcp.exe." }
          $vault = (Resolve-Path 'docs/ontology').Path
          node scripts/verify-mcp-binary.mjs "--binary=$sidecar" "--vault=$vault"

          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "The installed app exited during the 10-second launch smoke." }
          Stop-Process -Id $process.Id -Force

      - name: Stage Windows beta artifact
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/stage-windows-release-assets.mjs "--version=$packageVersion"

      - name: Upload verified Windows beta artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-windows-x64-pr-${{ github.event.pull_request.number || github.run_number }}
          path: release-upload
          if-no-files-found: error
          retention-days: 1
