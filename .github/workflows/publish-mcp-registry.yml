name: Publish to MCP Registry
run-name: Publish ${{ inputs.tag }} to the MCP Registry

# Listing Atlas in the official MCP Registry needs no package registry: the entry
# points at the `.mcpb` asset on a GitHub Release, and the registry fetches that
# asset itself to verify the URL and SHA-256. Two consequences shape this workflow:
#
#   1. It must run **after** the release leaves draft. A draft asset 404s to the
#      anonymous fetch the registry makes, so the release workflow calls this one
#      as its last step rather than a tag push starting it.
#   2. It publishes **metadata we derive**, never a digest anyone typed:
#      `pnpm mcp:registry` hashes the asset downloaded from the release itself.
#
# **Why `workflow_call` and not `release: [published]`** (measured 2026-09-11): the
# release is published by `gh release edit` with `GITHUB_TOKEN`, and GitHub does not
# start a workflow from an event that token raised — the recursion guard. v1.2.0 went
# out and this workflow had zero runs; the entry had to be dispatched by hand. Being
# a job of the release run instead makes the listing follow publication for the same
# reason the publication itself is trusted, rather than depending on who pressed it.
#
# Authentication is OIDC — `mcp-publisher login github-oidc` proves this repository
# owns the `io.github.wlsdks/*` namespace with the workflow's own identity, so no
# token is stored and no person has to complete a device flow.
#
# The registry treats a version as immutable, and our server version
# (`mcp/package.json`) moves independently of the app tag. A release that carries an
# unchanged server version therefore has nothing new to publish, and this workflow
# says so and stops instead of failing.

on:
  workflow_call:
    inputs:
      tag:
        description: The published release tag whose .mcpb asset should be listed
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The published release tag whose .mcpb asset should be listed
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # budget: 60s
    timeout-minutes: 2
    name: Publish the MCP server entry
    runs-on: ubuntu-latest
    env:
      # A dispatch input is caller-chosen text: it reaches a shell only as "$TAG".
      TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve the release tag
        id: release
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::not a release tag: ${TAG}"
            exit 1
          fi
          # A release candidate must not burn the server version: the registry
          # cannot take that version again once published.
          if [[ "${TAG}" == *-* ]]; then
            echo "::notice::${TAG} is a pre-release; the registry entry is published from final releases only"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the released source
        if: steps.release.outputs.skip != 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Setup Node.js
        if: steps.release.outputs.skip != 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: steps.release.outputs.skip != 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate

      - name: Install dependencies
        if: steps.release.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Read the server version this release carries
        if: steps.release.outputs.skip != 'true'
        id: server
        run: |
          version="$(node -p "require('./mcp/package.json').version")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "artifact=ontology-atlas-mcp-${version}.mcpb" >> "$GITHUB_OUTPUT"

      - name: Stop if the registry already lists this server version
        if: steps.release.outputs.skip != 'true'
        id: listed
        env:
          SERVER_VERSION: ${{ steps.server.outputs.version }}
        run: |
          # The registry rejects a repeat publication of one version, so an app
          # release that changed no server code has nothing to add here.
          listed="$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.wlsdks/ontology-atlas" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
                let versions=[];
                try { const j=JSON.parse(s); for (const row of j.servers ?? []) { const v=row.server?.version ?? row.version; if (v) versions.push(v); } } catch {}
                console.log(versions.join(" "));
              })' || echo "")"
          echo "registry lists: ${listed:-(nothing)}"
          if grep -qw -- "${SERVER_VERSION}" <<< "${listed}"; then
            echo "::notice::server version ${SERVER_VERSION} is already listed; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the published .mcpb asset
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        run: |
          # Hash what the registry will fetch, not a fresh local build: the entry's
          # digest has to match the bytes a stranger downloads.
          gh release download "${TAG}" \
            --pattern '*.mcpb' --dir .tmp/mcp-bundle --clobber
          ls -l .tmp/mcp-bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Derive server.json from that asset
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        env:
          SERVER_ARTIFACT: ${{ steps.server.outputs.artifact }}
        run: |
          pnpm mcp:registry -- --tag="${TAG}" \
            --artifact=".tmp/mcp-bundle/${SERVER_ARTIFACT}"
          cp .tmp/mcp-registry/server.json server.json
          cat server.json

      - name: Confirm the asset is reachable anonymously
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        run: |
          # The registry fetches the artifact with no credentials. A draft release,
          # a renamed asset, or a private repository all fail here rather than
          # leaving a listing that points at nothing.
          url="$(node -p "require('./server.json').packages[0].identifier")"
          code="$(curl -sIL -o /dev/null -w '%{http_code}' "${url}")"
          echo "${url} → HTTP ${code}"
          test "${code}" = "200"

      # This binary receives the job's OIDC assertion, so it is one reviewed release, byte for byte.
      - name: Install mcp-publisher
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help | head -5

      - name: Authenticate with this repository's own identity
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish the entry
        if: steps.release.outputs.skip != 'true' && steps.listed.outputs.skip != 'true'
        run: ./mcp-publisher publish

      - name: Summarize
        if: always()
        env:
          RELEASE_SKIPPED: ${{ steps.release.outputs.skip }}
          ALREADY_LISTED: ${{ steps.listed.outputs.skip }}
          SERVER_VERSION: ${{ steps.server.outputs.version }}
          SERVER_ARTIFACT: ${{ steps.server.outputs.artifact }}
        run: |
          {
            echo "## MCP Registry"
            echo ""
            if [[ "${RELEASE_SKIPPED}" == "true" ]]; then
              echo "Skipped: ${TAG} is a pre-release."
            elif [[ "${ALREADY_LISTED}" == "true" ]]; then
              echo "Skipped: server version ${SERVER_VERSION} is already listed."
            else
              echo "Published \`io.github.wlsdks/ontology-atlas\` version ${SERVER_VERSION}"
              echo "from the \`${SERVER_ARTIFACT}\` asset on ${TAG}."
              echo ""
              echo "The OCI entry is deliberately absent: nothing here pushes that image, and"
              echo "a listing naming an unpushed image is what the ownership check refuses."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
