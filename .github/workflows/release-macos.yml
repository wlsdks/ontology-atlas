name: Release Desktop
run-name: Release Desktop ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag whose commit must equal the current default-branch head"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # `workflow_dispatch` can target another ref even though the workflow must
  # exist on the default branch. This unprivileged job proves that the selected
  # workflow source, event SHA, default-branch head, and requested tag are the
  # same commit before a signing environment can be reached.
  admit-release:
    name: Admit protected release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.admit.outputs.release_sha }}
      release_tag: ${{ steps.admit.outputs.release_tag }}
    steps:
      - name: Require protected main dispatch context
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$DISPATCH_EVENT" == "workflow_dispatch" ]] || { echo "Unexpected release event: $DISPATCH_EVENT" >&2; exit 1; }
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || { echo "Release must be dispatched from refs/heads/main, got $DISPATCH_REF" >&2; exit 1; }
          [[ "$DISPATCH_REF_TYPE" == "branch" ]] || { echo "Release ref must be a branch, got $DISPATCH_REF_TYPE" >&2; exit 1; }
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" ]] || { echo "Workflow source $WORKFLOW_SHA differs from event source $DISPATCH_SHA" >&2; exit 1; }

      - name: Checkout admitted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Verify requested release version
        run: pnpm desktop:release-tag -- --tag="$RELEASE_TAG"

      - name: Admit tag at current main SHA
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          pnpm desktop:release-source -- \
            --mode=admit \
            --repo="$GITHUB_REPOSITORY" \
            --tag="$RELEASE_TAG" \
            --sha="$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: admit-release
    environment: release-signing
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    env:
      TAURI_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}

    steps:
      # fetch-depth: 0 필수 — 아래 `docs-vault:check` 와 `pnpm build` 가 문서별
      # "마지막으로 바뀐 날" 을 git 히스토리에서 읽는다 (얕은 클론은 전 문서를
      # 같은 날짜로 뭉갠다).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # MCP 사이드카를 단일 바이너리로 굽는 컴파일러다(`bun build --compile`).
      # 러너에 기본 설치돼 있지 않아 `v1.0.0-rc.2` 가 여기서 멈췄다 — 번들링을
      # 들여올 때(#732) 이 설치 단계가 같이 안 들어왔다. 툴체인 설치는 위쪽에
      # 모아 둔다.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `mcp/` 는 pnpm 워크스페이스 멤버가 아니라 자체 `node_modules` 를 쓴다
      # (npm 에 따로 내보내던 패키지의 잔재). 루트 install 이 그걸 안 깔아서
      # 사람 머신에서만 있고 러너에는 없다 — `v1.0.0-rc.2` 가 사이드카를 굽다가
      # `@modelcontextprotocol/sdk` 를 못 찾고 멈췄다. 의존은 정확 핀 하나뿐이다.
      #
      # `--frozen-lockfile` 인 이유: 이 폴더의 `package-lock.json` 은 **npm 것**
      # 이고 pnpm 은 읽지 않는다. 락파일 없이 돌리면 러너가 매 릴리스마다 레지
      # 스트리에서 새로 푼다 — 즉 커밋 하나 없이 사이드카의 의존 트리가 바뀔 수
      # 있고, 그 바이너리가 그대로 앱에 실린다. `mcp/pnpm-lock.yaml` 을 커밋해
      # 두고 얼려서, 무엇이 실렸는지 diff 로 답할 수 있게 한다.
      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      - name: MCP release gate
        run: pnpm dogfood:release-gate

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Docs vault freshness
        run: pnpm docs-vault:check

      - name: Desktop checker tests
        run: pnpm test:desktop:check

      - name: Desktop runtime split tests
        run: pnpm test:desktop:runtime

      # `tauri.conf.json` 이 `externalBin` 으로 MCP 사이드카를 선언한 뒤로는
      # **모든 cargo 호출**이 그 파일을 요구한다 — 번들 단계뿐 아니라 아래
      # `cargo test` 도 빌드 스크립트에서 resource path 를 확인한다. 사이드카를
      # `desktop:build:app` 안에서만 만들던 순서로는 여기서 먼저 멈춘다
      # (2026-07-28 v1.0.0-rc.2 실패). 러너가 네이티브 아키텍처라 호스트 트리플
      # 기본값이 맞는다. 뒤의 번들 단계가 다시 부르지만 같은 산출물이다.
      - name: Build bundled MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native vault bridge tests
        run: pnpm test:desktop:bridge

      - name: Desktop runtime doctor
        run: pnpm desktop:doctor -- --require-runtime

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="${RELEASE_TAG}"

      # 미서명 공개 결정은 인증서 발급과 함께 같은 날 뒤집혔다
      # (`docs/DECISIONS.md`, 2026-07-27). 직접 다운로드 DMG 는 Developer ID
      # 서명과 공증이 모두 가능할 때만 만든다. 이 검사를 조건문으로 감싸면
      # 실패가 unsigned 폴백의 선택 신호가 되므로, 명령 자체를 게이트로 둔다.
      - name: Require signed release credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:release-secrets

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # 이 키체인은 이 잡 안에서 만들어졌다 이 잡 안에서 지워진다 — 비밀번호를
          # 사람이 등록할 이유가 없다. 등록할 secret 이 적을수록 실수도 적다.
          APPLE_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$APPLE_KEYCHAIN_PASSWORD"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build signed and notarized release artifact
        run: pnpm desktop:release-artifact
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # 업데이터 아티팩트(.app.tar.gz + .sig)는 이 키로 서명된다. Apple
          # 인증서와 별개다 — Apple 은 "누가 만들었나" 를, 이 키는 "이 갱신
          # 패키지가 우리 것인가" 를 보증한다. 설치된 앱은 공개키로 검증하므로,
          # 이 키가 없는 패키지는 어떤 경로로 와도 설치되지 않는다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Summarize macOS release assets
        run: |
          {
            echo "## macOS DMG (${TAURI_ARCH})"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # 올릴 것을 한 폴더에 모은다 — 아티팩트의 루트를 우리가 정하기 위해서다.
      # 경로를 여럿 주면 루트가 그들의 최소공통조상(`bundle/`)으로 정해져
      # `dmg/`·`macos/` 한 겹이 더 생기고, 내려받는 쪽은 그 깊이를 고른 적이
      # 없으므로 알 수도 없다. 여기서 업데이터 아카이브 이름도 DMG 와 같은
      # 규칙으로 다시 붙인다(Tauri 는 두 아치를 같은 이름 + 공백으로 낸다).
      - name: Stage release assets
        run: node scripts/stage-macos-release-assets.mjs --arch="${TAURI_ARCH}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-macos-${{ matrix.arch }}
          # 경로는 **하나**다. 여럿이면 루트가 최소공통조상으로 정해진다.
          path: release-upload
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Apple signing keychain
        if: ${{ always() }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH"

  build-windows:
    name: Build unsigned Windows x64 beta
    needs: admit-release
    environment: release-signing
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Audit JavaScript production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

      # audit-check reports informational advisories but does not fail on them.
      # GTK3's glib advisory is Linux-only in Tauri's dependency tree; this
      # native Windows lane still fails on every other Rust unsoundness warning.
      - name: Deny unsound Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --ignore RUSTSEC-2024-0429

      - name: Windows release contract tests
        run: node --test scripts/lib/mcp-binary.test.mjs scripts/stage-windows-release-assets.test.mjs scripts/verify-mcp-binary.test.mjs

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Build and verify Windows MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native bridge tests on Windows
        run: pnpm test:desktop:bridge

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="${RELEASE_TAG}"

      - name: Require updater signing credentials
        run: pnpm desktop:release-secrets -- --updater-only
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Windows NSIS installer
        run: pnpm desktop:build:windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Require the beta installer to be unsigned
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installer.Count)." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The public copy says unsigned, but Authenticode status is $($signature.Status)."
          }
          "Unsigned status verified: $($installer.Name)"

      - name: Scan installer with Microsoft Defender
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
          $scanner = $null
          if (Test-Path $platformRoot) {
            $scanner = Get-ChildItem $platformRoot -Filter MpCmdRun.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $scanner) {
            $fallback = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
            if (Test-Path $fallback) { $scanner = Get-Item $fallback }
          }
          if (-not $scanner) { throw "Microsoft Defender scanner is unavailable on the Windows runner." }
          & $scanner.FullName -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or found a threat (exit $LASTEXITCODE)." }

      - name: Silent install and installed-app smoke
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit $($install.ExitCode)." }

          $candidates = @(
            "$env:LOCALAPPDATA\Ontology Atlas\ontology-atlas.exe",
            "$env:LOCALAPPDATA\Programs\Ontology Atlas\ontology-atlas.exe"
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem $env:LOCALAPPDATA -Filter 'ontology-atlas.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $app) { throw "The installer completed but ontology-atlas.exe was not found." }

          $sidecar = Join-Path (Split-Path $app) 'ontology-atlas-mcp.exe'
          if (-not (Test-Path $sidecar)) { throw "The installed app is missing ontology-atlas-mcp.exe." }
          $vault = (Resolve-Path 'docs/ontology').Path
          node scripts/verify-mcp-binary.mjs "--binary=$sidecar" "--vault=$vault"

          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "The installed app exited during the 10-second launch smoke." }
          Stop-Process -Id $process.Id -Force

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/stage-windows-release-assets.mjs "--version=$packageVersion"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-upload
          if-no-files-found: error
          retention-days: 1

  # Staging and publishing are separate jobs so a human can install the exact
  # bytes that will go public before they do. The draft release is assembled
  # and verified here; nothing is visible to users yet.
  stage-macos:
    name: Stage Draft Desktop Release
    if: ${{ always() && needs.admit-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [admit-release, build-macos, build-windows]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-macos-*
          path: release-assets
          # 평평하게 합치지 않는다 — 매니페스트 빌더는 **폴더**로 아치를 가른다
          # (`release-assets/ontology-atlas-macos-<아치>/`). 합치면 두 아치가 한
          # 폴더에 섞여 어느 아카이브가 어느 아치의 것인지 알 수 없고, 잘못
          # 고르면 사용자가 다른 아키텍처의 앱을 받는다.
          merge-multiple: false

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source before draft creation
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require clean GitHub Release slot
        run: pnpm desktop:release-slot -- --tag="${RELEASE_TAG}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build updater manifest
        run: |
          node scripts/build-updater-manifest.mjs \
            --dir=release-assets --out=release-assets/latest.json \
            --tag="${RELEASE_TAG}" --repo="${GITHUB_REPOSITORY}"

      - name: Upload draft GitHub Release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.admit-release.outputs.release_tag }}
          target_commitish: ${{ needs.admit-release.outputs.release_sha }}
          draft: true
          # semver 의 프리릴리스는 하이픈 뒤에 온다 (v1.1.0-rc.1). 그 한 글자가
          # "먼저 써볼 사람만" 과 "모두에게" 를 가른다 — GitHub 은 이 플래그로
          # Pre-release 배지를 붙이고 `releases/latest` 에서 제외한다.
          prerelease: ${{ contains(needs.admit-release.outputs.release_tag, '-') }}
          generate_release_notes: true
          files: |
            release-assets/*/*.dmg
            release-assets/*/*.sha256
            release-assets/*/*.app.tar.gz
            release-assets/*/*.app.tar.gz.sig
            release-assets/windows/*.exe
            release-assets/windows/*.exe.sha256
            release-assets/latest.json

      - name: Verify draft release assets
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --allow-draft --require-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize the draft awaiting approval
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Draft desktop release — awaiting approval"
            echo ""
            echo "macOS DMGs and the unsigned Windows x64 beta are staged at ${release_url}."
            echo "The Windows artifact passed the native Windows Server 2022 build, Defender scan,"
            echo "silent install, app launch, and installed MCP sidecar smoke before this gate."
            echo "Windows 11 client SmartScreen UI remains explicitly unverified."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Gated on the `release` GitHub Environment. Configure it with required
  # reviewers (repo Settings → Environments → release) so a first public
  # release cannot happen without someone installing the draft build first —
  # the workflow alone cannot prove the app launches on a clean machine.
  publish-macos:
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    needs: [admit-release, stage-macos]
    timeout-minutes: 10
    environment: release
    permissions:
      # contents: 릴리스 게시 + 생성된 릴리스 사실 커밋
      # actions:  Pages 배포를 명시적으로 깨우기 (아래 마지막 스텝의 이유 참조)
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
    steps:
      # fetch-depth: 0 — 생성 매니페스트의 결정성 계약이 전체 히스토리를
      # 요구하고(`generated-vault-determinism.contract.test.ts`), 아래 main
      # 갱신도 얕은 클론에서는 안전하게 못 한다.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-macos-*
          path: release-assets
          # 여기서는 합쳐도 안전하다 — 스테이징이 파일 이름에 버전과 아치를
          # 넣으므로 여덟 자산의 이름이 전부 다르다. 이 잡은 요약 표를 만들 뿐,
          # 아치를 다시 갈라야 하는 일이 없다.
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source after publication approval
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish verified stable release
        run: |
          # 발행 시점에도 태그가 진실원이다. 여기서 --prerelease=false 를 못박으면
          # RC 태그가 draft 를 벗는 순간 정식 릴리스로 승격돼, 프리릴리스라는
          # 표시가 통째로 사라진다.
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease=true
          else
            gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify public download assets
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --require-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate verified release facts from admitted source
        run: |
          pnpm download:release-facts -- --tag="${RELEASE_TAG}" --allow-prerelease
          cp src/views/download/model/macos-release.generated.ts "$RUNNER_TEMP/macos-release.generated.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 2026-07-29 — rc.3 를 내고 나서야 드러난 구멍. `/download` 의 크기·SHA-256·
      # 링크는 **커밋된 생성 파일**(`macos-release.generated.ts`)에서 오고, 그
      # 파일을 만드는 `download:release-facts` 를 **어떤 워크플로도 부르지
      # 않았다.** 그래서 릴리스가 나가도 다운로드 페이지는 이전 판을 계속
      # 광고했다 — rc.3 게시 직후 실측으로 rc.2 가 그대로 떠 있었다.
      #
      # `deploy-pages` 의 `release: published` 트리거로는 못 고친다. 두 겹으로
      # 안 된다: ① 그 워크플로는 `pnpm build` 만 하고 사실 파일을 다시 만들지
      # 않는다 ② 기본 `GITHUB_TOKEN` 이 일으킨 이벤트는 새 실행을 만들지
      # 않는다(재귀 방지).
      - name: Refresh /download release facts on main
        run: |
          # 생성 코드는 승인된 SHA에서 이미 실행했다. 여기서는 움직일 수 있는
          # main에 결과 파일만 복사하며, 저장소가 제공하는 pnpm/node 코드는 더
          # 실행하지 않는다.
          git fetch --no-tags origin main
          git switch -C release-facts-update origin/main
          cp "$RUNNER_TEMP/macos-release.generated.ts" src/views/download/model/macos-release.generated.ts
          if git diff --quiet -- src/views/download/model/macos-release.generated.ts; then
            echo "release facts already current — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/download/model/macos-release.generated.ts
          git commit -m "chore: /download 릴리스 사실을 ${RELEASE_TAG} 로 갱신 [skip ci]"
          # fast-forward 만 허용한다 — 그 사이 main 이 또 움직였으면 조용히
          # 덮지 않고 여기서 실패한다.
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # 위 push 는 **워크플로를 깨우지 않는다** — 기본 토큰이 일으킨 push 는
      # 재귀 방지에 걸린다. `workflow_dispatch` 는 그 규칙의 명시적 예외라
      # 시크릿을 하나도 늘리지 않고 배포를 깨울 수 있다. 인과가 이 파일 안에
      # 보이는 것도 이 방식의 값이다 — "릴리스가 나가면 페이지가 따라온다" 를
      # 다른 파일의 트리거에 맡기지 않는다.
      - name: Deploy the refreshed download page
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize published desktop release
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Published desktop release"
            echo ""
            echo "Release: ${release_url}"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in release-assets/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
            for installer in release-assets/windows/*.exe; do
              checksum="${installer}.sha256"
              size="$(wc -c < "$installer" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$installer")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
