name: Release Desktop
run-name: Release Desktop ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v-prefixed tag whose commit must equal the current default-branch head"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # `workflow_dispatch` can target another ref even though the workflow must
  # exist on the default branch. This unprivileged job proves that the selected
  # workflow source, event SHA, default-branch head, and requested tag are the
  # same commit before a signing environment can be reached.
  admit-release:
    name: Admit protected release source
    runs-on: ubuntu-latest
    # budget: 40s
    timeout-minutes: 2
    outputs:
      release_sha: ${{ steps.admit.outputs.release_sha }}
      release_tag: ${{ steps.admit.outputs.release_tag }}
    steps:
      - name: Require protected main dispatch context
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$DISPATCH_EVENT" == "workflow_dispatch" ]] || { echo "Unexpected release event: $DISPATCH_EVENT" >&2; exit 1; }
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || { echo "Release must be dispatched from refs/heads/main, got $DISPATCH_REF" >&2; exit 1; }
          [[ "$DISPATCH_REF_TYPE" == "branch" ]] || { echo "Release ref must be a branch, got $DISPATCH_REF_TYPE" >&2; exit 1; }
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" ]] || { echo "Workflow source $WORKFLOW_SHA differs from event source $DISPATCH_SHA" >&2; exit 1; }

      - name: Checkout admitted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Verify requested release version
        run: pnpm desktop:release-tag -- --tag="$RELEASE_TAG"

      # The *previous* release's facts must already be on main: this token cannot push them, so
      # a person lands the uploaded file, and a forgotten handoff leaves /download naming an older
      # build. At admit time the newest published release is exactly what the facts must describe.
      # **When blocked**: apply the previous run's `ontology-atlas-release-facts-*` artifact, or
      # `pnpm download:release-facts -- --tag=<previous>`, then dispatch again.
      - name: Verify the download page names the newest published release
        run: pnpm download:release-facts:check
        env:
          GH_TOKEN: ${{ github.token }}

      # A stale ACP registry snapshot must not ship (2026-08-20: nine packages had fallen behind
      # while the check existed but ran nowhere). It turns red when upstream deploys, so it gates
      # releases, not pull requests, and blocks only on the runtimes Rust's `ISOLATION` table runs
      # (narrowed 2026-08-26); other drift is reported. A compatibility-pinned runtime changes only
      # after the installed permission matrix passes. **When blocked**: follow the diagnostic;
      # refresh ordinary drift with `pnpm acp:registry`.
      - name: Verify bundled ACP registry is current
        run: pnpm acp:registry:check

      - name: Admit tag at current main SHA
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          pnpm desktop:release-source -- \
            --mode=admit \
            --repo="$GITHUB_REPOSITORY" \
            --tag="$RELEASE_TAG" \
            --sha="$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    needs: admit-release
    environment: release-signing
    runs-on: ${{ matrix.runner }}
    # Measured aarch64 lane: v1.4.0 20m37s, v1.5.0 16m53s (cold build plus
    # notarization).
    # budget: 1300s
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
    env:
      TAURI_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}

    steps:
      # fetch-depth: 0 is required — below `docs-vault:check` and `pnpm build` read the
      # "last changed date" per document from git history (shallow clone groups all documents
      # into the same date).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: stable

      # `bun build --compile` bakes the sidecar and embeds this runtime; the runner does not ship
      # bun. Toolchain installations are gathered at the top.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `mcp/` is not a pnpm workspace member and uses its own `node_modules`, which the root
      # install does not populate on a runner. There is exactly one pinned dependency.
      #
      # Reason for `--frozen-lockfile`: the `package-lock.json` in this folder is **npm's**,
      # and pnpm does not read it. Running without a lock file causes the runner to resolve fresh
      # from the registry every release — meaning the sidecar's dependency tree could change without
      # a commit, and that binary ships with the app. Commit `mcp/pnpm-lock.yaml` and freeze it,
      # so we can answer via diff what was shipped.
      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      - name: MCP release gate
        run: pnpm dogfood:release-gate

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Docs vault freshness
        run: pnpm docs-vault:check

      - name: Desktop checker tests
        run: pnpm test:desktop:check

      - name: Desktop runtime split tests
        run: pnpm test:desktop:runtime

      # After `tauri.conf.json` declares the MCP sidecar via `externalBin`,
      # **all cargo calls** require that file — not just the bundle step but also the below
      # `cargo test`, which checks resource paths in the build script, so the sidecar is built
      # here first. The runner is native architecture, so the host triple default is correct.
      # The later bundle step calls it again but produces the same output.
      - name: Build bundled MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native vault bridge tests
        run: pnpm test:desktop:bridge

      - name: Desktop runtime doctor
        run: pnpm desktop:doctor -- --require-runtime

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="${RELEASE_TAG}"

      # The decision to forgo signature was overturned on the same day as certificate issuance
      # (`docs/DECISIONS.md`, 2026-07-27). Direct download DMGs are created only when Developer ID
      # signing and notarization are both possible. Wrapping this check in a conditional would make
      # failure a signal to choose unsigned fallback, so the command itself is placed as a gate.
      - name: Require signed release credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:release-secrets

      # The certificate is imported only after this step, and this step's environment holds
      # no credential. The build makes no updater archive.
      - name: Build release app bundle
        run: pnpm desktop:release-artifact -- --phase=build

      # Without `-A`, only codesign may use the key unprompted; exporting it needs this step's
      # random keychain password. `-x` was ignored for PKCS#12 on macOS 27 (2026-09-27).
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT
          APPLE_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$APPLE_KEYCHAIN_PASSWORD"
          (umask 077; echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH")
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # The updater key signs the archive repacked from the signed app, and only that stage
      # receives it (scripts/build-macos-release-artifact.mjs).
      - name: Sign and notarize release artifact
        run: pnpm desktop:release-artifact -- --phase=sign
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Summarize macOS release assets
        run: |
          {
            echo "## macOS DMG (${TAURI_ARCH})"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Gather what to upload in one folder — because we define the artifact root.
      # If multiple paths are given, the root is set to their lowest common ancestor (`bundle/`),
      # creating an extra layer of `dmg/`·`macos/`, and the downloader has never chosen that depth,
      # so they cannot know it. Here we also re-attach the updater archive name using the same
      # rule as the DMG (Tauri outputs two arches with the same name + space).
      # `--require-dsym` because the shipped binary is stripped: without the symbol bundle beside
      # it, a crash report from this build names addresses and nothing else. A release that
      # silently lost its symbols looks exactly like one that kept them, so it fails here instead.
      - name: Stage release assets
        run: node scripts/stage-macos-release-assets.mjs --arch="${TAURI_ARCH}" --require-dsym

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-macos-${{ matrix.arch }}
          # There is **one** path. If there are multiple, the root is set to the lowest common ancestor.
          path: release-upload
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Apple signing keychain
        if: ${{ always() }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH"

  build-windows:
    name: Build unsigned Windows x64 beta
    needs: admit-release
    environment: release-signing
    runs-on: windows-2022
    # budget: 1100s
    timeout-minutes: 27
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      # A registry timeout (three on 2026-09-04) retries; a real advisory still fails on the
      # last attempt. The app and the bundled MCP server have separate lockfiles.
      - name: Audit JavaScript production dependencies
        shell: pwsh
        run: |
          foreach ($dir in @('.', 'mcp')) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              pnpm --dir $dir audit --prod --audit-level=high
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { exit $LASTEXITCODE }
              $delaySeconds = $attempt * 30
              Write-Host "pnpm audit in $dir failed (exit $LASTEXITCODE); retrying in $delaySeconds s (attempt $attempt of 4)..."
              Start-Sleep -Seconds $delaySeconds
            }
          }

      - name: Windows release contract tests
        run: node --test scripts/lib/mcp-binary.test.mjs scripts/stage-windows-release-assets.test.mjs scripts/verify-mcp-binary.test.mjs

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Build and verify Windows MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native bridge tests on Windows
        run: pnpm test:desktop:bridge

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="$env:RELEASE_TAG" --sha="$env:RELEASE_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="$env:RELEASE_TAG"

      # No updater key: the Windows beta ships no in-app update (latest.json lists macOS only),
      # so the build makes no updater signature for anything to publish.
      - name: Build Windows NSIS installer
        run: pnpm desktop:build:windows

      - name: Require the beta installer to be unsigned
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installer.Count)." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The public copy says unsigned, but Authenticode status is $($signature.Status)."
          }
          "Unsigned status verified: $($installer.Name)"

      - name: Scan installer with Microsoft Defender
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
          $scanner = $null
          if (Test-Path $platformRoot) {
            $scanner = Get-ChildItem $platformRoot -Filter MpCmdRun.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $scanner) {
            $fallback = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
            if (Test-Path $fallback) { $scanner = Get-Item $fallback }
          }
          if (-not $scanner) { throw "Microsoft Defender scanner is unavailable on the Windows runner." }
          & $scanner.FullName -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or found a threat (exit $LASTEXITCODE)." }

      - name: Silent install and installed-app smoke
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit $($install.ExitCode)." }

          $candidates = @(
            "$env:LOCALAPPDATA\Ontology Atlas\ontology-atlas.exe",
            "$env:LOCALAPPDATA\Programs\Ontology Atlas\ontology-atlas.exe"
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem $env:LOCALAPPDATA -Filter 'ontology-atlas.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $app) { throw "The installer completed but ontology-atlas.exe was not found." }

          $sidecar = Join-Path (Split-Path $app) 'ontology-atlas-mcp.exe'
          if (-not (Test-Path $sidecar)) { throw "The installed app is missing ontology-atlas-mcp.exe." }
          $vault = (Resolve-Path 'docs/ontology').Path
          node scripts/verify-mcp-binary.mjs "--binary=$sidecar" "--vault=$vault"

          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "The installed app exited during the 10-second launch smoke." }
          Stop-Process -Id $process.Id -Force

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/stage-windows-release-assets.mjs "--version=$packageVersion"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-upload
          if-no-files-found: error
          retention-days: 1

  # The audit's check run is the only write before staging; the checkout holds only the
  # lockfile, so no build code runs beside that token.
  audit-rust:
    name: Audit Rust dependencies
    needs: admit-release
    runs-on: ubuntu-latest
    # budget: 40s (the two audit steps took 10 s inside the Windows job)
    timeout-minutes: 2
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout the lockfile only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}
          sparse-checkout: src-tauri/Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: v0.22.2
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          curl -fsSLo cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          tar xzf cargo-audit.tgz --strip-components=1 -C "$RUNNER_TEMP/cargo-audit"
          echo "$RUNNER_TEMP/cargo-audit" >> "$GITHUB_PATH"

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ github.token }}
          working-directory: src-tauri

      # audit-check does not fail on informational advisories. GTK3's glib advisory is
      # Linux-only in Tauri's tree; every other unsoundness warning still fails here.
      - name: Deny unsound Rust advisories
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --ignore RUSTSEC-2024-0429

  # Staging and publishing are separate jobs so a human can install the exact
  # bytes that will go public before they do. The draft release is assembled
  # and verified here; nothing is visible to users yet.
  stage-macos:
    name: Stage Draft Desktop Release
    if: ${{ always() && needs.admit-release.result == 'success' && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.audit-rust.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [admit-release, build-macos, build-windows, audit-rust]
    # budget: 120s
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-macos-*
          path: release-assets
          # Do not flatten — the manifest builder splits architectures by **folder**
          # (`release-assets/ontology-atlas-macos-<arch>/`). Merging them mixes two
          # architectures in one folder, making it impossible to know which archive
          # belongs to which architecture, and incorrectly merging them causes users
          # to receive apps for the wrong architecture.
          merge-multiple: false

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source before draft creation
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require clean GitHub Release slot
        run: pnpm desktop:release-slot -- --tag="${RELEASE_TAG}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build updater manifest
        run: |
          node scripts/build-updater-manifest.mjs \
            --dir=release-assets --out=release-assets/latest.json \
            --tag="${RELEASE_TAG}" --repo="${GITHUB_REPOSITORY}"

      - name: Build the MCP ecosystem bundle
        # The MCPB artifact is what makes Atlas publishable to the official MCP
        # Registry without an npm package: the registry verifies the release
        # asset's URL and SHA-256 and hosts no files itself. The build boots the
        # unpacked bundle before it writes an artifact, so a bundle that cannot
        # start never reaches a release. Built after the updater manifest so the
        # manifest builder, which splits architectures by folder, never sees this
        # one.
        run: |
          pnpm --dir mcp install --frozen-lockfile
          pnpm mcp:build-bundle -- --tag="${RELEASE_TAG}"
          mkdir -p release-assets/mcp
          cp .tmp/mcp-bundle/*.mcpb release-assets/mcp/
          cd release-assets/mcp
          for bundle in *.mcpb; do shasum -a 256 "$bundle" > "$bundle.sha256"; done

      - name: Upload draft GitHub Release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.admit-release.outputs.release_tag }}
          draft: true
          generate_release_notes: true
          files: |
            release-assets/*/*.dmg
            release-assets/ontology-atlas-macos-*/*.sha256
            release-assets/*/*.app.tar.gz
            release-assets/*/*.app.tar.gz.sig
            release-assets/*/*.dSYM.zip
            release-assets/windows/*.exe
            release-assets/windows/*.exe.sha256
            release-assets/mcp/*.mcpb
            release-assets/mcp/*.mcpb.sha256
            release-assets/latest.json

      - name: Verify draft release assets
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --allow-draft --require-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize the draft awaiting approval
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Draft desktop release — awaiting approval"
            echo ""
            echo "macOS DMGs and the unsigned Windows x64 beta are staged at ${release_url}."
            echo "The Windows artifact passed the native Windows Server 2022 build, Defender scan,"
            echo "silent install, app launch, and installed MCP sidecar smoke before this gate."
            echo "Windows 11 client SmartScreen UI remains explicitly unverified."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Gated on the `release` GitHub Environment. Configure it with required
  # reviewers (repo Settings → Environments → release) so a first public
  # release cannot happen without someone installing the draft build first —
  # the workflow alone cannot prove the app launches on a clean machine.
  publish-macos:
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    needs: [admit-release, stage-macos]
    # budget: 120s
    timeout-minutes: 3
    environment: release
    permissions:
      # Publish the verified GitHub Release. Generated download facts leave this
      # job only as an artifact and cross protected main through a normal PR.
      contents: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
    steps:
      # fetch-depth: 0 — the generated manifest's determinism contract needs the full history
      # (`generated-vault-determinism.contract.test.ts`).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source after publication approval
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish verified stable release
        run: |
          # Clears a pre-release flag set by hand on the draft: the hosted updater skips a GitHub
          # pre-release, and `desktop:verify-download` and `download:release-facts` below refuse one.
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify public download assets
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --require-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate verified release facts from admitted source
        run: |
          pnpm download:release-facts -- --tag="${RELEASE_TAG}"
          cp src/views/download/model/macos-release.generated.ts "$RUNNER_TEMP/macos-release.generated.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The release token cannot bypass protected main and repository policy does not let
      # GITHUB_TOKEN create pull requests. Preserve the admitted result as a one-file handoff.
      # A locally authenticated operator applies this artifact in a normal PR; that PR receives
      # the ordinary required checks, and its human-token merge triggers deploy-pages.yml.
      - name: Upload protected release facts handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-release-facts-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/macos-release.generated.ts
          if-no-files-found: error
          retention-days: 7

      - name: Summarize published desktop release
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Published desktop release"
            echo ""
            echo "Release: ${release_url}"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in release-assets/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
            for installer in release-assets/windows/*.exe; do
              checksum="${installer}.sha256"
              size="$(wc -c < "$installer" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$installer")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The listing follows publication inside the same run, on purpose.
  #
  # This was a separate workflow on `release: [published]` until 2026-09-11, when
  # v1.2.0 shipped and it had **zero runs**: `publish-macos` takes the release out of
  # draft with `GITHUB_TOKEN`, and GitHub will not start a workflow from an event that
  # token raised. The trigger could never fire for our own releases, and the entry had
  # to be dispatched by hand — an "it is wired" claim that was not true.
  #
  # `needs: publish-macos` is the honest ordering: the registry fetches the asset with
  # no credentials, so it must already be public. The called workflow keeps its own
  # `workflow_dispatch` for re-listing a release that is already out.
  list-mcp-registry:
    name: List the MCP server entry
    needs: [admit-release, publish-macos]
    permissions:
      # Not repository write. `id-token: write` mints the short-lived OIDC assertion
      # `mcp-publisher login github-oidc` exchanges to prove this repository owns the
      # `io.github.wlsdks/*` namespace; it grants nothing over this repository's contents.
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      tag: ${{ needs.admit-release.outputs.release_tag }}
