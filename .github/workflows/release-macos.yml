name: Release Desktop
run-name: Release Desktop ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z (stable) or vX.Y.Z-beta.N (beta) tag whose commit must equal the current default-branch head"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  # `workflow_dispatch` can target another ref even though the workflow must
  # exist on the default branch. This unprivileged job proves that the selected
  # workflow source, event SHA, default-branch head, and requested tag are the
  # same commit before a signing environment can be reached.
  admit-release:
    name: Admit protected release source
    runs-on: ubuntu-latest
    # budget: 40s
    timeout-minutes: 2
    outputs:
      release_sha: ${{ steps.admit.outputs.release_sha }}
      release_tag: ${{ steps.admit.outputs.release_tag }}
      # `stable` for vX.Y.Z, `beta` for vX.Y.Z-beta.N (scripts/lib/release-tag.mjs). A beta is a
      # GitHub pre-release that never carries latest.json and never writes /download.
      release_channel: ${{ steps.tag.outputs.channel }}
    steps:
      - name: Require protected main dispatch context
        env:
          DISPATCH_EVENT: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$DISPATCH_EVENT" == "workflow_dispatch" ]] || { echo "Unexpected release event: $DISPATCH_EVENT" >&2; exit 1; }
          [[ "$DISPATCH_REF" == "refs/heads/main" ]] || { echo "Release must be dispatched from refs/heads/main, got $DISPATCH_REF" >&2; exit 1; }
          [[ "$DISPATCH_REF_TYPE" == "branch" ]] || { echo "Release ref must be a branch, got $DISPATCH_REF_TYPE" >&2; exit 1; }
          [[ "$WORKFLOW_SHA" == "$DISPATCH_SHA" ]] || { echo "Workflow source $WORKFLOW_SHA differs from event source $DISPATCH_SHA" >&2; exit 1; }

      - name: Checkout admitted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Verify requested release version
        id: tag
        run: pnpm desktop:release-tag -- --tag="$RELEASE_TAG" --github-output

      # The *previous* release's facts must already be on main: this token cannot push them, so
      # a person lands the uploaded file, and a forgotten handoff leaves /download naming an older
      # build. At admit time the newest published release is exactly what the facts must describe.
      # **When blocked**: apply the previous run's `ontology-atlas-release-facts-*` artifact, or
      # `pnpm download:release-facts -- --tag=<previous>`, then dispatch again.
      - name: Verify the download page names the newest published release
        run: pnpm download:release-facts:check
        env:
          GH_TOKEN: ${{ github.token }}

      # A stale ACP registry snapshot must not ship. Upstream turns it red without a commit, so
      # it gates releases, not pull requests; `acp-registry.yml` runs it daily and `pr:land`
      # warns while that run is red. It blocks only on the runtimes Rust's `ISOLATION` table
      # runs. A compatibility-pinned runtime changes only after the installed permission matrix
      # passes. **When blocked**: follow the diagnostic; refresh drift with `pnpm acp:registry`.
      - name: Verify bundled ACP registry is current
        run: pnpm acp:registry:check

      - name: Admit tag at current main SHA
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          pnpm desktop:release-source -- \
            --mode=admit \
            --repo="$GITHUB_REPOSITORY" \
            --tag="$RELEASE_TAG" \
            --sha="$RELEASE_SHA"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  # The gates that do not produce the artifact run beside the builds instead of before
  # them. `stage-macos` needs every test job, so a red gate still stops the draft release.
  # None of them enters `release-signing`: no step here reads a secret.
  test-release-gates:
    name: Verify release gates
    needs: admit-release
    runs-on: ubuntu-latest
    # budget: 1200s (v2.2.3: these steps took 104 s on the macOS runner; the MCP program is built
    # from a cold target here, which no run has timed yet)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      # The release gate starts the server the way an agent does, through `mcp/src/index.js`,
      # which starts the Rust program this step builds.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build the MCP program
        run: pnpm mcp:build-binary

      - name: MCP release gate
        run: pnpm dogfood:release-gate

      - name: Desktop checker tests
        run: pnpm test:desktop:check

      - name: Desktop runtime split tests
        run: pnpm test:desktop:runtime

  # The `.mcpb` bundle carries a program for each system and architecture it has carried, each
  # built on a runner of that architecture (no cross-compiling): the macOS arm64 and Windows x64
  # programs come from the app builds. A static musl program starts on any Linux of its
  # architecture, where one built by the gate job links the runner's glibc. No secret is read here.
  build-mcp-programs:
    name: Build the ${{ matrix.target }} MCP program for the bundle
    needs: admit-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: macos-x64
    # budget: 1200s (a cold musl build of the server crates; no run has timed it yet)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Install the musl C compiler
        if: ${{ endsWith(matrix.target, '-musl') }}
        run: sudo apt-get install --no-install-recommends -y musl-tools

      - name: Build the MCP program
        run: pnpm mcp:build-binary -- --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc

      - name: Upload the MCP program
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-mcp-program-${{ matrix.artifact }}
          path: src-tauri/binaries/ontology-atlas-mcp-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  # Only what needs macOS stays on the macOS runner.
  test-macos:
    name: Verify macOS native bridge
    needs: admit-release
    runs-on: macos-15
    # budget: 600s (v2.3.0: cancelled at 7 min with the native bridge tests still compiling the
    # grown src-tauri crates from a cold target; setup took 66 s)
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      # Two cases in this file run `codesign` and skip themselves off macOS, so the Linux
      # run of the checker tests does not cover them.
      - name: Checker tests that need codesign
        run: node --test scripts/verify-macos/verify-macos-install-smoke.test.mjs

      # `tauri.conf.json` declares the MCP sidecar as `externalBin`, so every cargo call,
      # the `cargo test` below included, needs that file to exist first.
      - name: Build bundled MCP sidecar
        run: pnpm mcp:build-binary

      # Pull requests run the same workspace tests in `lint-rust-macos`; this reruns them on the tag.
      - name: Native vault bridge tests
        run: pnpm test:desktop:bridge

  test-windows:
    name: Verify Windows native bridge
    needs: admit-release
    runs-on: windows-2022
    # budget: 900s (v2.3.0: cancelled at 10 min with the native bridge tests still compiling from
    # a cold target; main's warm-cache Windows check spends 405 s in the same step)
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install bundled MCP server dependencies
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Windows release contract tests
        run: node --test scripts/lib/packaging/mcp-binary.test.mjs scripts/download/stage-windows-release-assets.test.mjs scripts/packaging/verify-mcp-binary.test.mjs scripts/packaging/rust-mcp-program.test.mjs

      - name: Build and verify Windows MCP sidecar
        run: pnpm mcp:build-binary

      - name: Native bridge tests on Windows
        run: pnpm test:desktop:bridge

  # The build steps run third-party build code in a job that references no secret. The
  # bundle they produce is still executed in `sign-macos` (exact-case probe, install smoke).
  # A signing or notarization failure reruns that short job alone.
  build-macos:
    name: Build unsigned macOS app (${{ matrix.arch }})
    needs: admit-release
    runs-on: ${{ matrix.runner }}
    # No standalone run measured yet: the v2.2.2 steps this job keeps took about 720 s, and
    # v2.2.1 ran 14% slower. A timeout cancels the build and the rerun repeats all of it.
    # budget: 1200s
    timeout-minutes: 30
    outputs:
      unsigned_sha256: ${{ steps.archive.outputs.sha256 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
    env:
      TAURI_ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}

    steps:
      # fetch-depth: 0 is required — below `docs-vault:check` and `pnpm build` read the
      # "last changed date" per document from git history (shallow clone groups all documents
      # into the same date).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Docs vault freshness
        run: pnpm docs-vault:check

      - name: Desktop runtime doctor
        run: pnpm desktop:doctor -- --require-runtime

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="${RELEASE_TAG}"

      # `admit-release` accepts only the head of main, and the required Checks gate ran
      # `pnpm typecheck` on that program when it merged (next.config.ts).
      # The app embeds its commit, so the updater can offer the stable release promoted
      # from another beta of the same version (src-tauri/src/update_offer.rs).
      - name: Build release app bundle
        run: pnpm desktop:release-artifact -- --phase=build
        env:
          ATLAS_BUILD_SKIP_TYPECHECK: "1"
          ATLAS_BUILD_COMMIT: ${{ needs.admit-release.outputs.release_sha }}

      # tar keeps the bundle's modes and extended attributes, which the artifact's zip would
      # drop. Staging needs the symbols of this binary; Cargo leaves the dSYM as a symlink
      # into `deps/`, so it is appended with `-L` to carry the directory, not the link.
      # `/usr/bin/tar` is bsdtar: a GNU tar on PATH reads `-L` as a tape length.
      - name: Archive unsigned app bundle
        id: archive
        run: |
          /usr/bin/tar -cf "$RUNNER_TEMP/macos-unsigned.tar" -C src-tauri/target/release bundle/macos
          /usr/bin/tar -rLf "$RUNNER_TEMP/macos-unsigned.tar" -C src-tauri/target/release ontology-atlas.dSYM
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/macos-unsigned.tar" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Not `ontology-atlas-macos-*`: publishing downloads every artifact of that pattern.
          name: ontology-atlas-unsigned-macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-unsigned.tar
          if-no-files-found: error
          retention-days: 1

  # A missing or malformed signing secret fails here in under a minute, beside the build,
  # not after it. This job holds every signing secret, so it runs nothing but one repository
  # script that imports one repository module and starts no process: no install, no build.
  check-release-credentials:
    name: Check signing credentials
    needs: admit-release
    environment: release-signing
    runs-on: ubuntu-latest
    # budget: 90s (checkout, Node setup and one script; no run of this job measured yet)
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check release credentials early
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/desktop-release/check-macos-release-secrets.mjs

  sign-macos:
    name: Sign and notarize macOS DMG (aarch64)
    needs: [admit-release, check-release-credentials, build-macos]
    environment: release-signing
    runs-on: macos-15
    # No standalone run measured yet: signing and notarization took 108 s in v2.2.2, staging
    # and upload 12 s; setup and the artifact download are estimated at 90 s. Apple's
    # notary queue is the variable part.
    # budget: 480s
    timeout-minutes: 12
    env:
      TAURI_ARCH: aarch64
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Recheck release source commit before signing
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      # The decision to forgo signature was overturned on the same day as certificate issuance
      # (`docs/DECISIONS.md`, 2026-07-27). Direct download DMGs are created only when Developer ID
      # signing and notarization are both possible. Wrapping this check in a conditional would make
      # failure a signal to choose unsigned fallback, so the command itself is placed as a gate.
      - name: Require signed release credentials
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:release-secrets

      - name: Download unsigned app bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-unsigned-macos-aarch64
          path: ${{ runner.temp }}/macos-unsigned

      # The digest travels as a job output, not inside the artifact, so the bundle signed
      # here is the one `build-macos` archived.
      - name: Restore the unsigned app bundle that build-macos archived
        env:
          UNSIGNED_SHA256: ${{ needs.build-macos.outputs.unsigned_sha256 }}
        run: |
          ARCHIVE="$RUNNER_TEMP/macos-unsigned/macos-unsigned.tar"
          [[ "$UNSIGNED_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "build-macos reported no archive digest" >&2; exit 1; }
          echo "${UNSIGNED_SHA256}  ${ARCHIVE}" | shasum -a 256 --check --strict
          mkdir -p src-tauri/target/release
          /usr/bin/tar -xf "$ARCHIVE" -C src-tauri/target/release
          rm -f "$ARCHIVE"
          [[ -d src-tauri/target/release/ontology-atlas.dSYM/Contents ]] || { echo "the archive carried no dSYM directory" >&2; exit 1; }

      # Without `-A`, only codesign may use the key unprompted; exporting it needs this step's
      # random keychain password. `-x` was ignored for PKCS#12 on macOS 27 (2026-09-27).
      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT
          APPLE_KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$APPLE_KEYCHAIN_PASSWORD"
          (umask 077; echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH")
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -x -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # The updater key signs the archive repacked from the signed app, and only that stage
      # receives it (scripts/desktop-release/build-macos-release-artifact.mjs).
      - name: Sign and notarize release artifact
        run: pnpm desktop:release-artifact -- --phase=sign
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Summarize macOS release assets
        run: |
          {
            echo "## macOS DMG (${TAURI_ARCH})"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in src-tauri/target/release/bundle/dmg/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Gather what to upload in one folder — because we define the artifact root.
      # If multiple paths are given, the root is set to their lowest common ancestor (`bundle/`),
      # creating an extra layer of `dmg/`·`macos/`, and the downloader has never chosen that depth,
      # so they cannot know it. Here we also re-attach the updater archive name using the same
      # rule as the DMG (Tauri outputs two arches with the same name + space).
      # `--require-dsym` because the shipped binary is stripped: without the symbol bundle beside
      # it, a crash report from this build names addresses and nothing else. A release that
      # silently lost its symbols looks exactly like one that kept them, so it fails here instead.
      - name: Stage release assets
        run: node scripts/download/stage-macos-release-assets.mjs --arch="${TAURI_ARCH}" --require-dsym

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-macos-aarch64
          # There is **one** path. If there are multiple, the root is set to the lowest common ancestor.
          path: release-upload
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Apple signing keychain
        if: ${{ always() }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$CERTIFICATE_PATH"

  build-windows:
    name: Build unsigned Windows x64 beta
    needs: admit-release
    environment: release-signing
    runs-on: windows-2022
    # budget: 1100s
    timeout-minutes: 27
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master #182
        with:
          toolchain: 1.100.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A registry timeout (three on 2026-09-04) retries; a real advisory still fails on the
      # last attempt. The app and the bundled MCP server have separate lockfiles.
      - name: Audit JavaScript production dependencies
        shell: pwsh
        run: |
          foreach ($dir in @('.', 'mcp')) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              pnpm --dir $dir audit --prod --audit-level=high
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { exit $LASTEXITCODE }
              $delaySeconds = $attempt * 30
              Write-Host "pnpm audit in $dir failed (exit $LASTEXITCODE); retrying in $delaySeconds s (attempt $attempt of 4)..."
              Start-Sleep -Seconds $delaySeconds
            }
          }

      - name: Desktop readiness
        run: pnpm desktop:check

      - name: Verify release source commit
        run: pnpm desktop:release-source -- --mode=pin --tag="$env:RELEASE_TAG" --sha="$env:RELEASE_SHA"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}

      - name: Verify release tag version
        run: pnpm desktop:release-tag -- --tag="$env:RELEASE_TAG"

      # No updater key: the Windows beta ships no in-app update (latest.json lists macOS only),
      # so the build makes no updater signature for anything to publish.
      # The admitted commit is the type-checked head of main (next.config.ts).
      - name: Build Windows NSIS installer
        run: pnpm desktop:build:windows
        env:
          ATLAS_BUILD_SKIP_TYPECHECK: "1"
          ATLAS_BUILD_COMMIT: ${{ needs.admit-release.outputs.release_sha }}

      - name: Require the beta installer to be unsigned
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe"
          if ($installer.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installer.Count)." }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "The public copy says unsigned, but Authenticode status is $($signature.Status)."
          }
          "Unsigned status verified: $($installer.Name)"

      - name: Scan installer with Microsoft Defender
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $platformRoot = "$env:ProgramData\Microsoft\Windows Defender\Platform"
          $scanner = $null
          if (Test-Path $platformRoot) {
            $scanner = Get-ChildItem $platformRoot -Filter MpCmdRun.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }
          if (-not $scanner) {
            $fallback = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
            if (Test-Path $fallback) { $scanner = Get-Item $fallback }
          }
          if (-not $scanner) { throw "Microsoft Defender scanner is unavailable on the Windows runner." }
          & $scanner.FullName -Scan -ScanType 3 -File $installer -DisableRemediation
          if ($LASTEXITCODE -ne 0) { throw "Microsoft Defender scan failed or found a threat (exit $LASTEXITCODE)." }

      - name: Silent install and installed-app smoke
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName
          $install = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed with exit $($install.ExitCode)." }

          $candidates = @(
            "$env:LOCALAPPDATA\Ontology Atlas\ontology-atlas.exe",
            "$env:LOCALAPPDATA\Programs\Ontology Atlas\ontology-atlas.exe"
          )
          $app = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $app) {
            $app = Get-ChildItem $env:LOCALAPPDATA -Filter 'ontology-atlas.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $app) { throw "The installer completed but ontology-atlas.exe was not found." }

          $sidecar = Join-Path (Split-Path $app) 'ontology-atlas-mcp.exe'
          if (-not (Test-Path $sidecar)) { throw "The installed app is missing ontology-atlas-mcp.exe." }
          $vault = (Resolve-Path 'docs/ontology').Path
          node scripts/packaging/verify-mcp-binary.mjs "--binary=$sidecar" "--vault=$vault"

          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "The installed app exited during the 10-second launch smoke." }
          Stop-Process -Id $process.Id -Force

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/download/stage-windows-release-assets.mjs "--version=$packageVersion"

      - name: Upload the Windows MCP program
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-mcp-program-windows-x64
          path: src-tauri/binaries/ontology-atlas-mcp-x86_64-pc-windows-msvc.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-upload
          if-no-files-found: error
          retention-days: 1

  # The audit's check run is the only write before staging; the checkout holds only the
  # lockfile, so no build code runs beside that token.
  audit-rust:
    name: Audit Rust dependencies
    needs: admit-release
    runs-on: ubuntu-latest
    # budget: 40s (the two audit steps took 10 s inside the Windows job)
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout the lockfile only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}
          sparse-checkout: src-tauri/Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Install cargo-audit
        env:
          CARGO_AUDIT_VERSION: v0.22.2
          CARGO_AUDIT_SHA256: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
        run: |
          curl -fsSLo cargo-audit.tgz \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2F${CARGO_AUDIT_VERSION}/cargo-audit-x86_64-unknown-linux-gnu-${CARGO_AUDIT_VERSION}.tgz"
          echo "${CARGO_AUDIT_SHA256}  cargo-audit.tgz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-audit"
          tar xzf cargo-audit.tgz --strip-components=1 -C "$RUNNER_TEMP/cargo-audit"
          echo "$RUNNER_TEMP/cargo-audit" >> "$GITHUB_PATH"

      # cargo audit exits non-zero on any vulnerability, and --deny unsound adds
      # unsoundness warnings. GTK3's glib advisory is Linux-only in Tauri's tree.
      # It runs without a token: the check-run action it replaced failed trains
      # with "Not Found" while updating its own check run, after finding nothing.
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock --deny unsound --ignore RUSTSEC-2024-0429

  # Staging and publishing are separate jobs so a human can install the exact
  # bytes that will go public before they do. The draft release is assembled
  # and verified here; nothing is visible to users yet.
  stage-macos:
    name: Stage Draft Desktop Release
    if: ${{ always() && needs.admit-release.result == 'success' && needs.test-release-gates.result == 'success' && needs.test-macos.result == 'success' && needs.test-windows.result == 'success' && needs.check-release-credentials.result == 'success' && needs.build-macos.result == 'success' && needs.sign-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-mcp-programs.result == 'success' && needs.audit-rust.result == 'success' }}
    runs-on: ubuntu-latest
    needs: [admit-release, test-release-gates, test-macos, test-windows, check-release-credentials, build-macos, sign-macos, build-windows, build-mcp-programs, audit-rust]
    # budget: 120s
    timeout-minutes: 3
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
      RELEASE_CHANNEL: ${{ needs.admit-release.outputs.release_channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-macos-aarch64
          path: release-assets/ontology-atlas-macos-aarch64
          merge-multiple: false

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source before draft creation
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Require clean GitHub Release slot
        run: pnpm desktop:release-slot -- --tag="${RELEASE_TAG}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The one feed installed apps read is copied from a release's latest.json, so a beta
      # release never has one: this step runs for the stable channel alone.
      - name: Build updater manifest
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: |
          node scripts/desktop-release/build-updater-manifest.mjs \
            --dir=release-assets --out=release-assets/latest.json \
            --tag="${RELEASE_TAG}" --commit="${RELEASE_SHA}" --repo="${GITHUB_REPOSITORY}"

      # Downloaded beside, not inside, `release-assets`: the updater manifest builder and the upload
      # globs below must never see a bare program.
      - name: Download the Windows MCP program
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-mcp-program-windows-x64
          path: .tmp/mcp-programs/windows

      - name: Download the Linux MCP programs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-mcp-program-linux-*
          merge-multiple: true
          path: .tmp/mcp-programs/linux

      - name: Download the Intel macOS MCP program
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-mcp-program-macos-x64
          path: .tmp/mcp-programs/macos-x64

      - name: Build the MCP ecosystem bundle
        # The MCPB artifact is what makes Atlas publishable to the official MCP
        # Registry without an npm package: the registry verifies the release
        # asset's URL and SHA-256 and hosts no files itself. The macOS arm64 program is the one
        # inside the signed and notarized app, so the bundle carries the signature the
        # app carries; the Intel one is built unsigned on an Intel runner. A host picks
        # a program by operating system alone, so macOS and Linux each start a script that
        # picks by architecture. The build boots the program the manifest names for this
        # runner from the unpacked artifact before it writes it, so a bundle that cannot
        # start never reaches a release. Built after the updater manifest so the manifest
        # builder, which splits architectures by folder, never sees this one.
        run: |
          mkdir -p .tmp/mcp-programs/macos
          tar -xzf release-assets/ontology-atlas-macos-aarch64/*.app.tar.gz -C .tmp/mcp-programs/macos --wildcards '*/Contents/MacOS/ontology-atlas-mcp'
          macos_program="$(find .tmp/mcp-programs/macos -type f -name ontology-atlas-mcp | head -n 1)"
          test -n "$macos_program"
          pnpm mcp:build-bundle -- --tag="${RELEASE_TAG}" \
            --program=aarch64-apple-darwin="$macos_program" \
            --program=x86_64-pc-windows-msvc=.tmp/mcp-programs/windows/ontology-atlas-mcp-x86_64-pc-windows-msvc.exe \
            --program=x86_64-apple-darwin=.tmp/mcp-programs/macos-x64/ontology-atlas-mcp-x86_64-apple-darwin \
            --program=x86_64-unknown-linux-musl=.tmp/mcp-programs/linux/ontology-atlas-mcp-x86_64-unknown-linux-musl \
            --program=aarch64-unknown-linux-musl=.tmp/mcp-programs/linux/ontology-atlas-mcp-aarch64-unknown-linux-musl
          mkdir -p release-assets/mcp
          cp .tmp/mcp-bundle/*.mcpb release-assets/mcp/
          cd release-assets/mcp
          for bundle in *.mcpb; do shasum -a 256 "$bundle" > "$bundle.sha256"; done

      - name: Refuse an updater manifest on a beta release
        if: ${{ needs.admit-release.outputs.release_channel != 'stable' }}
        run: |
          if [[ -e release-assets/latest.json ]]; then
            echo "A beta release never carries latest.json; ${RELEASE_TAG} staged one." >&2
            exit 1
          fi

      - name: Upload draft GitHub Release assets
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.admit-release.outputs.release_tag }}
          draft: true
          prerelease: ${{ needs.admit-release.outputs.release_channel == 'beta' }}
          generate_release_notes: true
          files: |
            release-assets/*/*.dmg
            release-assets/ontology-atlas-macos-*/*.sha256
            release-assets/*/*.app.tar.gz
            release-assets/*/*.app.tar.gz.sig
            release-assets/*/*.dSYM.zip
            release-assets/windows/*.exe
            release-assets/windows/*.exe.sha256
            release-assets/mcp/*.mcpb
            release-assets/mcp/*.mcpb.sha256
            release-assets/latest.json

      - name: Verify draft release assets
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --allow-draft --require-updater --commit="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify draft beta release assets
        if: ${{ needs.admit-release.outputs.release_channel == 'beta' }}
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --allow-draft --beta
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Summarize the draft awaiting approval
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Draft desktop ${RELEASE_CHANNEL} release — awaiting approval"
            echo ""
            echo "The Apple Silicon DMG and the unsigned Windows x64 beta are staged at ${release_url}."
            echo "The Windows artifact passed the native Windows Server 2022 build, Defender scan,"
            echo "silent install, app launch, and installed MCP sidecar smoke before this gate."
            echo "Windows 11 client SmartScreen UI remains explicitly unverified."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Gated on the `release` GitHub Environment. Configure it with required
  # reviewers (repo Settings → Environments → release) so a first public
  # release cannot happen without someone installing the draft build first —
  # the workflow alone cannot prove the app launches on a clean machine.
  # For a beta the approval may come without installing the draft: the beta
  # release itself is what the owner installs by hand.
  publish-macos:
    name: Publish Desktop Release
    runs-on: ubuntu-latest
    needs: [admit-release, stage-macos]
    # budget: 120s
    timeout-minutes: 3
    environment: release
    permissions:
      # The browser gate reads e2e.yml runs and their artifact names.
      actions: read
      # Publish the verified GitHub Release. Generated download facts leave this
      # job only as an artifact and cross protected main through a normal PR.
      contents: write
    env:
      RELEASE_TAG: ${{ needs.admit-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.admit-release.outputs.release_sha }}
      RELEASE_CHANNEL: ${{ needs.admit-release.outputs.release_channel }}
    steps:
      # fetch-depth: 0 — the generated manifest's determinism contract needs the full history
      # (`generated-vault-determinism.contract.test.ts`).
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.admit-release.outputs.release_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: ontology-atlas-macos-*
          path: release-assets
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ontology-atlas-windows-x64
          path: release-assets/windows

      - name: Recheck admitted release source after publication approval
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A stable release publishes only over a whole green browser run on its own commit.
      # `desktop:release-run` started one on the tag at the cut; a beta does not wait for it.
      # **When blocked**: wait for that run, or follow the printed dispatch command, then
      # rerun this job.
      - name: Require a whole green browser run on the release commit
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: pnpm desktop:release-browser-gate -- --repo="${GITHUB_REPOSITORY}" --sha="${RELEASE_SHA}" --tag="${RELEASE_TAG}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish verified stable release
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: |
          # Clears a pre-release flag set by hand on the draft: the hosted updater skips a GitHub
          # pre-release, and `desktop:verify-download` and `download:release-facts` below refuse one.
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease=false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish verified beta release
        if: ${{ needs.admit-release.outputs.release_channel == 'beta' }}
        run: gh release edit "${RELEASE_TAG}" --draft=false --prerelease=true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Recheck admitted release source after publication
        run: pnpm desktop:release-source -- --mode=pin --tag="${RELEASE_TAG}" --sha="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify public download assets
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --require-updater --commit="${RELEASE_SHA}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify public beta release assets
        if: ${{ needs.admit-release.outputs.release_channel == 'beta' }}
        run: pnpm desktop:verify-download -- --tag="${RELEASE_TAG}" --beta
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # /download names stable releases only; a beta writes no facts.
      - name: Generate verified release facts from admitted source
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        run: |
          pnpm download:release-facts -- --tag="${RELEASE_TAG}"
          cp src/views/download/model/macos-release.generated.ts "$RUNNER_TEMP/macos-release.generated.ts"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The release token cannot bypass protected main and repository policy does not let
      # GITHUB_TOKEN create pull requests. Preserve the admitted result as a one-file handoff.
      # A locally authenticated operator applies this artifact in a normal PR; that PR receives
      # the ordinary required checks, and its human-token merge triggers deploy-pages.yml.
      - name: Upload protected release facts handoff
        if: ${{ needs.admit-release.outputs.release_channel == 'stable' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ontology-atlas-release-facts-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/macos-release.generated.ts
          if-no-files-found: error
          retention-days: 7

      - name: Summarize published desktop release
        run: |
          release_url="$(gh release view "${RELEASE_TAG}" --json url --jq .url)"
          {
            echo "## Published desktop ${RELEASE_CHANNEL} release"
            echo ""
            echo "Release: ${release_url}"
            echo ""
            echo "| Asset | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for dmg in release-assets/*.dmg; do
              checksum="${dmg}.sha256"
              size="$(wc -c < "$dmg" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$dmg")\` | ${size} bytes | \`${sha}\` |"
            done
            for installer in release-assets/windows/*.exe; do
              checksum="${installer}.sha256"
              size="$(wc -c < "$installer" | tr -d ' ')"
              sha="$(cut -d ' ' -f 1 "$checksum")"
              echo "| \`$(basename "$installer")\` | ${size} bytes | \`${sha}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The listing follows publication inside the same run, on purpose.
  #
  # This was a separate workflow on `release: [published]` until 2026-09-11, when
  # v1.2.0 shipped and it had **zero runs**: `publish-macos` takes the release out of
  # draft with `GITHUB_TOKEN`, and GitHub will not start a workflow from an event that
  # token raised. The trigger could never fire for our own releases, and the entry had
  # to be dispatched by hand — an "it is wired" claim that was not true.
  #
  # `needs: publish-macos` is the honest ordering: the registry fetches the asset with
  # no credentials, so it must already be public. The called workflow keeps its own
  # `workflow_dispatch` for re-listing a release that is already out.
  list-mcp-registry:
    name: List the MCP server entry
    needs: [admit-release, publish-macos]
    permissions:
      # Not repository write. `id-token: write` mints the short-lived OIDC assertion
      # `mcp-publisher login github-oidc` exchanges to prove this repository owns the
      # `io.github.wlsdks/*` namespace; it grants nothing over this repository's contents.
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      tag: ${{ needs.admit-release.outputs.release_tag }}
