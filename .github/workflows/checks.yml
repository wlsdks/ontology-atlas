# PR checks are impact-planned before any dependency install. `main` requires one context,
# `Required checks`, which this file defines; inactive lanes start, explain the skip, and
# finish in seconds. A missing plan is RED. Scheduled/manual runs and planner changes run
# every command registered in `scripts/ci/classify-change.mjs`. No browser spec runs here or
# before merge: `e2e.yml` runs the browser suite nightly.
#
# Before merge a train runs what its change can affect plus a fixed core (the security
# and vault-format contracts); after the merge every push to main runs the full set
# (`--main-push=full`), so a suite the plan left out turns main red, not the train.
# A manual run given `compare_to` plans like a pull request against that branch, which
# is how a planned run is measured without opening one.
#
# A pull request is opened as a **draft** and runs nothing. `pnpm pr:land` puts
# it on a landing train built from today's main, and the train's pull request
# fires this workflow **once**, on exactly the tree that is about to land. Owner's shape, 2026-09-12: most
# changes overlap, so CI on a branch that is not yet the thing being merged is a
# round paid twice.
#
# `merge_group` is wired for the day this repository belongs to an organization
# and GitHub's own merge queue becomes available. Until then no merge group is
# ever created, so the trigger is inert rather than wrong.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      compare_to:
        description: Branch to compare with; empty runs the full set
        required: false
        type: string
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

# A push to main runs the full set behind the trains' affected checks, so every one must finish.
# GitHub keeps only one waiting run per group and replaces it, so a push gets a group of its own
# (its run id) and is never cancelled or dropped. Pull requests and trains still cancel a
# superseded run.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || github.event_name == 'push' && format('push-{0}', github.run_id) || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUSH_BEFORE: ${{ github.event.before }}

jobs:
  plan:
    name: Check impact plan
    permissions:
      contents: read
      checks: read
      pull-requests: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # budget: 25s
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      gates: ${{ steps.impact.outputs.gates }}
      gates_needs_mcp: ${{ steps.impact.outputs.gates_needs_mcp }}
      unit: ${{ steps.impact.outputs.unit }}
      unit_needs_mcp: ${{ steps.impact.outputs.unit_needs_mcp }}
      unit_sharded: ${{ steps.impact.outputs.unit_sharded }}
      perf: ${{ steps.impact.outputs.perf }}
      mcp: ${{ steps.impact.outputs.mcp }}
      base: ${{ steps.impact.outputs.base }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          # History without old file contents: the planner reads commits and trees only, and a
          # full clone spent 22 s of this job's 27 s (22 trains, 2026-11-17/18). Lanes that
          # install keep the full clone: `prepare` builds the docs vault, whose rename-aware
          # history pass would fetch old contents one by one (15 s measured).
          filter: blob:none

      - name: Build impact plan
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          # A merge group has no base branch ref, and its two SHAs are minted by
          # GitHub, so they are data rather than a string anyone can choose.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          COMPARE_TO: ${{ inputs.compare_to }}
        run: node scripts/ci/classify-change.mjs --event="$EVENT_NAME" --base="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}" --main-push=full --compare-to="$COMPARE_TO"

  gates:
    name: Types · Lint · Docs
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 600s (260 s before the MCP program was built here; the cold build is not timed yet)
    timeout-minutes: 12
    env:
      CI_LANE_REPORT: ci-lane-report.jsonl
      ACTIVE: ${{ needs.plan.outputs.gates }}
      NEED_MCP: ${{ needs.plan.outputs.gates_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      # Contract tests start the server through `mcp/src/index.js`, which starts this Rust program.
      - name: Cache Rust build
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build the MCP program
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm mcp:build-binary -- --skip-verify

      # `licenses:check` and `notice:check` run `cargo metadata` side by side; without this step both
      # auto-install the `rust-toolchain.toml` channel at once and one fails renaming the other's download.
      - name: Install the pinned Rust toolchain
        if: env.ACTIVE == 'true'
        run: rustup toolchain install

      - name: Run planned type, lint, and documentation gates
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PLAN_BASE: ${{ needs.plan.outputs.base }}
        run: node scripts/ci/run-ci-lane.mjs --lane=gates --base="${PLAN_BASE:-${PUSH_BEFORE:-origin/$BASE_REF}}"

      - name: Check live catalogue freshness
        if: env.ACTIVE == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: >-
          node scripts/ci/run-with-retry.mjs
          --attempts=3 --timeout-ms=30000 --label="mcp catalogue live check"
          -- node scripts/registry-snapshots/build-mcp-catalogue.mjs --check-online

      - name: Skip unaffected gate setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected type, lint, or documentation gate"

      - name: Upload lane report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-report-gates
          path: ci-lane-report.jsonl
          if-no-files-found: ignore
          retention-days: 90

  # The slowest job in PR CI and the only unsharded one: 437 s average and 705 s at
  # the tail over the last 20 runs (measured 2026-09-12), against an 8-minute budget
  # for the whole pull request. None of that was wasted work — the impact plan
  # already selects it — it was one runner doing all of it. Both Vitest invocations
  # take `--shard`, and `run-ci-lane.mjs` keeps whole-graph commands (`pnpm knip`)
  # on shard 1, where a third of the files would otherwise call two thirds of the
  # exports unused.
  #
  # Measured on the first real sharded run (34696960152): **179 s, 206 s and >244 s**
  # against the 437 s average it replaces. The third number is the correction — shard 1
  # carries `pnpm knip` on top of its share of the files, so it is not one third of the
  # job, and a budget of 180 s cancelled it at the 4-minute timeout. 260 s is the
  # measured cost of the widest shard, which is what a matrix's shared ceiling has to
  # cover. The aggregating job below refused to go green for the cancelled shard, which
  # is the whole reason it exists.
  #
  # Since 2026-11-18 `--shard` splits by measured seconds (`vitest-shard-sequencer.mjs`), not
  # file count: the full sweep had measured 271 s, 222 s and 186 s on the three runners.
  # Every run appends per-file costs to `vitest-timings.jsonl`; `pnpm unit:durations` folds a
  # full run's files into the weights. `pnpm knip` runs here only in full runs (after a merge,
  # nightly) or when the analyzer's own scope changed.
  unit:
    name: Unit · Contract ${{ matrix.shard }}/3
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 600s (310 s before the MCP program was built here; a full run's shard 1 also carries the
    # whole-graph commands; the cold build is not timed yet)
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_LANE_REPORT: ci-lane-report.jsonl
      ACTIVE: ${{ needs.plan.outputs.unit != 'skip' && (needs.plan.outputs.unit_sharded != 'false' || matrix.shard == 1) }}
      NEED_MCP: ${{ needs.plan.outputs.unit_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
      VITEST_TIMINGS_FILE: ${{ github.workspace }}/vitest-timings.jsonl
      # Ratchets compare with this commit. On a push to main the merge base with origin/main is
      # HEAD itself, which would let any count pass, so a push compares with the previous tip.
      DECISION_BASE_REF: ${{ github.event_name == 'push' && github.event.before || needs.plan.outputs.base }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      # Contract tests start the server through `mcp/src/index.js`, which starts this Rust program.
      - name: Cache Rust build
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build the MCP program
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm mcp:build-binary -- --skip-verify

      - name: Run affected unit and contract evidence (shard ${{ matrix.shard }}/3)
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PLAN_BASE: ${{ needs.plan.outputs.base }}
        run: node scripts/ci/run-ci-lane.mjs --lane=unit --base="${PLAN_BASE:-${PUSH_BEFORE:-origin/$BASE_REF}}" --shard=${{ matrix.shard }}/3

      - name: Skip unaffected unit setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected unit or contract evidence"

      # The Vitest files in tests/quarantine.json, which the lane above leaves out, run each night
      # and print passed or failed per file without failing the night.
      - name: Run the quarantined unit files
        if: ${{ !cancelled() && env.ACTIVE == 'true' && matrix.shard == 1 && github.event_name == 'schedule' }}
        continue-on-error: true
        run: node scripts/ci/quarantine.mjs run-unit

      - name: Upload lane report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-report-unit-${{ matrix.shard }}
          path: ci-lane-report.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload per-file timings
        continue-on-error: true
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vitest-timings-${{ matrix.shard }}
          path: vitest-timings.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # The measurement files (the Vitest `perf` project), alone on a runner of
  # their own. Their verdicts are cached-against-naive ratios, and only the cached side pays for
  # company. Train #1928 (2026-09-26) read 9.25 against a bar of 10 on
  # the node-name-match ratio while the command sat last on Unit · Contract shard 1, after
  # `pnpm knip` and a third of the sweep, on a change that touched no matcher code; the defect
  # that gate guards reads 2.7-5.3. Its header says to move the lane, not the number, so the bar
  # stays at 10 and this job is the lane.
  #
  # It stays a gate without a context of its own: `Unit · Contract` below waits for it and fails
  # when it fails, and `Required checks` waits for that.
  #
  # Measured on that run: 25 s from runner start to the first lane command (checkout, Node,
  # install at 7.6 s) and 9.7 s for `pnpm test:perf`, so about 35 s alone.
  perf:
    name: Perf · Ratios
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 120s
    timeout-minutes: 3
    env:
      CI_LANE_REPORT: ci-lane-report.jsonl
      ACTIVE: ${{ needs.plan.outputs.perf != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run the performance ratios on their own runner
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          PLAN_BASE: ${{ needs.plan.outputs.base }}
        run: node scripts/ci/run-ci-lane.mjs --lane=perf --base="${PLAN_BASE:-${PUSH_BEFORE:-origin/$BASE_REF}}"

      - name: Skip unaffected performance setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No changed module can reach a performance ratio"

      - name: Upload lane report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-report-perf
          path: ci-lane-report.jsonl
          if-no-files-found: ignore
          retention-days: 90

  # `Unit · Contract` was a required status context on `main` before `Required checks`, and
  # stays one until branch protection names that job alone. Sharding renamed it to three, and a
  # required context that never reports again blocks every merge forever, so the name stays
  # and this job carries it: it passes only if every shard did, and
  # `tests/contract/ci-gates/workflow-budgets.contract.test.ts` asserts each required name still
  # resolves to a real job.
  #
  # The sharded job keeps the key `unit`, not the name, because
  # `dead-code-gate-wiring` and `mcp-source-ci-deps` locate the job that installs and
  # executes by that key. Both would otherwise have read this aggregator's empty step
  # list as "the unit lane lost its MCP install".
  unit-required:
    name: Unit · Contract
    needs: [plan, unit, perf]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 10s
    timeout-minutes: 2
    steps:
      - name: Require every shard
        env:
          SHARDS: ${{ needs.unit.result }}
          PERF: ${{ needs.perf.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
            exit 1
          fi
          # A matrix `needs` result is `success` only when every leg succeeded.
          if [ "$SHARDS" != "success" ]; then
            echo "::error::a Unit · Contract shard reported $SHARDS"
            exit 1
          fi
          # The performance ratios run on their own runner, and this required context carries
          # their verdict so a train cannot settle before they report.
          if [ "$PERF" != "success" ]; then
            echo "::error::Perf · Ratios reported $PERF"
            exit 1
          fi
          echo "all three Unit · Contract shards and Perf · Ratios passed"

  # The one context `main` requires. Branch protection names this job, so a lane added, split or
  # renamed here needs no settings edit. It needs `success` from each lane, not "not failed": a
  # skipped or cancelled lane is not a pass.
  required:
    name: Required checks
    needs: [plan, gates, unit-required, mcp]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 10s
    timeout-minutes: 2
    steps:
      - name: Require every lane
        env:
          PLAN: ${{ needs.plan.result }}
          GATES: ${{ needs.gates.result }}
          UNIT: ${{ needs.unit-required.result }}
          MCP: ${{ needs.mcp.result }}
        run: |
          red=0
          for lane in "Check impact plan=$PLAN" "Types · Lint · Docs=$GATES" "Unit · Contract=$UNIT" "MCP=$MCP"; do
            if [ "${lane#*=}" != "success" ]; then
              echo "::error::${lane%%=*} reported ${lane#*=}"
              red=1
            fi
          done
          if [ "$red" -ne 0 ]; then exit 1; fi
          echo "the impact plan, Types · Lint · Docs, Unit · Contract and MCP passed"

  mcp:
    name: MCP
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 700s (390 s before the MCP program was built here; the cold build is not timed yet)
    timeout-minutes: 14
    env:
      CI_LANE_REPORT: ci-lane-report.jsonl
      ACTIVE: ${{ needs.plan.outputs.mcp != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      # Contract tests start the server through `mcp/src/index.js`, which starts this Rust program.
      - name: Cache Rust build
        if: env.ACTIVE == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri

      - name: Build the MCP program
        if: env.ACTIVE == 'true'
        run: pnpm mcp:build-binary -- --skip-verify

      - name: Run affected MCP and CLI boundary evidence
        if: env.ACTIVE == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=mcp

      - name: Skip unaffected MCP setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "MCP and CLI boundaries are untouched — skipped both dependency trees and tests"

      - name: Upload lane report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-lane-report-mcp
          path: ci-lane-report.jsonl
          if-no-files-found: ignore
          retention-days: 90

  # ── The Windows install canary ────────────────────────────────────────────────
  #
  # **Why it lives here and not in `windows-beta-check.yml`** (2026-09-13). A trigger is
  # workflow-scoped and `paths` is a trigger-level filter: GitHub offers no per-job path
  # condition. Putting an unfiltered job in that file would mean deleting its `push` paths
  # list, which would run its 17-minute native build on every merge — exactly what #834's
  # measurement forbids (that PR fired the 12-minute job five times, 60 minutes, for a
  # one-line `package.json` change). This workflow already carries an unfiltered
  # `push: main`, so the canary costs no new trigger and that file stays untouched.
  #
  # **What it is the canary for: any change can break `pnpm install`.** That is why it
  # carries no path filter. `windows-beta-check.yml` is path-filtered by design and
  # deliberately excludes `package.json` and `pnpm-lock.yaml`, so it is blind to this
  # class. Measured: the records migration froze three ledgers and hashed their raw bytes,
  # a Windows checkout hands them back as CRLF, and `prepare` failed inside
  # `pnpm install` — reached only on release day, twice, because no cheap Windows lane
  # spoke after a merge.
  #
  # It runs after a merge, not on a pull request, because it is a canary rather than a
  # gate: `pnpm pr:land` now refuses on any failing check, required or not, so a red
  # canary on `main` stops the next landing without spending Windows minutes per PR.
  # It stays non-required, so no merge-group build waits on it.
  #
  # The `draft == false` clause is vacuous for `push` and `workflow_dispatch` — neither
  # event carries a pull request — and is written because
  # `tests/contract/security/workflow-security.contract.test.ts` holds that every job in a
  # workflow with a `pull_request` trigger names the draft guard.
  install-windows-canary:
    name: Windows install canary
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.pull_request.draft == false }}
    runs-on: windows-2022
    # budget: 60s
    # Measured, replacing the 100 s that was derived before this job had run. Its three
    # successful runs on `main` took 47 s, 48 s and 50 s; `pnpm install --frozen-lockfile`
    # is 17 s of that. Three samples is not a p95 and is not called one — 60 s is the
    # observed 50 s maximum plus room for a slower runner, and the next few runs should
    # tighten or widen it. The earlier 100 s was wrong in a specific way worth keeping:
    # it assumed a 22 s checkout from the release workflow's Windows job, and this job's
    # checkout is 8 s, because that job checks out submodules and build inputs this one
    # does not need. A derived budget inherits the shape of whatever it was derived from.
    # `timeout-minutes` stays 2: GitHub's granularity is whole minutes, and
    # `workflow-budgets.contract.test.ts` allows up to max(1.5x budget, 120 s).
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version

      # The whole point: `prepare` runs here, and `prepare` composes the ledgers.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These readers parse authored Markdown, which is what a CRLF checkout changes.
      # They need no dependency tree of their own, so they cost seconds.
      - name: Ledger readers on a native CRLF checkout
        run: node --test scripts/lib/records/record-ledgers.test.mjs scripts/lib/records/changelog-entry-template.test.mjs scripts/records/decisions-find.test.mjs scripts/lib/records/po-pilot-records.test.mjs

      - name: Compose the changelog and the decision ledger
        run: |
          pnpm changelog:check
          pnpm decisions:check
