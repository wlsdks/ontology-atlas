# PR checks are impact-planned before any dependency install. The exact required
# status names stay stable; inactive lanes start, explain the skip, and finish in
# seconds. A missing plan is RED. Pushes to main and planner changes run every
# command registered in `scripts/classify-change.mjs`.
name: Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Check impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      gates: ${{ steps.impact.outputs.gates }}
      gates_needs_mcp: ${{ steps.impact.outputs.gates_needs_mcp }}
      unit: ${{ steps.impact.outputs.unit }}
      unit_needs_mcp: ${{ steps.impact.outputs.unit_needs_mcp }}
      mcp: ${{ steps.impact.outputs.mcp }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/classify-change.mjs --event="$EVENT_NAME" --base="origin/$BASE_REF"

  gates:
    name: Types · Lint · Docs
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE: ${{ needs.plan.outputs.gates }}
      NEED_MCP: ${{ needs.plan.outputs.gates_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run planned type, lint, and documentation gates
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/run-ci-lane.mjs --lane=gates --base="origin/$BASE_REF"

      - name: Skip unaffected gate setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected type, lint, or documentation gate"

  unit:
    name: Unit · Contract
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE: ${{ needs.plan.outputs.unit != 'skip' }}
      NEED_MCP: ${{ needs.plan.outputs.unit_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run affected unit and contract evidence
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/run-ci-lane.mjs --lane=unit --base="origin/$BASE_REF"

      - name: Skip unaffected unit setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected unit or contract evidence"

  mcp:
    name: MCP
    needs: plan
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVE: ${{ needs.plan.outputs.mcp != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run affected MCP and CLI boundary evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=mcp

      - name: Skip unaffected MCP setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "MCP and CLI boundaries are untouched — skipped both dependency trees and tests"
