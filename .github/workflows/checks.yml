# PR checks are impact-planned before any dependency install. The exact required
# status names stay stable; inactive lanes start, explain the skip, and finish in
# seconds. A missing plan is RED. Pushes to main and planner changes run every
# command registered in `scripts/classify-change.mjs`.
#
# A pull request is opened as a **draft** and runs nothing. When it is that
# branch's turn, `pnpm pr:land` merges today's main into it, runs the local
# lanes, and marks it ready; `ready_for_review` fires this workflow **once**, on
# exactly the tree that is about to land. Owner's shape, 2026-09-12: most
# changes overlap, so CI on a branch that is not yet the thing being merged is a
# round paid twice. `docs/DECISIONS.md` carries the record.
#
# `merge_group` is wired for the day this repository belongs to an organization
# and GitHub's own merge queue becomes available. Until then no merge group is
# ever created, so the trigger is inert rather than wrong.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Check impact plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # budget: 25s
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      gates: ${{ steps.impact.outputs.gates }}
      gates_needs_mcp: ${{ steps.impact.outputs.gates_needs_mcp }}
      unit: ${{ steps.impact.outputs.unit }}
      unit_needs_mcp: ${{ steps.impact.outputs.unit_needs_mcp }}
      mcp: ${{ steps.impact.outputs.mcp }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          # A merge group has no base branch ref, and its two SHAs are minted by
          # GitHub, so they are data rather than a string anyone can choose.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node scripts/classify-change.mjs --event="$EVENT_NAME" --base="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"

  gates:
    name: Types · Lint · Docs
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 240s
    timeout-minutes: 6
    env:
      ACTIVE: ${{ needs.plan.outputs.gates }}
      NEED_MCP: ${{ needs.plan.outputs.gates_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run planned type, lint, and documentation gates
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/run-ci-lane.mjs --lane=gates --base="origin/$BASE_REF"

      - name: Skip unaffected gate setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected type, lint, or documentation gate"

  # The slowest job in PR CI and the only unsharded one: 437 s average and 705 s at
  # the tail over the last 20 runs (measured 2026-09-12), against an 8-minute budget
  # for the whole pull request. None of that was wasted work — the impact plan
  # already selects it — it was one runner doing all of it. Both Vitest invocations
  # take `--shard`, and `run-ci-lane.mjs` keeps whole-graph commands (`pnpm knip`)
  # on shard 1, where a third of the files would otherwise call two thirds of the
  # exports unused.
  unit:
    name: Unit · Contract ${{ matrix.shard }}/3
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 180s
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ACTIVE: ${{ needs.plan.outputs.unit != 'skip' }}
      NEED_MCP: ${{ needs.plan.outputs.unit_needs_mcp }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true' && env.NEED_MCP == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run affected unit and contract evidence (shard ${{ matrix.shard }}/3)
        if: env.ACTIVE == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/run-ci-lane.mjs --lane=unit --base="origin/$BASE_REF" --shard=${{ matrix.shard }}/3

      - name: Skip unaffected unit setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "No affected unit or contract evidence"

  # `Unit · Contract` is one of the eight required status contexts on `main`. Sharding
  # renamed it to three, and a required context that never reports again blocks every
  # merge forever — `pnpm pr:land`'s own falsifier names "a landing that merges while a
  # required context reads skipped". Rather than edit branch protection, the name stays
  # and this job carries it: it passes only if every shard did, so the required context
  # means exactly what it meant before, and `tests/contract/workflow-budgets.contract.test.ts`
  # asserts each required name still resolves to a real job.
  #
  # The sharded job keeps the key `unit`, not the name, because
  # `dead-code-gate-wiring` and `mcp-source-ci-deps` locate the job that installs and
  # executes by that key. Both would otherwise have read this aggregator's empty step
  # list as "the unit lane lost its MCP install".
  unit-required:
    name: Unit · Contract
    needs: [plan, unit]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 10s
    timeout-minutes: 2
    steps:
      - name: Require every shard
        env:
          SHARDS: ${{ needs.unit.result }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
            exit 1
          fi
          # A matrix `needs` result is `success` only when every leg succeeded.
          if [ "$SHARDS" != "success" ]; then
            echo "::error::a Unit · Contract shard reported $SHARDS"
            exit 1
          fi
          echo "all three Unit · Contract shards passed"

  mcp:
    name: MCP
    needs: plan
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 390s
    timeout-minutes: 9
    env:
      ACTIVE: ${{ needs.plan.outputs.mcp != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.plan.result != 'success'
        run: |
          echo "::error::CI impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        if: env.ACTIVE == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Enable Corepack pnpm
        if: env.ACTIVE == 'true'
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version

      - name: Install dependencies
        if: env.ACTIVE == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install MCP dependencies
        if: env.ACTIVE == 'true'
        run: pnpm --dir mcp install --frozen-lockfile

      - name: Run affected MCP and CLI boundary evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=mcp

      - name: Skip unaffected MCP setup
        if: env.ACTIVE != 'true' && needs.plan.result == 'success'
        run: echo "MCP and CLI boundaries are untouched — skipped both dependency trees and tests"
