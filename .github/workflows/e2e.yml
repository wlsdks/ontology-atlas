# Browser CI uses the same impact plan as unit/MCP CI. Before merge a train runs
# the specs its change maps plus the merge smoke set (scripts/ci/merge-smoke-specs.mjs),
# balanced over every shard; an unmapped rendered dependency runs the smoke set alone.
# Only a planner, browser-executor or root dependency change runs the full suite before
# merge. Every push to main runs it in full after merge, even over a reused reviewed tree,
# measurements and both surfaces included, and `pnpm pr:land` names that run's failing
# specs while it is red (owner, 2026-11-18: merges took too long). Manual runs are full unless they name a base to plan from.
#
# A pull request is opened as a **draft** and runs nothing. `pnpm pr:land` puts
# it on a landing train built from today's main, and the train's pull request
# fires this workflow **once**, on exactly the tree that is about to land. Owner's shape, 2026-09-12: most
# changes overlap, so CI on a branch that is not yet the thing being merged is a
# round paid twice. An identical main tree reuses that successful review;
# unproven main pushes and scheduled/manual runs still execute their evidence.
#
# `merge_group` is wired for the day this repository belongs to an organization
# and GitHub's own merge queue becomes available. Until then no merge group is
# ever created, so the trigger is inert rather than wrong.
name: E2E smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      plan_from:
        description: "Plan as a pull request against this commit SHA (rehearses a train); empty runs the full suite"
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read

# Every push to main gets a group of its own, so each merge's full run runs and is never cancelled:
# GitHub keeps one waiting run per group, and a shared group let a third merge replace the second's
# pending run. Pull requests and trains keep one group per ref and cancel the superseded run.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('full{0}', inputs.plan_from) || github.event_name == 'push' && format('push-{0}', github.run_id) || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUSH_BEFORE: ${{ github.event.before }}

jobs:
  changes:
    name: E2E impact plan
    permissions:
      contents: read
      checks: read
      pull-requests: read
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # budget: 35s
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      playwright: ${{ steps.impact.outputs.playwright }}
      static: ${{ steps.impact.outputs.static }}
      web: ${{ steps.impact.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          # A merge group has no base branch ref, and its two SHAs are minted by
          # GitHub, so they are data rather than a string anyone can choose.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PLAN_FROM: ${{ inputs.plan_from }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$PLAN_FROM" ]; then
            if ! printf '%s' "$PLAN_FROM" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::plan_from must be a full commit SHA"
              exit 1
            fi
            EVENT_NAME=pull_request
            BASE_REF=
            MERGE_GROUP_BASE_SHA=$PLAN_FROM
          fi
          node scripts/ci/classify-change.mjs --event="$EVENT_NAME" --base="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}" --full-browser-after-merge

  build:
    name: Build browser artifact
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.outputs.playwright != 'skip' || needs.changes.outputs.static == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # budget: 120s
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once
        run: pnpm build
        env:
          # `pnpm typecheck` in Checks owns types for this tree (next.config.ts).
          ATLAS_BUILD_SKIP_TYPECHECK: "1"
      - name: Pack static export
        run: tar -czf "$RUNNER_TEMP/playwright-export.tgz" out
      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}/playwright-export.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  static-export:
    name: Playwright (static export)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 150s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.static }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run static-export evidence
        if: env.ACTIVE == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=static
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "Static-export-only behavior is untouched"

      - name: Upload failure evidence or retry traces
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-static-export
          path: ${{ job.status == 'failure' && 'output/playwright' || 'output/playwright/**/trace.zip' }}
          if-no-files-found: ignore
          retention-days: 7

  web-smoke:
    name: Playwright (web surface)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 160s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.web }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run web-surface evidence
        if: env.ACTIVE == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=web
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "The unattended web gateway is untouched"

      - name: Upload failure evidence or retry traces
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-web-smoke
          path: ${{ job.status == 'failure' && 'output/playwright' || 'output/playwright/**/trace.zip' }}
          if-no-files-found: ignore
          retention-days: 7

  # Eight runners, not more workers. A runner here has four vCPUs, but the suite is
  # CPU-bound: on the same four cores (2026-09-27) four workers ran a 129-test sample
  # in 219 s against two workers' 242 s, because each test took 44% longer. Machines
  # scale; workers on one machine do not, and a public repository's standard runners
  # are free. A full run (2026-11-18, about 4,600 test-seconds) took 13.8 minutes from
  # start to the last shard on five shards (7.6 to 12.3 minutes per shard) and 9.4 on
  # eight (6.0 to 7.9). One train peaks near 17 jobs at once (8 shards, web surface, six
  # Checks jobs, Windows), inside the account's 20; a second train in flight or main's
  # full run beside it queues instead.
  suite:
    name: Playwright (chromium ${{ matrix.shard }}/8)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 600s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ACTIVE: ${{ needs.changes.outputs.playwright != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run browser evidence (shard ${{ matrix.shard }}/8)
        if: env.ACTIVE == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=e2e --shard=${{ matrix.shard }}/8
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "No browser evidence assigned to this shard"

      - name: Upload failure evidence or retry traces
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: ${{ job.status == 'failure' && 'output/playwright' || 'output/playwright/**/trace.zip' }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload timing evidence
        continue-on-error: true
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The plan's mode is in the name: `pnpm pr:land` reads main's latest full run by it.
          name: playwright-timings-${{ needs.changes.outputs.playwright }}-${{ matrix.shard }}
          path: |
            output/playwright/assignment-*.json
            output/playwright/results-*.json
          retention-days: 7

  # `Playwright (chromium 1/3)`, `2/3` and `3/3` are required status contexts on `main`,
  # and a required context that never reports again blocks every merge. As with
  # `Unit · Contract` in checks.yml, the names stay and this job carries them: each leg
  # passes only if every browser shard did. Once branch protection names one context
  # for the suite, this collapses to a single leg.
  suite-required:
    name: Playwright (chromium ${{ matrix.shard }}/3)
    needs: [changes, suite]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 10s
    timeout-minutes: 2
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Require every browser shard
        env:
          PLAN: ${{ needs.changes.result }}
          SHARDS: ${{ needs.suite.result }}
        run: |
          if [ "$PLAN" != "success" ]; then
            echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
            exit 1
          fi
          # A matrix `needs` result is `success` only when every leg succeeded.
          if [ "$SHARDS" != "success" ]; then
            echo "::error::a Playwright (chromium) shard reported $SHARDS"
            exit 1
          fi
          echo "all eight Playwright (chromium) shards passed"
