# Browser CI uses the same impact plan as unit/MCP CI. Exact source-to-spec
# mappings run on shard 1 only; unmapped rendered dependencies fail closed to
# the three-shard PR smoke project. Scheduled/manual runs and planner changes run every project.
#
# A pull request is opened as a **draft** and runs nothing. When it is that
# branch's turn, `pnpm pr:land` merges today's main into it, runs the local
# lanes, and marks it ready; `ready_for_review` fires this workflow **once**, on
# exactly the tree that is about to land. Owner's shape, 2026-09-12: most
# changes overlap, so CI on a branch that is not yet the thing being merged is a
# round paid twice. `docs/DECISIONS.md` carries the record.
#
# `merge_group` is wired for the day this repository belongs to an organization
# and GitHub's own merge queue becomes available. Until then no merge group is
# ever created, so the trigger is inert rather than wrong.
name: E2E smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'change' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PUSH_BEFORE: ${{ github.event.before }}

jobs:
  changes:
    name: E2E impact plan
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # budget: 35s
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      playwright: ${{ steps.impact.outputs.playwright }}
      static: ${{ steps.impact.outputs.static }}
      web: ${{ steps.impact.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          # A merge group has no base branch ref, and its two SHAs are minted by
          # GitHub, so they are data rather than a string anyone can choose.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: node scripts/classify-change.mjs --event="$EVENT_NAME" --base="${MERGE_GROUP_BASE_SHA:-origin/$BASE_REF}"

  build:
    name: Build browser artifact
    needs: changes
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (needs.changes.outputs.playwright != 'skip' || needs.changes.outputs.static == 'true' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    # budget: 120s
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: corepack enable && corepack prepare pnpm@10.18.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once
        run: pnpm build
      - name: Pack static export
        run: tar -czf "$RUNNER_TEMP/playwright-export.tgz" out
      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}/playwright-export.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  static-export:
    name: Playwright (static export)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 150s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.static }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run static-export evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=static
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "Static-export-only behavior is untouched"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-static-export
          path: output/playwright
          retention-days: 1

  web-smoke:
    name: Playwright (web surface)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 160s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.web }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run web-surface evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=web
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "The unattended web gateway is untouched"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-web-smoke
          path: output/playwright
          retention-days: 1

  suite:
    name: Playwright (chromium ${{ matrix.shard }}/3)
    needs: [changes, build]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # budget: 600s (cache-hit p95; the cold path adds the bounded browser
    # install, whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ACTIVE: ${{ needs.changes.outputs.playwright == 'full' || needs.changes.outputs.playwright == 'smoke' || (needs.changes.outputs.playwright == 'targeted' && matrix.shard == 1) }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run browser evidence (shard ${{ matrix.shard }}/3)
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=e2e --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "No browser evidence assigned to this shard"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: output/playwright
          retention-days: 1

      - name: Upload timing evidence
        continue-on-error: true
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-timings-${{ matrix.shard }}
          path: |
            output/playwright/assignment-*.json
            output/playwright/results-*.json
          retention-days: 7
