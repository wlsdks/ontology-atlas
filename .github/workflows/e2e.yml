# The browser suite runs after merge, never on a pull request: nightly on `main`, on a release tag
# when `pnpm desktop:release-run` dispatches it, and on any branch an author dispatches by hand.
# Merging waits only for `Required checks` in checks.yml (owner, 2026-11-22).
#
# - A whole run (schedule, or a dispatch with an empty `plan_from`) runs every spec, both
#   surfaces, the quarantined specs and the quarantine expiry. Its title says so, and
#   `pnpm desktop:release-browser-gate` admits a stable release only over a green whole run on
#   that commit.
# - A dispatch naming `plan_from=<main sha>` plans like a pull request against that commit: the
#   mapped specs plus the merge smoke set (`scripts/ci/merge-smoke-specs.mjs`). That is the opt-in
#   for a change whose screens should be measured before it merges.
# - `pnpm pr:land` and every train body name the newest scheduled run's failing specs while it is
#   red (`scripts/lib/landing/pr-land/main-health.mjs`).
#
# The specs run on `macos-15`, the system the app ships on and authors run specs on, so a red night
# reproduces locally. The static export is built once on Linux and downloaded. A free account runs
# five macOS jobs at once: three shards, the surfaces and the quarantined specs.
name: Browser suite
run-name: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.plan_from == '')) && 'Browser suite: whole run' || '' }}

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      plan_from:
        description: "Plan as a pull request against this commit SHA; empty runs the whole suite"
        required: false
        default: ""

permissions:
  contents: read

# One group per ref and plan, never cancelled: a release gate reads the run on its exact commit, so
# a dispatch on a tag must finish even when another starts beside it.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ inputs.plan_from || 'whole' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: E2E impact plan
    permissions:
      contents: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    # budget: 35s
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      playwright: ${{ steps.impact.outputs.playwright }}
      static: ${{ steps.impact.outputs.static }}
      web: ${{ steps.impact.outputs.web }}
      quarantined: ${{ steps.quarantine.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PLAN_FROM: ${{ inputs.plan_from }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ -n "$PLAN_FROM" ]; then
            if ! printf '%s' "$PLAN_FROM" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::plan_from must be a full commit SHA"
              exit 1
            fi
            node scripts/ci/classify-change.mjs --event=pull_request --base="$PLAN_FROM"
          else
            node scripts/ci/classify-change.mjs --event="$EVENT_NAME"
          fi

      - name: Count quarantined specs
        id: quarantine
        run: node --input-type=module -e "import { quarantinedBrowserSpecs, readQuarantine } from './scripts/lib/ci/quarantine.mjs'; console.log('browser=' + quarantinedBrowserSpecs(readQuarantine()).length)" >> "$GITHUB_OUTPUT"

  build:
    name: Build browser artifact
    needs: changes
    if: ${{ needs.changes.outputs.playwright != 'skip' || needs.changes.outputs.static == 'true' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    # budget: 120s
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: corepack enable && corepack prepare pnpm@10.34.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once
        run: pnpm build
        env:
          # `pnpm typecheck` in Checks owns types for this tree (next.config.ts).
          ATLAS_BUILD_SKIP_TYPECHECK: "1"
      - name: Pack static export
        run: tar -czf "$RUNNER_TEMP/playwright-export.tgz" out
      - name: Upload static export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}/playwright-export.tgz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # The two surfaces that name their own spec file, one after the other on one runner: each is a
  # single spec, and a runner of its own each would take a sixth macOS slot.
  surfaces:
    name: Browser surfaces (macOS)
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    # budget: 300s (cache-hit; the cold path adds the bounded browser install,
    # whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.static == 'true' || needs.changes.outputs.web == 'true' }}
      STATIC: ${{ needs.changes.outputs.static }}
      WEB: ${{ needs.changes.outputs.web }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run static-export evidence
        if: env.STATIC == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=static
        env:
          CI: true

      - name: Run web-surface evidence
        if: ${{ !cancelled() && env.WEB == 'true' }}
        run: node scripts/ci/run-ci-lane.mjs --lane=web
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "Neither the static export nor the web gateway is in this plan"

      - name: Upload failure evidence or retry traces
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-surfaces
          path: ${{ job.status == 'failure' && 'output/playwright' || 'output/playwright/**/trace.zip' }}
          if-no-files-found: ignore
          retention-days: 7

  # Three shards of two workers each: a macos-15 runner has three cores, and the free account runs
  # five macOS jobs at once, which the shards, the surfaces and the quarantined specs fill.
  suite:
    name: Browser suite (macOS ${{ matrix.shard }}/3)
    needs: [changes, build]
    if: ${{ !cancelled() }}
    runs-on: macos-15
    # budget: 900s (cache-hit; the cold path adds the bounded browser install,
    # whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ACTIVE: ${{ needs.changes.outputs.playwright != 'skip' }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
      PLAYWRIGHT_PREBUILT: "1"
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Require browser artifact
        if: env.ACTIVE == 'true' && needs.build.result != 'success'
        run: exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        if: env.ACTIVE == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        if: env.ACTIVE == 'true'
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run browser evidence (shard ${{ matrix.shard }}/3)
        if: env.ACTIVE == 'true'
        run: node scripts/ci/run-ci-lane.mjs --lane=e2e --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "No browser evidence assigned to this shard"

      - name: Upload failure evidence or retry traces
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: ${{ job.status == 'failure' && 'output/playwright' || 'output/playwright/**/trace.zip' }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload timing evidence
        continue-on-error: true
        if: always() && env.ACTIVE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The plan's mode is in the name: `pnpm pr:land` and the release gate read a whole run by it.
          name: playwright-timings-${{ needs.changes.outputs.playwright }}-${{ matrix.shard }}
          path: |
            output/playwright/assignment-*.json
            output/playwright/results-*.json
          retention-days: 7

  # The files in tests/quarantine.json, which every other job leaves out. They run every whole night
  # and print passed or failed per file; the job never turns the run red.
  quarantined:
    name: Quarantined specs
    needs: [changes, build]
    if: ${{ !cancelled() && needs.changes.outputs.playwright == 'full' && needs.changes.outputs.quarantined != '0' && needs.build.result == 'success' }}
    runs-on: macos-15
    continue-on-error: true
    # budget: 600s (cache-hit; the cold path adds the bounded browser install,
    # whose 12-minute worst case ci-bounded-network.contract.test.ts owns)
    timeout-minutes: 30
    env:
      PLAYWRIGHT_PREBUILT: "1"
      PLAYWRIGHT_STATIC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download static export
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: playwright-export-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: Unpack static export
        run: tar -xzf "$RUNNER_TEMP/playwright-export.tgz"

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run the quarantined specs
        run: node scripts/ci/quarantine.mjs run-browser
        env:
          CI: true

      - name: Upload quarantine results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quarantine-browser-results
          path: output/quarantine/browser-results.json
          if-no-files-found: ignore
          retention-days: 14

  # An entry past its `expires` day turns the whole run red and names the entry, so the release gate
  # refuses and `pnpm pr:land` prints it. No landing lane reads the date.
  quarantine-expiry:
    name: Quarantine expiry
    needs: changes
    if: ${{ needs.changes.outputs.playwright == 'full' }}
    runs-on: ubuntu-latest
    # budget: 20s
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Check every quarantine entry is inside its 14 days
        run: node scripts/ci/quarantine.mjs check-expiry
