# E2E — Playwright (chromium).
#
# ## Why five jobs instead of one (2026-08-02)
#
# This file was written in 2026-07 with the note *"the suite is small enough to run
# as a single job without sharding."* That premise is outdated — measured data (step times for the longest successful run):
#
# | Step | Tests | Duration |
# |---|---|---|
# | Static export (workshop nav) | 5 | 49s |
# | Web smoke | 10 | 46s |
# | **Full suite** | **150** | **448s** (boot 22s + run 426s) |
#
# All three ran sequentially in one job for 543s.
#
# **Increase runners, not workers.** `workers: 1` and `fullyParallel: false` in
# `playwright.config.ts` are not preferences but answers to the timing vulnerability
# of dev (Turbopack) cold starts (see the `retries` comment in the same file — on-demand
# recompilation causes sporadic failures). Increasing workers **increases concurrent requests
# to a single dev server**, exactly amplifying that vulnerability. Sharding is different:
# each shard gets its own runner and dev server, so **concurrency per server remains 1**,
# and only wall-clock time is divided.
#
# Math: fixed cost per shard is boot 22s + setup 36s ≈ 58s. Dividing 150 tests by N shards
# gives 58 + 426/N seconds per shard. For N=3 it is 200s, for N=4 it is 165s, for N=5 it is 143s —
# **due to fixed costs, returns diminish quickly.** Choose 3 (543 → 200s, 63% reduction).
# If there is a reason to slice finer later, just extend the `shard` array and update `/3` accordingly.
#
# The five jobs do not wait for each other — the classification (`classify-change.mjs`) script
# uses only node built-ins, so running it separately per job costs 0s. If you group front-end jobs
# with `needs:`, that job's setup time serializes in front of the whole thing.
name: E2E smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Static export only layer — cannot catch with dev ──────────────────────────
  #
  # Measured 2026-07-28: same-route navigation in the workshop (browse · create transition)
  # was crashing only in production builds. `router.push` with the same path but different
  # query parameters becomes a no-op at the routing level, and dev succeeds for both with
  # the same code — **dev has zero diagnostic power for this defect.** Since the rest of the
  # suite targets dev, without this job, regressions of this class would pass green forever.
  static-export:
    name: Playwright (static export)
    runs-on: ubuntu-latest
    # It was 20 minutes. Measured (2026-08-19): passing shards already take 12–17 minutes,
    # leaving only a 3-minute margin, and if the setup step retries even once, a «slow but normal
    # run» falls off the cliff. The infinite wait for the setup step is now blocked by `run-with-retry`
    # (setup-playwright), so this value is no longer that safety net — increase it by the amount
    # needed for retries.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is required — change classification uses `git merge-base`. With a shallow clone,
      # the base cannot be found, opening "run all" and rendering the gate meaningless. Checkout cannot
      # be placed inside a composite action — local actions must already exist in the workspace to load.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        id: setup

      - name: Static export e2e (studio navigation)
        if: >-
          steps.setup.outputs.runtime == 'true'
          || steps.setup.outputs.browser == 'true'
          || github.event_name != 'pull_request'
        run: pnpm test:e2e:static
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-static-export
          path: output/playwright/test-results
          retention-days: 1

  # ── Web smoke — the place the classifier cannot turn off ────────────────────────────────
  #
  # After surface separation (`docs/DECISIONS.md`) on 2026-07-27, the web no longer follows the app,
  # and owners only use the app. In other words, the web is an **unmanned surface** but the only
  # entry point. If it shares conditions with the rest of the suite (browser), changes touching
  # only the desktop bridge (`src-tauri/**`) merge without ever seeing the web — that is exactly
  # the rot this gate was built to block. So widen the condition: **if shipped code changes (runtime),
  # it always runs**, and on main push, it always runs even if the classifier cannot find a comparison base.
  web-smoke:
    name: Playwright (web surface)
    runs-on: ubuntu-latest
    # It was 20 minutes. Measured (2026-08-19): passing shards already take 12–17 minutes,
    # leaving only a 3-minute margin, and if the setup step retries even once, a «slow but normal
    # run» falls off the cliff. The infinite wait for the setup step is now blocked by `run-with-retry`
    # (setup-playwright), so this value is no longer that safety net — increase it by the amount
    # needed for retries.
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 is required — change classification uses `git merge-base`. With a shallow clone,
      # the base cannot be found, opening "run all" and rendering the gate meaningless. Checkout cannot
      # be placed inside a composite action — local actions must already exist in the workspace to load.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        id: setup

      # The deployed web is the static export (deploy-pages) — smoke also targets it.
      # When targeting dev, on-demand compilation took dozens of seconds for the first request.
      - name: Web surface smoke
        if: >-
          steps.setup.outputs.runtime == 'true'
          || steps.setup.outputs.browser == 'true'
          || github.event_name != 'pull_request'
        run: pnpm build && PLAYWRIGHT_STATIC=1 pnpm exec playwright test tests/e2e/web-surface-smoke.spec.ts
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-web-smoke
          path: output/playwright/test-results
          retention-days: 1

  # ── Suite — 3 shards. PR gets gate (smoke) only, main push gets all ─────────
  #
  # Measured 2026-08-21: when running the full spec per PR, one shard took 13 minutes,
  # and of the serial full measured 16.8 minutes, 7.8 minutes (47%) was **instrumentation sweep**
  # (frame/motion sample collection · previous route×previous width matrix instrumentation) across
  # 19 files. This class rarely changes the prescription, and defects are caught identically in
  # post-merge main runs. All specs shaken that day were of this class. So we split them — the
  # boundary's canonical source and evidence is a single file `tests/e2e/post-merge-specs.ts`,
  # and wiring monitoring is handled by `tests/contract/e2e-suite-split.contract.test.ts`.
  #
  # Triggers that actually run deferred tests: ① main push (= immediately after merge, the push branch below
  # runs all without project filters) ② PRs touching e2e infrastructure (classify's `e2e` output —
  # a PR fixing specs sees its own red before merging).
  #
  # **CI targets built static export, not dev** (2026-08-21).
  # dev (Turbopack) compiles routes on the first request, so any spec hitting a route for the first
  # time paid that cost entirely — who bites is determined by shard configuration and execution order,
  # **causing different specs to die with a 30s timeout each run** (#1178 first run: dialog-responsive 32.6s ✘ etc., 2.0s ✓ running alone). Static export has no first-request cost, making time deterministic and diagnostic power higher (measured 2026-07-28:
  # workshop same-route navigation only crashed in export). Census of running all 350 full suite tests against static:
  # 0 failures · 0 flaky · serial 15.7 minutes (dev 16.8 minutes). Local default is still dev reuse —
  # this transition exists only in these two CI jobs.
  #
  # The full suite including the web smoke once more is intentional (~20s).
  # Jobs are split so that if the web breaks, you do not need to dig through logs; just seeing the job name tells you.
  #
  # Changes that do not affect rendered pages (agent brief · docs · workflows)
  # do not launch a browser. The job still ends green, so merge is not blocked —
  # only the step is skipped.
  suite:
    name: Playwright (chromium ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # It was 20 minutes. Measured (2026-08-19): passing shards already take 12–17 minutes,
    # leaving only a 3-minute margin, and if the setup step retries even once, a «slow but normal
    # run» falls off the cliff. The infinite wait for the setup step is now blocked by `run-with-retry`
    # (setup-playwright), so this value is no longer that safety net — increase it by the amount
    # needed for retries.
    timeout-minutes: 30
    strategy:
      # Even if one shard turns red, the rest run to completion — telling about only one defect at a time
      # makes verification round-trip. This is the same reason for using `if: always()` inside the job.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # fetch-depth: 0 is required — change classification uses `git merge-base`. With a shallow clone,
      # the base cannot be found, opening "run all" and rendering the gate meaningless. Checkout cannot
      # be placed inside a composite action — local actions must already exist in the workspace to load.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-playwright
        id: setup

      # PR gets PR gate (smoke) only — except PRs fixing e2e infrastructure itself and main
      # pushes run all (smoke + post-merge) without project filters.
      #
      # ⚠️ Project selection is in env, not run. Initially I wrote the expression on two lines
      # inside the folding scalar (>-) of run, but **continuously indented lines do not fold
      # and remain literal lines** due to YAML rules — so the script became two lines —
      # 1 line ran all without shards and 2 lines `--shard=…` died with exit 127,
      # causing three shards each to run all 348 tests for 27 minutes and still turn red (#1178 first run
      # measured). env values are single-line expressions, so this trap is avoided.
      - name: Run Playwright suite (shard ${{ matrix.shard }}/3)
        if: steps.setup.outputs.browser == 'true'
        run: pnpm build && PLAYWRIGHT_STATIC=1 pnpm exec playwright test $PLAYWRIGHT_PROJECT_ARGS --shard=${{ matrix.shard }}/3
        env:
          CI: true
          PLAYWRIGHT_PROJECT_ARGS: ${{ (github.event_name == 'pull_request' && steps.setup.outputs.e2e != 'true') && '--project=smoke' || '' }}

      - name: Skip note
        if: steps.setup.outputs.browser != 'true'
        run: echo "브라우저가 의존하는 경로 변경 없음 — 전체 Playwright 생략(웹 스모크는 별도 잡에서 판정)"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: output/playwright/test-results
          retention-days: 1
