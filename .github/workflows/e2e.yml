# Browser CI uses the same impact plan as unit/MCP CI. Exact source-to-spec
# mappings run on shard 1 only; unmapped rendered dependencies fail closed to
# the three-shard PR smoke project. Main and planner changes run every project.
name: E2E smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: E2E impact plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.impact.outputs.plan }}
      playwright: ${{ steps.impact.outputs.playwright }}
      static: ${{ steps.impact.outputs.static }}
      web: ${{ steps.impact.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Build impact plan
        id: impact
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/classify-change.mjs --event="$EVENT_NAME" --base="origin/$BASE_REF"

  static-export:
    name: Playwright (static export)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.static }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run static-export evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=static
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "Static-export-only behavior is untouched"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-static-export
          path: output/playwright/test-results
          retention-days: 1

  web-smoke:
    name: Playwright (web surface)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACTIVE: ${{ needs.changes.outputs.web }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run web-surface evidence
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=web
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "The unattended web gateway is untouched"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-web-smoke
          path: output/playwright/test-results
          retention-days: 1

  suite:
    name: Playwright (chromium ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ACTIVE: ${{ needs.changes.outputs.playwright == 'full' || needs.changes.outputs.playwright == 'smoke' || (needs.changes.outputs.playwright == 'targeted' && matrix.shard == 1) }}
      CI_IMPACT_PLAN: ${{ needs.changes.outputs.plan }}
    steps:
      - name: Require impact plan
        if: needs.changes.result != 'success'
        run: |
          echo "::error::E2E impact planning failed; refusing to turn a missing verdict into green"
          exit 1

      - name: Checkout
        if: env.ACTIVE == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Playwright
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run browser evidence (shard ${{ matrix.shard }}/3)
        if: env.ACTIVE == 'true'
        run: node scripts/run-ci-lane.mjs --lane=e2e --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Skip unaffected Playwright setup
        if: env.ACTIVE != 'true' && needs.changes.result == 'success'
        run: echo "No browser evidence assigned to this shard"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: output/playwright/test-results
          retention-days: 1
