# GitHub Pages — the sole web host for the static export, served at the
# ontologyatlas.com custom-domain root. Firebase Hosting was removed (2026-07); Pages has no
# daily transfer hard-cap, so the read-only demo stays up under traffic spikes.
# Triggers on push to main, on GitHub Release publication, and on manual
# dispatch.
#
# ⚠️ `release: published` **only fires when a person publishes via the UI**. Events
# triggered by the default `GITHUB_TOKEN` do not create new runs (GitHub recursion prevention),
# so this trigger does not run in the normal path where `release-macos.yml` publishes.
# That workflow uploads tag-scoped release facts instead of mutating protected `main`.
# A local operator lands the generated file through a normal PR; that merge's `main`
# push wakes this workflow. This workflow only does `pnpm build` — the size and SHA-256
# of `/download` come from the committed `macos-release.generated.ts`.
# (Measured 2026-07-29: immediately after publishing rc.3, the page continued advertising rc.2.)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_BASE_URL: https://ontologyatlas.com
  PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required — `pnpm build` regenerates the document
      # manifest via `docs-vault:build` and reads the "last changed date" per document
      # from git history. With a shallow clone, the only commit is treated as root,
      # so all documents receive the same date, flattening the freshness lens of the
      # deployed site entirely.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build static export for the custom-domain root
        run: pnpm build
        env:
          # Search Console ownership verification code — retrieved from repository Variables
          # (Settings → Secrets and variables → Actions → Variables).
          #
          # It is not a secret but a **value that goes out as a public tag**, so it belongs
          # in Variables, not Secrets. However, since this is also not true for this repository,
          # it is not hardcoded — if our code were embedded in a fork's site, it would block
          # that side's console registration. If unset, `app/layout.tsx` does not emit the tag.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - name: Stage the newest published updater manifest
        run: pnpm desktop:stage-hosted-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_TAG: ${{ env.PUBLISHED_RELEASE_TAG }}
      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-hosted:
    name: Verify hosted download surface
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted download surface
        run: pnpm desktop:verify-hosted -- --base-url="$PAGES_BASE_URL"
      - name: Verify published release download assets
        if: env.PUBLISHED_RELEASE_TAG != ''
        run: pnpm desktop:verify-download -- --tag="$PUBLISHED_RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Summarize hosted download deployment
        run: |
          {
            echo "## Hosted Download Site"
            echo ""
            echo "Public URL: ${PAGES_BASE_URL}"
            echo ""
            echo "Verified routes:"
            echo "- ${PAGES_BASE_URL}/ko/"
            echo "- ${PAGES_BASE_URL}/ko/download/"
            echo ""
            if [ -n "$PUBLISHED_RELEASE_TAG" ]; then
              echo "Verified release assets: ${PUBLISHED_RELEASE_TAG}"
            else
              echo "Verified release assets: skipped (no release tag supplied)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
