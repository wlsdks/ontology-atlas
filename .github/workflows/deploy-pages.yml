# GitHub Pages — the sole web host for the prerendered website, served at the
# ontologyatlas.com custom-domain root. Firebase Hosting was removed (2026-07); Pages has no
# daily transfer hard-cap, so the read-only demo stays up under traffic spikes.
# Triggers on push to main, on GitHub Release publication, and on manual
# dispatch.
#
# ⚠️ `release: published` **only fires when a person publishes via the UI**. Events
# triggered by the default `GITHUB_TOKEN` do not create new runs (GitHub recursion prevention),
# so this trigger does not run in the normal path where `release-macos.yml` publishes.
# That workflow uploads tag-scoped release facts instead of mutating protected `main`.
# A local operator lands the generated file through a normal PR; that merge's `main`
# push wakes this workflow. This workflow only does `pnpm build:site` — the size and SHA-256
# of `/download` come from the committed `macos-release.generated.ts`.
# (Measured 2026-07-29: immediately after publishing rc.3, the page continued advertising rc.2.)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_BASE_URL: https://ontologyatlas.com
  PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    # budget: 120s
    timeout-minutes: 3
    outputs:
      changed_urls: ${{ steps.changed.outputs.urls }}
    steps:
      # fetch-depth: 0 is required — `pnpm build:site` regenerates the document
      # manifest via `docs-vault:build` and reads the "last changed date" per document
      # from git history. With a shallow clone, the only commit is treated as root,
      # so all documents receive the same date, flattening the freshness lens of the
      # deployed site entirely.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build the website for the custom-domain root
        run: pnpm build:site
        env:
          # Search Console ownership verification code — retrieved from repository Variables
          # (Settings → Secrets and variables → Actions → Variables).
          #
          # It is not a secret but a **value that goes out as a public tag**, so it belongs
          # in Variables, not Secrets. However, since this is also not true for this repository,
          # it is not hardcoded — if our code were embedded in a fork's site, it would block
          # that side's console registration. If unset, the pages emit no tag.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - name: Check sitemap, canonicals and titles in the site folder
        run: pnpm seo:check
      # The updater feed is staged before the guard, so a feed error shows on its own line and a stop never leaves
      # a half-staged folder. GitHub Pages replaces the whole site in one artifact, so a stop holds the feed with
      # the site until the accepted list is amended; the guard stops only on a page that list does not name.
      - name: Stage the newest published updater manifest
        run: pnpm desktop:stage-hosted-updater
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_TAG: ${{ env.PUBLISHED_RELEASE_TAG }}
      # One fetch of the live site, before the deploy replaces it. While the live site is Next-built the first Vite
      # deploy stops unless every page it changes is on the criterion-3 gate report's accepted list; once the live
      # site is Vite-built the step only reports. Either way the pages whose visible text changed go to IndexNow.
      - name: Stop unless the first Vite deploy changes only accepted pages
        id: changed
        run: node scripts/web/first-vite-deploy-guard.mjs --out=out --base="$PAGES_BASE_URL" >> "$GITHUB_OUTPUT"
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # budget: 30s
    timeout-minutes: 2
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  # Bing (and ChatGPT search, which reads it), Naver, Yandex and Seznam recrawl the changed pages
  # within minutes; Google ignores IndexNow and reads the sitemap.
  indexnow:
    name: Tell IndexNow engines what changed
    needs: [build, deploy]
    # Only the site that owns the key: a fork's Pages must not submit this domain's URLs.
    if: github.repository == 'wlsdks/ontology-atlas' && needs.build.outputs.changed_urls != '' && needs.build.outputs.changed_urls != '[]'
    runs-on: ubuntu-latest
    # budget: 30s
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: scripts/web
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Submit the changed pages
        run: node scripts/web/indexnow.mjs submit --base="$PAGES_BASE_URL" --urls="$CHANGED_URLS"
        env:
          CHANGED_URLS: ${{ needs.build.outputs.changed_urls }}

  verify-hosted:
    name: Verify hosted download surface
    needs: deploy
    runs-on: ubuntu-latest
    # budget: 40s
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.9 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted download surface
        run: pnpm desktop:verify-hosted -- --base-url="$PAGES_BASE_URL"
      - name: Verify published release download assets
        if: env.PUBLISHED_RELEASE_TAG != ''
        run: pnpm desktop:verify-download -- --tag="$PUBLISHED_RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Summarize hosted download deployment
        run: |
          {
            echo "## Hosted Download Site"
            echo ""
            echo "Public URL: ${PAGES_BASE_URL}"
            echo ""
            echo "Verified routes:"
            echo "- ${PAGES_BASE_URL}/ko/"
            echo "- ${PAGES_BASE_URL}/ko/download/"
            echo ""
            if [ -n "$PUBLISHED_RELEASE_TAG" ]; then
              echo "Verified release assets: ${PUBLISHED_RELEASE_TAG}"
            else
              echo "Verified release assets: skipped (no release tag supplied)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
