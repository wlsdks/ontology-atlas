# GitHub Pages — the sole web host for the static export, served at the
# /ontology-atlas subpath. Firebase Hosting was removed (2026-07); Pages has no
# daily transfer hard-cap, so the read-only demo stays up under traffic spikes.
# Triggers on push to main, on GitHub Release publication, and on manual
# dispatch.
#
# ⚠️ `release: published` 는 **사람이 UI 로 게시할 때만** 발화한다. 기본
# `GITHUB_TOKEN` 이 일으킨 이벤트는 새 실행을 만들지 않으므로(GitHub 재귀 방지),
# `release-macos.yml` 이 게시하는 정상 경로에서는 이 트리거가 돌지 않는다.
# 그 경로는 publish job 이 스스로 `gh workflow run deploy-pages.yml` 로 깨운다.
# 그리고 이 워크플로는 `pnpm build` 만 한다 — `/download` 의 크기·SHA-256 은
# 커밋된 `macos-release.generated.ts` 에서 오고, 그 갱신도 publish job 의 일이다.
# (2026-07-29 실측: rc.3 게시 직후 페이지가 rc.2 를 계속 광고했다.)
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_BASE_URL: https://wlsdks.github.io/ontology-atlas
  PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 필수 — `pnpm build` 가 `docs-vault:build` 로 문서
      # 매니페스트를 다시 만들고, 문서별 "마지막으로 바뀐 날" 을 git 히스토리
      # 에서 읽는다. 얕은 클론에서는 유일한 커밋이 root 로 취급돼 문서 전부가
      # 같은 날짜를 받고, 배포된 사이트의 신선도 렌즈가 통째로 평평해진다.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build static export with base path
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ontology-atlas
          # 검색 콘솔 소유권 확인 코드 — 저장소 Variables 에서 받는다
          # (Settings → Secrets and variables → Actions → Variables).
          #
          # 비밀이 아니라 **공개 태그로 나가는 값**이라 Secrets 가 아니라
          # Variables 가 맞다. 다만 이 저장소의 사실도 아니어서 하드코딩하지
          # 않는다 — 포크한 사람의 사이트에 우리 코드가 박히면 그쪽 콘솔
          # 등록이 막힌다. 미설정이면 `app/layout.tsx` 가 태그 자체를 안 낸다.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
      - name: Adapt static PWA manifest to base path
        run: |
          test -f out/manifest.webmanifest
          node -e '
            const fs = require("fs");
            const p = "out/manifest.webmanifest";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const bp = "/ontology-atlas";
            for (const k of ["id", "scope", "start_url"]) {
              if (typeof m[k] === "string" && m[k].startsWith("/") && !m[k].startsWith(bp)) m[k] = bp + (m[k] === "/" ? "/" : m[k]);
            }
            for (const icon of m.icons ?? []) {
              if (icon.src?.startsWith("/") && !icon.src.startsWith(bp)) icon.src = bp + icon.src;
            }
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          '
      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-hosted:
    name: Verify hosted download surface
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted download surface
        run: pnpm desktop:verify-hosted -- --base-url="$PAGES_BASE_URL"
      - name: Verify published release download assets
        if: env.PUBLISHED_RELEASE_TAG != ''
        run: pnpm desktop:verify-download -- --tag="$PUBLISHED_RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Summarize hosted download deployment
        run: |
          {
            echo "## Hosted Download Site"
            echo ""
            echo "Public URL: ${PAGES_BASE_URL}"
            echo ""
            echo "Verified routes:"
            echo "- ${PAGES_BASE_URL}/ko/"
            echo "- ${PAGES_BASE_URL}/ko/download/"
            echo ""
            if [ -n "$PUBLISHED_RELEASE_TAG" ]; then
              echo "Verified release assets: ${PUBLISHED_RELEASE_TAG}"
            else
              echo "Verified release assets: skipped (no release tag supplied)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
