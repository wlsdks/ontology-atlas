# GitHub Pages — the sole web host for the static export, served at the
# /ontology-atlas subpath. Firebase Hosting was removed (2026-07); Pages has no
# daily transfer hard-cap, so the read-only demo stays up under traffic spikes.
# Triggers on push to main, on GitHub Release publication (so the download
# landing refreshes when a macOS release ships), and on manual dispatch.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_BASE_URL: https://wlsdks.github.io/ontology-atlas
  PUBLISHED_RELEASE_TAG: ${{ github.event.release.tag_name || '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build static export with base path
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /ontology-atlas
          NEXT_PUBLIC_OATLAS_FIRST_RELEASE_PENDING: '0'
      - name: Adapt static PWA manifest to base path
        run: |
          test -f out/manifest.webmanifest
          node -e '
            const fs = require("fs");
            const p = "out/manifest.webmanifest";
            const m = JSON.parse(fs.readFileSync(p, "utf8"));
            const bp = "/ontology-atlas";
            for (const k of ["id", "scope", "start_url"]) {
              if (typeof m[k] === "string" && m[k].startsWith("/") && !m[k].startsWith(bp)) m[k] = bp + (m[k] === "/" ? "/" : m[k]);
            }
            for (const icon of m.icons ?? []) {
              if (icon.src?.startsWith("/") && !icon.src.startsWith(bp)) icon.src = bp + icon.src;
            }
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          '
      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify-hosted:
    name: Verify hosted download surface
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Enable Corepack pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify hosted download surface
        run: pnpm desktop:verify-hosted -- --base-url="$PAGES_BASE_URL"
      - name: Verify published release download assets
        if: env.PUBLISHED_RELEASE_TAG != ''
        run: pnpm desktop:verify-download -- --tag="$PUBLISHED_RELEASE_TAG"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Summarize hosted download deployment
        run: |
          {
            echo "## Hosted Download Site"
            echo ""
            echo "Public URL: ${PAGES_BASE_URL}"
            echo ""
            echo "Verified routes:"
            echo "- ${PAGES_BASE_URL}/ko/"
            echo "- ${PAGES_BASE_URL}/ko/download/"
            echo ""
            if [ -n "$PUBLISHED_RELEASE_TAG" ]; then
              echo "Verified release assets: ${PUBLISHED_RELEASE_TAG}"
            else
              echo "Verified release assets: skipped (no release tag supplied)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
