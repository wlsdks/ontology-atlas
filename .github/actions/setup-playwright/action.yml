name: Setup Playwright
description: >-
  Node · pnpm · 브라우저 캐시 · 변경 분류를 한 번에. E2E 잡 다섯이 같은 준비를
  하므로 여기 한 곳에 둔다 — 복사본이 다섯이면 어긋나는 쪽이 기본값이다(이
  저장소가 스킬 사본으로 이미 겪었다).

  ⚠️ **체크아웃은 여기 못 넣는다.** 로컬 복합 액션은 워크스페이스에 이미 있어야
  로드되므로, 체크아웃보다 먼저 부르면 `action.yml` 을 못 찾고 죽는다. 그래서
  체크아웃만 각 잡의 첫 스텝으로 남고 `fetch-depth: 0` 도 거기 붙는다.

outputs:
  runtime:
    description: shipped code(런타임)가 바뀌었나
    value: ${{ steps.classify.outputs.runtime }}
  browser:
    description: 브라우저가 의존하는 경로가 바뀌었나
    value: ${{ steps.classify.outputs.browser }}
  e2e:
    description: e2e 인프라(스펙·Playwright 설정) 자체가 바뀌었나
    value: ${{ steps.classify.outputs.e2e }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.18.0 --activate
        pnpm --version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Resolve installed Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -e "console.log(require('@playwright/test/package.json').version)")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Since the cache key is identical across jobs, five jobs share the same browser cache.
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # apt has no upper limit on waiting. If a mirror doesn't respond, it waits forever,
    # and if the only way to break this «forever» is the job timeout, you **only learn of
    # the failure after paying the full cost**. This actually happened on 2026-08-20 — repeating
    # `Ign: http://azure.archive.
    # ubuntu.com/... InRelease` for 19 minutes and 42 seconds caused all four shards to cancel together,
    # no tests ran, and the PR required six re-runs.
    #
    # The two values below eliminate this «forever». Retries are handled by apt itself; if that
    # also fails, `run-with-retry` outside calls it again.
    - name: Bound apt network waits
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99-oatlas-bounded-network >/dev/null <<'CONF'
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "2";
        CONF

    # Browser download is **not best-effort** because without it, nothing works.
    - name: Install Playwright chromium
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: >-
        node scripts/run-with-retry.mjs
        --attempts=3 --timeout-ms=180000 --label="playwright install chromium"
        -- pnpm exec playwright install chromium

    # System libraries are **best-effort**. Most are already included in the runner image,
    # and if truly missing, Playwright fails by naming which library is absent when the browser
    # tries to launch — this judgment is more accurate than apt mirror conditions. We don't stop
    # the entire PR just because a mirror wobbled for a moment. Nor do we silently pass:
    # if both attempts fail, a `::warning` is left.
    - name: Install Playwright system deps (best effort)
      shell: bash
      run: >-
        node scripts/run-with-retry.mjs
        --attempts=2 --timeout-ms=90000 --best-effort
        --label="playwright install-deps chromium"
        -- pnpm exec playwright install-deps chromium

    # Since it's a script using only node built-ins, running it separately per job takes 0 seconds. Grouping
    # under `needs:` with the frontend job serializes its setup time to the front of the total.
    - name: Classify change
      id: classify
      shell: bash
      run: node scripts/classify-change.mjs --base=origin/${{ github.base_ref }}
