name: Setup Playwright
description: >-
  Node · pnpm · 브라우저 캐시 · 변경 분류를 한 번에. E2E 잡 다섯이 같은 준비를
  하므로 여기 한 곳에 둔다 — 복사본이 다섯이면 어긋나는 쪽이 기본값이다(이
  저장소가 스킬 사본으로 이미 겪었다).

  ⚠️ **체크아웃은 여기 못 넣는다.** 로컬 복합 액션은 워크스페이스에 이미 있어야
  로드되므로, 체크아웃보다 먼저 부르면 `action.yml` 을 못 찾고 죽는다. 그래서
  체크아웃만 각 잡의 첫 스텝으로 남고 `fetch-depth: 0` 도 거기 붙는다.

outputs:
  runtime:
    description: shipped code(런타임)가 바뀌었나
    value: ${{ steps.classify.outputs.runtime }}
  browser:
    description: 브라우저가 의존하는 경로가 바뀌었나
    value: ${{ steps.classify.outputs.browser }}
  e2e:
    description: e2e 인프라(스펙·Playwright 설정) 자체가 바뀌었나
    value: ${{ steps.classify.outputs.e2e }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.18.0 --activate
        pnpm --version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Resolve installed Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -e "console.log(require('@playwright/test/package.json').version)")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # 캐시 키가 잡마다 같으므로 다섯 잡이 같은 브라우저 캐시를 공유한다.
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # apt 는 기다리는 데 상한이 없다. 미러가 응답하지 않으면 영원히 기다리고,
    # 그 «영원히» 를 끊는 것이 잡 타임아웃뿐이면 **비용을 전액 치른 뒤에야**
    # 실패를 안다. 2026-08-20 에 실제로 그랬다 — `Ign: http://azure.archive.
    # ubuntu.com/... InRelease` 를 19분 42초 반복하다 네 샤드가 같이 취소됐고,
    # 테스트는 한 줄도 안 돌았으며, PR 하나에 재실행 여섯 번이 들었다.
    #
    # 아래 두 값이 그 «영원히» 를 없앤다. 재시도는 apt 자신이 하고, 그마저
    # 실패하면 바깥의 `run-with-retry` 가 다시 부른다.
    - name: Bound apt network waits
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99-oatlas-bounded-network >/dev/null <<'CONF'
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "2";
        CONF

    # 브라우저 내려받기는 **없으면 아무것도 못 하는** 것이라 best-effort 가 아니다.
    - name: Install Playwright chromium
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: >-
        node scripts/run-with-retry.mjs
        --attempts=3 --timeout-ms=180000 --label="playwright install chromium"
        -- pnpm exec playwright install chromium

    # 시스템 라이브러리는 **best-effort** 다. 러너 이미지에 이미 대부분 들어 있고,
    # 정말 빠졌다면 브라우저가 뜰 때 Playwright 가 어느 라이브러리가 없는지
    # 이름을 대며 실패한다 — 그 판정이 apt 미러의 컨디션보다 정확하다. 미러가
    # 잠깐 흔들렸다는 이유로 PR 전체를 세우지 않는다. 대신 조용히 넘어가지도
    # 않는다: 두 번 다 실패하면 `::warning` 이 남는다.
    - name: Install Playwright system deps (best effort)
      shell: bash
      run: >-
        node scripts/run-with-retry.mjs
        --attempts=2 --timeout-ms=90000 --best-effort
        --label="playwright install-deps chromium"
        -- pnpm exec playwright install-deps chromium

    # node 빌트인만 쓰는 스크립트라 잡마다 따로 돌려도 0초다. 앞단 잡을 두고
    # `needs:` 로 묶으면 그 잡의 준비 시간이 전체 앞에 직렬로 붙는다.
    - name: Classify change
      id: classify
      shell: bash
      run: node scripts/classify-change.mjs --base=origin/${{ github.base_ref }}
