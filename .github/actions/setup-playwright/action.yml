name: Setup Playwright
description: >-
  Set up Node, pnpm, dependencies, the browser cache, and bounded system
  dependencies. Every browser job shares this preparation, so it stays in one
  local action rather than drifting copies. It runs on macOS and Linux: the
  browser cache path follows the system, and the apt steps run on Linux only.

  Checkout cannot live here: a local composite action must already exist in the
  workspace before the runner can load it. The workflow classifies changes first
  and checks out each protected job only when this action will run.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24

    - name: Enable Corepack pnpm
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@10.34.9 --activate
        pnpm --version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Resolve installed Playwright version
      id: playwright-version
      shell: bash
      run: |
        version=$(node -e "console.log(require('@playwright/test/package.json').version)")
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # Since the cache key is identical across jobs, every job on one system shares the browser cache.
    - name: Cache Playwright browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: playwright-cache
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # apt waits on a silent mirror until the job timeout, so its network waits are bounded.
    # A retry after a timed-out attempt waits for the dpkg lock that attempt's root apt-get
    # still holds (the group kill cannot reach it) instead of failing on the lock at once.
    - name: Bound apt network waits
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo tee /etc/apt/apt.conf.d/99-oatlas-bounded-network >/dev/null <<'CONF'
        Acquire::http::Timeout "15";
        Acquire::https::Timeout "15";
        Acquire::Retries "2";
        DPkg::Lock::Timeout "60";
        CONF

    # Browser download is **not best-effort** because without it, nothing works.
    - name: Install Playwright chromium
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: >-
        node scripts/ci/run-with-retry.mjs
        --attempts=3 --timeout-ms=180000 --label="playwright install chromium"
        -- pnpm exec playwright install chromium

    # System libraries are **best-effort**. Most are already included in the runner image,
    # and if truly missing, Playwright fails by naming which library is absent when the browser
    # tries to launch — this judgment is more accurate than apt mirror conditions. We don't stop
    # the entire PR just because a mirror wobbled for a moment. Nor do we silently pass:
    # if both attempts fail, a `::warning` is left.
    - name: Install Playwright system deps (best effort)
      if: runner.os == 'Linux'
      shell: bash
      run: >-
        node scripts/ci/run-with-retry.mjs
        --attempts=2 --timeout-ms=90000 --best-effort
        --label="playwright install-deps chromium"
        -- pnpm exec playwright install-deps chromium
